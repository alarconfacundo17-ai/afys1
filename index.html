function savePagoAnterior(idx){
  const s = SOCIOS[idx];
  const f = $('#pga_f').value;
  if(!f){ showToast('Elegí una fecha.', 'error'); return; }
  const data = {sid:s.id, n:s.n, m:$('#pga_m').value||'$0', f, mp:$('#pga_mp').value, nt:($('#pga_n').value||'Pago anterior al sistema').trim()};
  if(PAGOS.some(p=>p.sid===data.sid && p.f===data.f && p.m===data.m && p.mp===data.mp)){ showToast('Este pago ya existe.','error'); return; }
  s.vence = venceDesdeMp($('#pga_mp').value); // vence el día 10 del mes siguiente (partir del 10 = vencido)
  s.es = 'ok';
  PAGOS.push(data);
  PAGOS.sort((a,b)=>new Date(b.f)-new Date(a.f));
  logMovimiento('pago', `Pago anterior registrado: ${data.m} de ${s.n} (${mesPagoLabel(data.mp)})`);
  persist();
  showToast('Pago anterior guardado');
  closeModal(); renderStaff();
}
function savePago(){
  const s = SOCIOS.find(s=>s.id===$('#pg_s').value);
  if(!s){ showToast('Elegí un socio.', 'error'); return; }
  const med = document.querySelector('input[name="pg_med"]:checked');
  const data = {sid:s.id, n:s.n, m:$('#pg_m').value||'$0', f:$('#pg_f').value||'-', mp:$('#pg_mp').value, med:med?med.value:'Efectivo', nt:$('#pg_n').value};
  if(editPagoKey!==null){
    const realIdx = PAGOS.findIndex(p=>(p.sid+'|'+p.f+'|'+p.m+'|'+p.mp)===editPagoKey);
    if(realIdx>=0) PAGOS[realIdx] = data; else PAGOS.unshift(data);
    // Recalcular vencimiento desde el mes más reciente pagado por este socio
    const latestMp = PAGOS.filter(p=>p.sid===s.id).reduce((best,p)=>(!best||p.mp>best)?p.mp:best, null);
    if(latestMp){ s.vence = venceDesdeMp(latestMp); s.es='ok'; }
  } else {
    if(PAGOS.some(p=>p.sid===data.sid && p.f===data.f && p.m===data.m && p.mp===data.mp)){ showToast('Este pago ya existe.','error'); return; }
    s.vence = venceDesdeMp(data.mp); // vence el día 10 del mes siguiente (partir del 10 = vencido)
    s.es='ok';
    PAGOS.unshift(data);
    if(currentRole==='profesor'){
      const st = currentStaff();
      notifStaff.unshift({txt:`${st?st.n:'Un profesor'} cargó un pago de ${data.m} para ${s.n}.`, new:true});
    }
    logMovimiento('pago', `Pago registrado: ${data.m} de ${s.n} (${mesPagoLabel(data.mp)})`);
  }
  editPagoIdx = null; editPagoKey = null;
  persist();
  showToast('Guardado');
  closeModal(); renderStaff();
}
function deletePago(payIdx){
  if(!confirm('¿Eliminar este pago? No se modificará el estado del socio.')) return;
  const realIdx = editPagoKey
    ? PAGOS.findIndex(p=>(p.sid+'|'+p.f+'|'+p.m+'|'+p.mp)===editPagoKey)
    : payIdx;
  const pEliminado = realIdx>=0 ? PAGOS[realIdx] : null;
  if(pEliminado){
    logMovimiento('eliminacion_pago', `Eliminación de pago: ${pEliminado.m} de ${pEliminado.n}`);
    const pk = pEliminado.sid+'|'+pEliminado.f+'|'+pEliminado.m+'|'+pEliminado.mp;
    if(!deletedPagoKeys.includes(pk)) deletedPagoKeys.push(pk);
    PAGOS.splice(realIdx,1);
  }
  editPagoIdx = null; editPagoKey = null;
  persist();
  showToast('Eliminado');
  closeModal(); renderStaff();
}

function saveClase(){
  const n=$('#cl_n').value.trim()||'Nueva clase';
  const d=$('#cl_d').value;
  const h=timeSelectValue('cl_h')||'08:00';
  const dur=parseInt($('#cl_dur').value)||60;

  let ins, insId;
  if(insSel==='__otro__'){ ins = $('#cl_ins_otro').value.trim()||'Sin asignar'; insId = null; }
  else { const p = STAFF.find(s=>s.id===insSel); ins = p?p.n:'Sin asignar'; insId = p?p.id:null; }
  const cupo = $('#cl_c').value||12;
  let c;
  if(editClaseIdx!==null){
    c = CLASES_HOY[editClaseIdx];

    Object.assign(c, {n,d,h,dur,ins,insId,cu:`${entradas}/${cupo}`});
  } else {
    c = {n,d,h,dur,ins,insId,cu:`0/${cupo}`,cId:newClaseId()};

function addMinutes(hhmm, minutes){
  const mins = hToMin(hhmm)+minutes;
  const h = Math.floor((mins%1440)/60), m = mins%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function newClaseId(){
  return 'cl_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}
function syncClaseTurno(c){
  if(!c.cId) c.cId = newClaseId();
  if(!DIAS_SEMANA.includes(c.d)) return; // sin día válido de la semana, no se puede ubicar en el calendario
  const staffMatch = c.insId ? STAFF.find(s=>s.id===c.insId) : STAFF.find(s=>s.n===c.ins);
  const data = {dia:c.d, desde:c.h, hasta:addMinutes(c.h,c.dur||60), clase:c.n, staffId: staffMatch?staffMatch.id:null, claseId:c.cId};
  const existing = TURNOS.find(t=>t.claseId===c.cId);
  if(existing) Object.assign(existing, data);
  else TURNOS.push({id:turnoSeq++, ...data});
}

function duplicarRutina(idx){
  const r = RUTINAS[idx];
  let base = r.n+' (copia)', n = base, i = 2;
  while(RUTINAS.some(x=>x.n===n)){ n = base+' '+i; i++; }
  const copia = {n, t:r.t, ob:r.ob, cr:'Tú', ejs:r.ejs.map(e=>({...e}))};
  RUTINAS.push(copia);
  persist();
  // Buscar por nombre después del merge para que el índice sea correcto
  const newIdx = RUTINAS.findIndex(x=>x.n===n);
  openRutinaModal(newIdx>=0 ? newIdx : RUTINAS.length-1);

  const r = RUTINAS[idx];

  if(!deletedRutinaNames.includes(r.n)) deletedRutinaNames.push(r.n);
  SOCIOS.forEach(s=>{
    if(!Array.isArray(s.rs)) return;
    if(s.rs.includes(r.n)){
      s.rs = s.rs.filter(n=>n!==r.n);
      if(!Array.isArray(s.rsRemoved)) s.rsRemoved = [];
      if(!s.rsRemoved.includes(r.n)) s.rsRemoved.push(r.n);
    }
    if(s.rsDias) delete s.rsDias[r.n];
    if(s.rsNotas) delete s.rsNotas[r.n];
    if(s.rsNombre) delete s.rsNombre[r.n];

function asignarRutina(si, rname, idx, search){
  let s = SOCIOS[si];
  if(!s) return; // stale idx guard
  if(!s.rs.includes(rname)) s.rs.push(rname);
  if(s.rsRemoved) s.rsRemoved = s.rsRemoved.filter(r=>r!==rname);

  refreshAsignarModal(idx, search);
}

function quitarRutina(si, rname, idx, search){
  const s = SOCIOS[si];
  if(!s) return; // stale idx guard
  s.rs = s.rs.filter(r=>r!==rname);
  if(!s.rsRemoved) s.rsRemoved = [];
  if(!s.rsRemoved.includes(rname)) s.rsRemoved.push(rname);
  if(s.rsDias) delete s.rsDias[rname];
  if(s.rsNotas) delete s.rsNotas[rname];
  if(s.rsNombre) delete s.rsNombre[rname];
  if(s.rsOverride) delete s.rsOverride[rname];
  persist();
  refreshAsignarModal(idx, search);
}

let dragSrcIdx = null;
function dragReorder(arr, from, to, renderFn){
  if(from===null || from===undefined || from===to) return;
  const [item] = arr.splice(from,1);
  arr.splice(to,0,item);
  dragSrcIdx = null;
  persist();

}

function ejDrop(e, i){ e.preventDefault(); [...(document.getElementById('rtEjs')?.children||[])].forEach(r=>r.style.borderTop=''); dragReorder(currentEjsArr,dragSrcIdx,i,currentEjsRenderFn); }
// Touch drag handlers para ejercicios (mobile)
let _ejTouch = null;
function ejTouchStart(e, i){
  const container = document.getElementById('rtEjs');
  if(!container) return;
  _ejTouch = { idx:i, startY:e.touches[0].clientY, targetIdx:i, container, rows:[...container.children] };
  container.children[i] && (container.children[i].style.opacity='0.45');
  document.addEventListener('touchmove', _ejTouchMove, {passive:false});
  document.addEventListener('touchend', _ejTouchEnd, {once:true});
  e.stopPropagation();
}
function _ejTouchMove(e){
  if(!_ejTouch) return;
  e.preventDefault();
  const y = e.touches[0].clientY;
  let target = _ejTouch.idx;
  _ejTouch.rows.forEach((row,ri)=>{ const r=row.getBoundingClientRect(); if(y>=r.top&&y<=r.bottom) target=ri; });
  _ejTouch.targetIdx = target;
  _ejTouch.rows.forEach((row,ri)=>{ row.style.borderTop = (ri===target&&target!==_ejTouch.idx)?'2px solid var(--primary)':''; });
}
function _ejTouchEnd(){
  if(!_ejTouch) return;
  document.removeEventListener('touchmove', _ejTouchMove);
  const {idx, targetIdx, rows, container} = _ejTouch;
  _ejTouch = null;
  rows.forEach(r=>{ r.style.opacity=''; r.style.borderTop=''; });
  if(targetIdx !== idx){ const [item]=currentEjsArr.splice(idx,1); currentEjsArr.splice(targetIdx,0,item); persist(); renderEjsRows(); }
}
function saveRutina(){
  const n = $('#rt_n').value.trim()||'Nueva rutina';
  let t = $('#rt_t').value;
  if(t==='Otro') t = $('#rt_t_otro_val').value.trim()||'Otro';
  const ob = $('#rt_ob').value;
  const ejs = currentEjsArr.filter(e=>e.n).map(e=> e.modo==='tiempo' ? {n:e.n,modo:'tiempo',tiempo:e.tiempo||'',v:''} : {n:e.n,s:parseInt(e.s)||3,r:e.r,v:''});
  if(editRutinaIdx!==null){
    // Buscar por nombre para evitar índice desactualizado si el merge remoto reordenó RUTINAS
    const stableIdx = _editingRutinaName ? RUTINAS.findIndex(r=>r.n===_editingRutinaName) : editRutinaIdx;
    const r = RUTINAS[stableIdx>=0 ? stableIdx : editRutinaIdx];
    if(!r){ showToast('No se encontró la rutina. Intentá de nuevo.','error'); return; }
    if(r.n!==n){
      // tombstonear el nombre viejo para que el merge remoto no lo reimporte
      if(!deletedRutinaNames.includes(r.n)) deletedRutinaNames.push(r.n);
      deletedRutinaNames = deletedRutinaNames.filter(x=>x!==n); // si el nuevo nombre era un tombstone, limpiarlo
      SOCIOS.forEach(s=>{
        s.rs = s.rs.map(x=>x===r.n?n:x);
        if(s.rsDias && s.rsDias[r.n]){ s.rsDias[n] = s.rsDias[r.n]; delete s.rsDias[r.n]; }
        if(s.rsNotas && s.rsNotas[r.n]){ s.rsNotas[n] = s.rsNotas[r.n]; delete s.rsNotas[r.n]; }
        if(s.rsNombre && s.rsNombre[r.n]){ s.rsNombre[n] = s.rsNombre[r.n]; delete s.rsNombre[r.n]; }
        if(s.rsOverride && s.rsOverride[r.n]){ s.rsOverride[n] = s.rsOverride[r.n]; delete s.rsOverride[r.n]; }
        if(Array.isArray(s.rsRemoved)) s.rsRemoved = s.rsRemoved.map(x=>x===r.n?n:x);
      });
    }
    r.n=n; r.t=t; r.ob=ob; r.ejs=ejs; r.ts=Date.now();
  } else {
    if(RUTINAS.some(r=>r.n===n)){ showToast('Ya existe una rutina con ese nombre.','error'); return; }
    RUTINAS.push({n, t, ob, cr:'Tú', ejs});
  }
  persist();
  showToast('Guardado');
  closeModal(); renderRutinasTable();
}

function hToMin(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
function proximoTurnoProfesor(st){
  if(!st) return null;
  const turnos = TURNOS.filter(t=>t.staffId===st.id);
  if(!turnos.length) return null;
  const now = new Date();
  const DIAS_JS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const idxHoy = DIAS_SEMANA.indexOf(DIAS_JS[now.getDay()]);
  const nowMin = now.getHours()*60+now.getMinutes();
  for(let off=0; off<7; off++){
    const dia = DIAS_SEMANA[(idxHoy+off)%7];
    const deDia = turnos.filter(t=>t.dia===dia && (off>0 || hToMin(t.desde)>nowMin)).sort((a,b)=>hToMin(a.desde)-hToMin(b.desde));
    if(deDia.length) return deDia[0];
  }
  return null;
}

const DIA_JS_IDX = {'Domingo':0,'Lunes':1,'Martes':2,'Miércoles':3,'Jueves':4,'Viernes':5,'Sábado':6};
function turnoHoras(t){ return Math.max(0,(hToMin(t.hasta)-hToMin(t.desde))/60); }
function weeklyHorasPorProfe(profes){
  return profes.map(p=>({
    p, horas: TURNOS.filter(t=>t.staffId===p.id).reduce((a,t)=>a+turnoHoras(t),0)
  }));
}
function monthOccurrences(dia, year, month){
  const target = DIA_JS_IDX[dia];
  const last = new Date(year, month+1, 0).getDate();
  let count = 0;
  for(let d=1; d<=last; d++){ if(new Date(year,month,d).getDay()===target) count++; }
  return count;
}
function monthlyHorasPorProfe(profes, year, month){
  return profes.map(p=>({
    p, horas: TURNOS.filter(t=>t.staffId===p.id).reduce((a,t)=>a+turnoHoras(t)*monthOccurrences(t.dia,year,month),0)
  }));
}

function saveTurno(turnoId){
  const _aliasVal = $('#tn_alias') ? $('#tn_alias').value.trim() : '';
  if(_aliasVal){
    const _stEdit = [...STAFF,...DUENOS].find(p=>p.id===$('#tn_s').value);
    if(_stEdit) _stEdit.alias = _aliasVal;
  }
  const data = {staffId:$('#tn_s').value, dia:$('#tn_d').value, desde:timeSelectValue('tn_de'), hasta:timeSelectValue('tn_ha'), clase:$('#tn_cl').value.trim()};
  let turnoObj;
  if(turnoId && turnoId!=='null'){
    turnoObj = TURNOS.find(x=>x.id===turnoId);
    if(turnoObj) Object.assign(turnoObj, data);
  } else {
    turnoObj = {id:turnoSeq++, ...data};
    TURNOS.push(turnoObj);
  }
  // Si tiene clase, sincronizar con CLASES_HOY
  if(turnoObj && turnoObj.clase){
    const staffPerson = [...STAFF,...DUENOS].find(p=>p.id===turnoObj.staffId);
    const dur = hToMin(turnoObj.hasta) - hToMin(turnoObj.desde);
    if(turnoObj.claseId){
      // Actualizar entrada existente en CLASES_HOY
      const c = CLASES_HOY.find(x=>x.cId===turnoObj.claseId);
      if(c){ Object.assign(c, {n:turnoObj.clase, d:turnoObj.dia, h:turnoObj.desde, dur, ins:staffPerson?staffPerson.n:'Sin asignar', insId:staffPerson?staffPerson.id:null}); }
      else {
        // La entrada fue eliminada — recrearla
        const newC = {n:turnoObj.clase, d:turnoObj.dia, h:turnoObj.desde, dur, ins:staffPerson?staffPerson.n:'Sin asignar', insId:staffPerson?staffPerson.id:null, cu:'0/12', cId:turnoObj.claseId};
        CLASES_HOY.push(newC);
      }
    } else {
      // Clase nueva sin claseId — crear en CLASES_HOY y vincular
      const newCId = newClaseId();
      turnoObj.claseId = newCId;
      const newC = {n:turnoObj.clase, d:turnoObj.dia, h:turnoObj.desde, dur, ins:staffPerson?staffPerson.n:'Sin asignar', insId:staffPerson?staffPerson.id:null, cu:'0/12', cId:newCId};
      CLASES_HOY.push(newC);
    }
  } else if(turnoObj && !turnoObj.clase && turnoObj.claseId){
    // Le borraron la clase al turno — eliminar de CLASES_HOY también
    const cIdx = CLASES_HOY.findIndex(x=>x.cId===turnoObj.claseId);
    if(cIdx>=0){
      if(!deletedClaseIds.includes(turnoObj.claseId)) deletedClaseIds.push(turnoObj.claseId);
      CLASES_HOY.splice(cIdx,1);
    }
    delete turnoObj.claseId;
  }
  persist();
  showToast('Guardado');
  closeModal(); renderStaff();
}
function deleteTurno(turnoId){
  const _dt = TURNOS.find(x=>x.id===turnoId);
  if(_dt && _dt.claseId){
    if(!deletedClaseIds.includes(_dt.claseId)) deletedClaseIds.push(_dt.claseId);
    const _cIdx = CLASES_HOY.findIndex(c=>c.cId===_dt.claseId);
    if(_cIdx>=0) CLASES_HOY.splice(_cIdx,1);
  }
  if(!deletedTurnoIds.includes(turnoId)) deletedTurnoIds.push(turnoId);
  TURNOS = TURNOS.filter(t=>t.id!==turnoId);
  persist(); closeModal(); renderStaff();
}

  delete EJ_IMAGES[name];
  RUTINAS.forEach(r=>{ r.ejs = r.ejs.filter(e=>e.n!==name); });

    if(s.rsMiSR) Object.values(s.rsMiSR).forEach(sr=>delete sr[name]);

  });
  persist();

  Object.keys(EJD).forEach(g=>{ EJD[g] = EJD[g].map(e=>e===oldName?newName:e).sort((a,b)=>a.localeCompare(b,'es')); });
  if(EJ_VIDEOS[oldName]!==undefined){ EJ_VIDEOS[newName] = EJ_VIDEOS[oldName]; delete EJ_VIDEOS[oldName]; }
  if(EJ_IMAGES[oldName]!==undefined){ EJ_IMAGES[newName] = EJ_IMAGES[oldName]; delete EJ_IMAGES[oldName]; }
  RUTINAS.forEach(r=>{ r.ejs.forEach(e=>{ if(e.n===oldName) e.n = newName; }); });
  SOCIOS.forEach(s=>{
    if(s.rsOverride) Object.values(s.rsOverride).forEach(ejs=>{ ejs.forEach(e=>{ if(e.n===oldName) e.n = newName; }); });
    if(s.rsMiPeso) Object.values(s.rsMiPeso).forEach(mp=>{ if(mp[oldName]!==undefined){ mp[newName] = mp[oldName]; delete mp[oldName]; } });
    if(s.rsMiSR) Object.values(s.rsMiSR).forEach(sr=>{ if(sr[oldName]!==undefined){ sr[newName] = sr[oldName]; delete sr[oldName]; } });
    if(s.rsHechos) Object.values(s.rsHechos).forEach(h=>{ if(h[oldName]!==undefined){ h[newName] = h[oldName]; delete h[oldName]; } });
  });
  persist();
  closeModal();
  renderStaff();
}

function saveEjercicioGrupos(name){
  const checked = Object.keys(EJD).filter(g=>document.getElementById('eg_'+g)?.checked);
  if(!checked.length){ alert('El ejercicio debe pertenecer a al menos un tipo.'); return; }
  Object.keys(EJD).forEach(g=>{
    const has = EJD[g].includes(name);
    const should = checked.includes(g);
    if(should && !has) EJD[g].push(name);
    else if(!should && has) EJD[g] = EJD[g].filter(e=>e!==name);
  });
  Object.keys(EJD).forEach(g=>EJD[g].sort((a,b)=>a.localeCompare(b,'es')));
  persist();
  closeModal(); renderStaff();
}

function guardarEliteDeportista(id){
  const n = ($('#eliteNombre')||{}).value?.trim();
  const dni = ($('#eliteDni')||{}).value?.trim();
  const errEl = $('#eliteFormErr');
  if(!n || !dni){
    if(errEl){ errEl.textContent='El nombre y el DNI son obligatorios.'; errEl.style.display='block'; }
    return;
  }
  // Verificar DNI único
  const existente = eliteByDni(dni);
  if(existente && existente.id !== id){
    if(errEl){ errEl.textContent='Ya existe un deportista con ese DNI.'; errEl.style.display='block'; }
    return;
  }
  if(id){
    const d = eliteById(id);
    if(!d) return;
    d.n = n; d.dni = dni;
    d.disciplina = ($('#eliteDisciplina')||{}).value?.trim()||'';
    d.tel = ($('#eliteTel')||{}).value?.trim()||'';
    d.email = ($('#eliteEmail')||{}).value?.trim()||'';
    d.ob = ($('#eliteOb')||{}).value?.trim()||'';
    showToast('Deportista actualizado', 'ok');
  } else {
    const newId = 'elite_' + Date.now() + '_' + (eliteSeq++);
    ELITE_DEPORTISTAS.push({
      id: newId, n, dni,
      disciplina: $('#eliteDisciplina').value.trim(),
      tel: $('#eliteTel').value.trim(),
      email: $('#eliteEmail').value.trim(),
      ob: $('#eliteOb').value.trim(),
      rs: [], rsHechos: {}, rsOverride: {}, rsRemoved: [], rsMiPeso: {}, rsMiSR: {},
      competencias: [], pse: [], planSemanal: {}, planFechas: {},
      ultimoEntreno: null, activo: true,
    });
    showToast('Deportista creado', 'ok');
  }
  persist();
  closeModal();
  staffPage = 'elite';
  renderStaff();
}

function eliteToggleCompletadaHoy(id, rname){
  const d = eliteById(id);
  if(!d) return;
  const r = RUTINAS.find(x=>x.n===rname);
  if(!r) return;
  const todayStr = todayISO();
  if(!d.rsHechos) d.rsHechos = {};
  if(!d.rsHechos[rname]) d.rsHechos[rname] = {};
  const ejs = r.ejs||[];
  const completo = ejs.length>0 && ejs.every(e=>d.rsHechos[rname][e.n]===todayStr);
  if(completo){
    // Desmarcar: usar null como tombstone para que el merge no lo restaure
    ejs.forEach(e=>{ d.rsHechos[rname][e.n] = null; });
    showToast('Rutina desmarcada','ok');
  } else {
    ejs.forEach(e=>{ d.rsHechos[rname][e.n] = todayStr; });
    if(!d.ultimoEntreno||d.ultimoEntreno.f<todayStr) d.ultimoEntreno={r:rname,f:todayStr};
    showToast('Rutina marcada como completada hoy','ok');
  }
  persist();
  refreshEliteDeportistaModal(id);
}

function openElitePseFechasModal(id){
  const d = eliteById(id);
  if(!d){ showToast('Deportista no encontrado','warn'); return; }
  const pse = Array.isArray(d.pse) ? d.pse : [];
  if(!pse.length){
    openModal(`
      <div class="modal-head">
        <h3 style="font-size:15px;"><i class="ti ti-heart-rate-monitor"></i> PSE — ${esc(d.n)}</h3>
        <button onclick="closeModal()">✕</button>
      </div>
      <div style="padding:32px 16px;text-align:center;color:var(--text2);">
        <i class="ti ti-chart-bar" style="font-size:36px;display:block;margin-bottom:12px;opacity:.3;"></i>
        <p style="margin:0;font-size:14px;">Sin PSE registradas todavía.</p>
      </div>`);
    return;
  }
  // Agrupar por fecha, mantener las rutinas de ese día
  const byFecha = {};
  pse.forEach(p=>{
    if(!byFecha[p.f]) byFecha[p.f] = {rnames: new Set(), pre:false, post:false};
    byFecha[p.f].rnames.add(p.rname||'');
    if(p.tipo==='pre') byFecha[p.f].pre = true;
    if(p.tipo==='post') byFecha[p.f].post = true;
  });
  const fechas = Object.keys(byFecha).sort((a,b)=>b.localeCompare(a));
  const rows = fechas.map(f=>{
    const g = byFecha[f];
    const rnames = [...g.rnames].filter(Boolean).join(', ');
    const [yr,mo,dy] = f.split('-');
    const fechaLeg = `${dy}/${mo}/${yr}`;
    return `<div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border2);cursor:pointer;-webkit-tap-highlight-color:transparent;" onclick="openElitePseDiaModal('${id}','${f}')">
      <div style="width:40px;height:40px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="ti ti-calendar" style="font-size:18px;color:var(--primary);"></i>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:14px;">${fechaLeg}</div>
        ${rnames?`<div style="font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(rnames)}</div>`:''}
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0;">
        ${g.pre?`<span style="background:var(--primary-light);color:var(--primary);border-radius:8px;padding:2px 7px;font-size:10px;font-weight:700;">PRE</span>`:''}
        ${g.post?`<span style="background:rgba(5,150,105,.12);color:var(--green);border-radius:8px;padding:2px 7px;font-size:10px;font-weight:700;">POST</span>`:''}
      </div>
      <i class="ti ti-chevron-right" style="font-size:16px;color:var(--text2);"></i>
    </div>`;
  }).join('');
  openModal(`
    <div class="modal-head">
      <h3 style="font-size:15px;"><i class="ti ti-heart-rate-monitor"></i> PSE — ${esc(d.n)}</h3>
      <button onclick="closeModal()">✕</button>
    </div>
    <div style="overflow-y:auto;max-height:75vh;-webkit-overflow-scrolling:touch;">
      <div style="padding:10px 16px 6px;font-size:12px;color:var(--text2);">${fechas.length} día${fechas.length!==1?'s':''} con PSE registrada</div>
      ${rows}
    </div>`);
}

function openElitePseDiaModal(id, fecha){
  const d = eliteById(id);
  if(!d) return;
  const pse = (d.pse||[]).filter(p=>p.f===fecha);
  const [yr,mo,dy] = fecha.split('-');
  const fechaLeg = `${dy}/${mo}/${yr}`;

  function renderEntrada(p){
    const resp = p.r||{};
    const preguntas = p.tipo==='pre' ? PSE_PRE : PSE_POST;
    const isPre = p.tipo==='pre';
    const items = preguntas.map(q=>{
      const v = resp[q.id];
      if(v===undefined||v===null||v==='') return '';
      const isRpe = q.id==='rpe';
      const color = isRpe?(+v<=3?'var(--green)':+v<=6?'#d97706':'var(--red)'):'var(--primary)';
      return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2);">
        <span style="font-size:13px;color:var(--text2);flex:1;">${esc(q.label)}</span>
        <span style="font-size:13px;font-weight:700;color:${color};flex-shrink:0;text-align:right;">${esc(String(v))}</span>
      </div>`;
    }).filter(Boolean).join('');
    return `<div style="background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="background:${isPre?'var(--primary-light)':'rgba(5,150,105,.12)'};color:${isPre?'var(--primary)':'var(--green)'};border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;">${isPre?'Antes del entrenamiento':'Después del entrenamiento'}</span>
        ${p.rname?`<span style="font-size:12px;color:var(--text2);">${esc(p.rname)}</span>`:''}
      </div>
      ${items||`<p style="font-size:13px;color:var(--text2);margin:0;">Sin respuestas guardadas.</p>`}
    </div>`;
  }

  const preEntradas = pse.filter(p=>p.tipo==='pre');
  const postEntradas = pse.filter(p=>p.tipo==='post');
  const html = [
    preEntradas.length ? preEntradas.map(renderEntrada).join('') : '',
    postEntradas.length ? postEntradas.map(renderEntrada).join('') : '',
    !pse.length ? `<p style="font-size:13px;color:var(--text2);">Sin datos para esta fecha.</p>` : ''
  ].join('');

  openModal(`
    <div class="modal-head">
      <div>
        <h3 style="font-size:15px;">${fechaLeg}</h3>
        <p style="font-size:12px;color:var(--text2);margin:2px 0 0;">${esc(d.n)}</p>
      </div>
      <button onclick="openElitePseFechasModal('${id}')"><i class="ti ti-arrow-left"></i></button>
    </div>
    <div style="padding:16px;overflow-y:auto;max-height:75vh;-webkit-overflow-scrolling:touch;">
      ${html}
    </div>`);
}

  const pses = d.pse.slice().reverse();
  const rows = pses.map(p=>{
    const resp = p.r||{};
    const preguntasList = p.tipo==='pre'?PSE_PRE:PSE_POST;

      return `<div style="display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:3px 0;">

        <span style="font-weight:700;color:${q.id==='rpe'?(+v<=3?'var(--green)':+v<=6?'#d97706':'var(--red)'):'var(--primary)'};">${esc(String(v))}</span>
      </div>`;
    }).filter(Boolean).join('');
    return `<div style="background:var(--bg2);border-radius:12px;padding:12px;margin-bottom:10px;">

      </div>
      ${respItems||`<span style="font-size:12px;color:var(--text2);">Sin respuestas guardadas.</span>`}

  }).join('');
  openModal(`
    <div class="modal-head">

      ${rows}
    </div>`);
}

function _weekMonday(dateStr){
  const dt = new Date(dateStr+'T12:00:00');
  const day = dt.getDay();
  const diff = day===0 ? -6 : 1-day;
  dt.setDate(dt.getDate()+diff);
  return dt.toISOString().slice(0,10);
}

function openEliteEntrenamientosModal(id){
  const d = eliteById(id);
  if(!d) return;
  const rh = d.rsHechos||{};
  const pse = d.pse||[];

  // Recolectar todas las fechas con actividad o plan
  const dateSet = new Set();
  for(const rname of Object.keys(rh)){
    for(const val of Object.values(rh[rname])){
      if(val && typeof val==='string' && val.length===10) dateSet.add(val);
    }
  }
  pse.forEach(p=>{ if(p.f) dateSet.add(p.f); });
  // Incluir fechas del plan (planFechas) para que aparezcan aunque no haya ejercicios completados
  Object.keys(d.planFechas||{}).forEach(ds=>{ if((d.planFechas||{})[ds]) dateSet.add(ds); });

  if(!dateSet.size){
    openModal(`<div class="modal-head"><h3 style="font-size:15px;"><i class="ti ti-calendar-stats"></i> Entrenamientos — ${esc(d.n)}</h3><button onclick="closeModal()">✕</button></div>
      <div style="padding:40px 16px;text-align:center;color:var(--text2);"><i class="ti ti-calendar-off" style="font-size:40px;display:block;margin-bottom:12px;opacity:.3;"></i><p style="margin:0;font-size:14px;">Sin entrenamientos registrados aún.</p></div>`);
    return;
  }

  // Agrupar por semana
  const weekMap = {};
  for(const ds of dateSet){
    const wk = _weekMonday(ds);
    if(!weekMap[wk]) weekMap[wk] = [];
    weekMap[wk].push(ds);
  }

  const DIAS_L = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  function fmtDate(ds){
    const dt = new Date(ds+'T12:00:00');
    return `${dt.getDate()} ${MESES_C[dt.getMonth()]}`;
  }

  function pseResumen(pseObj){
    if(!pseObj) return '';
    const r = pseObj.r || {};
    const parts = [];
    if(r.energia!=null && r.energia!=='') parts.push(`Energía: <b>${esc(String(r.energia))}</b>`);
    if(r.sueno!=null && r.sueno!=='') parts.push(`Sueño: <b>${esc(String(r.sueno))}</b>`);
    if(r.dolor!=null && r.dolor!=='') parts.push(`Dolor: <b>${esc(String(r.dolor))}</b>`);
    if(r.animo!=null && r.animo!=='') parts.push(`Ánimo: <b>${esc(String(r.animo))}</b>`);
    if(r.nota_pre) parts.push(`Nota: <b>${esc(r.nota_pre)}</b>`);
    return parts.join(' · ');
  }

  function psePostResumen(pseObj){
    if(!pseObj) return '';
    const r = pseObj.r || {};
    const parts = [];
    if(r.rpe!=null && r.rpe!=='') parts.push(`RPE: <b>${esc(String(r.rpe))}/10</b>`);
    if(r.carga!=null && r.carga!=='') parts.push(`Carga: <b>${esc(String(r.carga))}</b>`);
    if(r.recuperacion!=null && r.recuperacion!=='') parts.push(`Recuperación: <b>${esc(String(r.recuperacion))}</b>`);
    if(r.satisfaccion!=null && r.satisfaccion!=='') parts.push(`Conformidad: <b>${esc(String(r.satisfaccion))}</b>`);
    if(r.nota_post) parts.push(`Nota: <b>${esc(r.nota_post)}</b>`);
    return parts.join(' · ');
  }

  const planSemanal = d.planSemanal||{};

  // Incluir también las semanas que tienen días planificados aunque no haya actividad
  const todayStr = todayISO();
  // Agregar la semana actual siempre (para ver el plan aunque no haya entrenamientos)
  dateSet.add(todayStr);
  // Re-poblar weekMap con las fechas actualizadas
  const weekMapFull = {};
  for(const ds of dateSet){
    const wk = _weekMonday(ds);
    if(!weekMapFull[wk]) weekMapFull[wk] = new Set();
    weekMapFull[wk].add(ds);
  }
  // Helper: rutinas planificadas para un día de semana (número 0-6)
  function rutinasDelDia(dayNum){
    return Object.keys(planSemanal).filter(rname=>{
      const dias = planSemanal[rname];
      return Array.isArray(dias) && dias.includes(Number(dayNum));
    });
  }
  // Para cada semana, completar los días que tienen plan
  for(const wkMon of Object.keys(weekMapFull)){
    const wkDt = new Date(wkMon+'T12:00:00');
    for(let i=0;i<7;i++){
      const d2 = new Date(wkDt); d2.setDate(d2.getDate()+i);
      const ds = d2.toISOString().slice(0,10);
      if((d.planFechas||{})[ds] || rutinasDelDia(d2.getDay()).length) weekMapFull[wkMon].add(ds);
    }
  }

  // Ordenar semanas de más antigua a más reciente
  const weeks = Object.keys(weekMapFull).sort();

  // Determinar semana a mostrar: por defecto la semana actual (o la más cercana)
  const todayWk = _weekMonday(todayStr);
  let wkIdx = weeks.indexOf(todayWk);
  if(wkIdx < 0) wkIdx = weeks.length - 1;
  // Si se pasa wkIdx como 2do argumento (navegación prev/next)
  if(typeof arguments[1] === 'number') wkIdx = Math.max(0, Math.min(weeks.length-1, arguments[1]));

  const wkMon = weeks[wkIdx];
  const wkEnd = new Date(wkMon+'T12:00:00'); wkEnd.setDate(wkEnd.getDate()+6);
  const wkEndStr = wkEnd.toISOString().slice(0,10);

  const MESES_C2 = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fmtDateShort(ds){ const dt=new Date(ds+'T12:00:00'); return `${dt.getDate()} ${MESES_C2[dt.getMonth()]}`; }

  // Rango de fechas de la semana
  const wkLabel = `${fmtDateShort(wkMon)} – ${fmtDateShort(wkEndStr)}`;

  // Botones de navegación
  const btnStyle = `all:unset;width:34px;height:34px;border-radius:10px;background:var(--bg);border:1px solid var(--border2);font-size:18px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;line-height:34px;display:inline-flex;align-items:center;justify-content:center;`;
  const prevBtn = wkIdx > 0
    ? `<button style="${btnStyle}" onclick="openEliteEntrenamientosModal('${id}',${wkIdx-1})">‹</button>`
    : `<button style="${btnStyle}opacity:.3;" disabled>‹</button>`;
  const nextBtn = wkIdx < weeks.length-1
    ? `<button style="${btnStyle}" onclick="openEliteEntrenamientosModal('${id}',${wkIdx+1})">›</button>`
    : `<button style="${btnStyle}opacity:.3;" disabled>›</button>`;

  const DIAS_ABR2 = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

  const wkDays = [];
  const wkDt = new Date(wkMon+'T12:00:00');
  for(let i=0;i<7;i++){
    const d2 = new Date(wkDt); d2.setDate(d2.getDate()+i);
    wkDays.push(d2.toISOString().slice(0,10));
  }

  const dayCells = wkDays.map(ds=>{
    const dt = new Date(ds+'T12:00:00');
    const planItems = getPlanItems(d, ds);
    const comp = (d.competencias||[]).find(c=>c.f===ds);

    const rutDia = (d.rs||[]).map(rname=>{
      const r = RUTINAS.find(x=>x.n===rname);
      const ejs = r ? r.ejs||[] : [];
      const rhR = rh[rname]||{};
      const hechos = ejs.filter(e=>rhR[e.n]===ds).length;
      if(!hechos) return null;
      return {rname, hechos, total:ejs.length, completo: hechos===ejs.length && ejs.length>0};
    }).filter(Boolean);

    const hasPlan = planItems.length > 0;
    const hasActivity = rutDia.length > 0;
    const isToday = ds === todayStr;
    const isPast = ds < todayStr;

    let bg, borderColor, topBar;
    if(isToday)        { bg='var(--primary-light)'; borderColor='var(--primary)';           topBar='var(--primary)'; }
    else if(comp)      { bg='rgba(251,191,36,.13)'; borderColor='rgba(251,191,36,.6)';      topBar='#f59e0b'; }
    else if(hasActivity && rutDia.every(r=>r.completo)){ bg='rgba(5,150,105,.1)'; borderColor='rgba(5,150,105,.4)'; topBar='var(--green)'; }
    else if(hasActivity){ bg='rgba(59,130,201,.08)'; borderColor='var(--primary)';          topBar='var(--primary)'; }
    else if(hasPlan && isPast){ bg='rgba(220,38,38,.07)'; borderColor='rgba(220,38,38,.3)'; topBar='var(--red)'; }
    else               { bg='var(--bg2)'; borderColor='var(--border2)';                     topBar='var(--border)'; }

    let statusBadge = '';
    if(comp) statusBadge = `<span style="font-size:13px;line-height:1;">🏆</span>`;
    else if(hasActivity && rutDia.every(r=>r.completo)) statusBadge = `<i class="ti ti-circle-check-filled" style="font-size:14px;color:var(--green);"></i>`;
    else if(hasActivity) statusBadge = `<i class="ti ti-circle-half-2" style="font-size:14px;color:var(--primary);"></i>`;
    else if(hasPlan && isPast) statusBadge = `<i class="ti ti-circle-x" style="font-size:14px;color:var(--red);"></i>`;

    const allItems = comp ? ['🏆 '+(comp.n.length>12?comp.n.slice(0,11)+'…':comp.n), ...planItems] : [...planItems];
    const itemsHTML = allItems.length
      ? allItems.map(item=>{
          const isComp = item.startsWith('🏆');
          const short = item.length>14 ? item.slice(0,13)+'…' : item;
          const rDia = rutDia.find(r=>r.rname===item);
          const pct = rDia ? Math.round(rDia.hechos/rDia.total*100) : null;
          return `<div style="margin-top:4px;">
            <div style="font-size:10px;font-weight:700;color:${isComp?'#b45309':isToday?'var(--primary)':'var(--text)'};line-height:1.3;">${esc(short)}</div>
            ${rDia&&rDia.total>0?`<div style="background:var(--border2);border-radius:3px;height:3px;margin-top:2px;overflow:hidden;"><div style="background:${rDia.completo?'var(--green)':'var(--primary)'};width:${pct}%;height:100%;border-radius:3px;"></div></div>`:''}
          </div>`;
        }).join('')
      : `<div style="margin-top:6px;font-size:10px;color:var(--border);font-style:italic;">—</div>`;

    return `<div onclick="openEliteAsignarDiaModal('${id}','${ds}','${wkMon}')" style="flex:1;min-width:0;border:2px solid ${borderColor};border-radius:12px;overflow:hidden;cursor:pointer;background:${bg};box-sizing:border-box;-webkit-tap-highlight-color:transparent;">
      <div style="height:3px;background:${topBar};"></div>
      <div style="padding:8px 6px 10px;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1px;">
          <div>
            <div style="font-size:9px;font-weight:800;color:${isToday?'var(--primary)':'var(--text2)'};text-transform:uppercase;letter-spacing:.3px;">${DIAS_ABR2[dt.getDay()]}</div>
            <div style="font-size:17px;font-weight:900;color:${isToday?'var(--primary)':'var(--text)'};line-height:1.1;">${dt.getDate()}</div>
          </div>
          ${statusBadge}
        </div>
        ${itemsHTML}
      </div>
    </div>`;
  }).join('');

  openModal(`<div class="modal-head">
    <h3 style="font-size:15px;"><i class="ti ti-calendar-stats"></i> Entrenamientos — ${esc(d.n)}</h3>
    <button onclick="closeModal()">✕</button>
  </div>
  <div style="padding:0 14px 20px;overflow-y:auto;max-height:82vh;-webkit-overflow-scrolling:touch;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 0 12px;">
      ${prevBtn}
      <span style="font-size:14px;font-weight:800;">${wkLabel}</span>
      ${nextBtn}
    </div>
    <div style="display:flex;gap:5px;">
      ${dayCells}
    </div>
  </div>`,'wide');
}

function togglePlanDia(id, rname, dayNum){
  const d = eliteById(id);
  if(!d) return;
  if(!d.planSemanal) d.planSemanal = {};
  if(!Array.isArray(d.planSemanal[rname])) d.planSemanal[rname] = [];
  const dn = Number(dayNum);
  const idx = d.planSemanal[rname].indexOf(dn);
  if(idx>=0) d.planSemanal[rname].splice(idx,1);
  else d.planSemanal[rname].push(dn);
  persist();
  refreshEliteDeportistaModal(id);
}

function openEliteEntrenamientoDiaModal(id, ds){
  _diaModalId = id;
  _diaModalDs = ds;
  const d = eliteById(id);
  if(!d) return;
  const rh = d.rsHechos||{};
  const pse = d.pse||[];
  const todayStr = todayISO();
  const DIAS_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dt = new Date(ds+'T12:00:00');
  const fechaLabel = `${DIAS_L[dt.getDay()]} ${dt.getDate()} de ${MESES[dt.getMonth()]} ${dt.getFullYear()}`;
  const isFuture = ds > todayStr;
  const isToday = ds === todayStr;

  const planRnames = getPlanItems(d, ds);

  const rutDia = (d.rs||[]).map(rname=>{
    const r = RUTINAS.find(x=>x.n===rname);

    const rhR = rh[rname]||{};
    const done = ejs.filter(e=>rhR[e.n]===ds).length;
    if(!done) return null;
    return {rname, done, total: ejs.length, completo: done===ejs.length && ejs.length>0};
  }).filter(Boolean);

  const psePre = pse.find(p=>p.f===ds && p.tipo==='pre');
  const psePost = pse.find(p=>p.f===ds && p.tipo==='post');

  function pseResumen(pseObj){
    if(!pseObj) return '';
    const r = pseObj.r||{};
    const parts = [];
    if(r.energia!=null&&r.energia!=='') parts.push(`Energía: <b>${esc(String(r.energia))}</b>`);
    if(r.sueno!=null&&r.sueno!=='') parts.push(`Sueño: <b>${esc(String(r.sueno))}</b>`);
    if(r.dolor!=null&&r.dolor!=='') parts.push(`Dolor: <b>${esc(String(r.dolor))}</b>`);
    if(r.animo!=null&&r.animo!=='') parts.push(`Ánimo: <b>${esc(String(r.animo))}</b>`);
    if(r.nota_pre) parts.push(`Nota: <b>${esc(r.nota_pre)}</b>`);
    return parts.join(' · ');
  }
  function psePostResumen(pseObj){
    if(!pseObj) return '';
    const r = pseObj.r||{};
    const parts = [];
    if(r.rpe!=null&&r.rpe!=='') parts.push(`RPE: <b>${esc(String(r.rpe))}/10</b>`);
    if(r.carga!=null&&r.carga!=='') parts.push(`Carga: <b>${esc(String(r.carga))}</b>`);
    if(r.recuperacion!=null&&r.recuperacion!=='') parts.push(`Recuperación: <b>${esc(String(r.recuperacion))}</b>`);
    if(r.satisfaccion!=null&&r.satisfaccion!=='') parts.push(`Conformidad: <b>${esc(String(r.satisfaccion))}</b>`);
    if(r.nota_post) parts.push(`Nota: <b>${esc(r.nota_post)}</b>`);
    return parts.join(' · ');
  }

  // Rutinas planificadas
  const planHTML = planRnames.length ? planRnames.map(pname=>{
    const cumplida = rutDia.some(rt=>rt.rname===pname);
    const color = cumplida?'var(--green)':isFuture?'var(--text2)':'var(--red)';
    const icon = cumplida?'ti-circle-check-filled':isFuture?'ti-calendar':'ti-circle-x';
    // Mostrar X para quitar este item específico del array del día
    const removeBtn = `<button onclick="quitarPlanFechaItem('${id}','${ds}','${escQ(pname)}')" style="background:none;border:none;cursor:pointer;padding:6px;color:var(--text2);opacity:.6;line-height:1;flex-shrink:0;" title="Quitar del plan de este día"><i class="ti ti-x" style="font-size:16px;pointer-events:none;"></i></button>`;
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);">

        <div style="font-size:13px;font-weight:700;">${esc(pname)}</div>

  // Actividad real (rutinas con ejercicios hechos)
  const actividadHTML = rutDia.length ? rutDia.map(rt=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2);">
      <i class="ti ${rt.completo?'ti-circle-check-filled':'ti-circle-half-2'}" style="font-size:20px;color:${rt.completo?'var(--green)':'var(--primary)'};flex-shrink:0;"></i>
      <div>
        <div style="font-size:13px;font-weight:700;">${esc(rt.rname)}</div>
        <div style="font-size:11px;color:var(--text2);">${rt.done}/${rt.total} ejercicios${rt.completo?' · <span style="color:var(--green);">Completo ✓</span>':''}</div>
      </div>
    </div>`).join('') : (!planHTML && !isFuture ? `<p style="color:var(--text2);font-size:13px;margin:0;">Sin actividad registrada.</p>` : '');

  const preHTML = psePre ? `
    <div style="margin-bottom:12px;padding:10px 12px;background:var(--bg2);border-radius:10px;border-left:3px solid var(--primary);">
      <div style="font-size:10px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">PSE antes del entrenamiento</div>
      <div style="font-size:12px;color:var(--text);line-height:1.6;">${pseResumen(psePre)||'—'}</div>

      <div style="font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">PSE después del entrenamiento</div>

    </div>` : '';

  const hasPSE = psePre || psePost;
  const hasAny = planHTML || actividadHTML || hasPSE;

  openModal(`<div class="modal-head">
    <button onclick="openEliteEntrenamientosModal('${id}')">←</button>
    <h3 style="font-size:14px;font-weight:700;flex:1;text-align:center;${isToday?'color:var(--primary)':''}">${fechaLabel}${isToday?' · Hoy':''}</h3>

    ${planHTML || actividadHTML ? `<div style="margin-bottom:16px;">${planHTML}${actividadHTML}</div>` : ''}
    ${preHTML}${postHTML}
    ${!hasAny ? `<div style="text-align:center;padding:32px 0;color:var(--text2);"><i class="ti ti-calendar-off" style="font-size:36px;display:block;margin-bottom:10px;opacity:.3;"></i><p style="margin:0;font-size:13px;">Sin información para este día.</p></div>` : ''}
  </div>`);
}

  if(!d) return;
  const now = new Date();
  const curYM = ym || `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const [year, month] = curYM.split('-').map(Number);
  const firstDay = new Date(year, month-1, 1);
  const daysInMonth = new Date(year, month, 0).getDate();
  const startDow = (firstDay.getDay()+6)%7; // Lun=0
  const planFechas = d.planFechas||{};
  const rh = d.rsHechos||{};
  const rutinas = d.rs||[];
  const todayStr = todayISO();
  const MESES_N = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DIAS_H = ['L','M','X','J','V','S','D'];
  const prevYM = month===1?`${year-1}-12`:`${year}-${String(month-1).padStart(2,'0')}`;
  const nextYM = month===12?`${year+1}-01`:`${year}-${String(month+1).padStart(2,'0')}`;

  // Mapa de competencias por fecha para este mes
  const compMap = {};
  (d.competencias||[]).forEach(c=>{ if(c.f && c.f.startsWith(curYM)) compMap[c.f] = c; });

  const headerCells = DIAS_H.map(h=>`<div style="font-size:10px;font-weight:700;color:var(--text2);text-align:center;padding:5px 0;">${h}</div>`).join('');

  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div></div>';

  for(let day=1;day<=daysInMonth;day++){
    const ds = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const planItems = getPlanItems({planFechas}, ds);
    const hasPlanItem = planItems.length > 0;
    const isToday = ds===todayStr;
    const isPast = ds<todayStr;
    const comp = compMap[ds];

    let done = false;
    if(hasPlanItem){
      const firstPlan = planItems[0];
      const r = RUTINAS.find(x=>x.n===firstPlan);
      const ejs = r?r.ejs||[]:[];
      const rhR = rh[firstPlan]||{};
      done = ejs.length>0 && ejs.every(e=>rhR[e.n]===ds);
    }
    const hasAnyActivity = rutinas.some(rname=>{
      const r = RUTINAS.find(x=>x.n===rname);
      const ejs = r?r.ejs||[]:[];
      return ejs.some(e=>(rh[rname]||{})[e.n]===ds);
    });

    let bg, border, numColor, txtColor, bottomIcon='';
    if(comp){
      bg = 'rgba(251,191,36,.18)';
      border = '2px solid rgba(251,191,36,.6)';
      numColor = '#b45309';
      txtColor = '#b45309';
      bottomIcon = `<div style="font-size:9px;">🏆</div>`;
    } else if(isToday){
      bg = 'var(--primary-light)'; border = '2px solid var(--primary)';
      numColor = 'var(--primary)'; txtColor = 'var(--primary)';
    } else if(done){
      bg = 'rgba(5,150,105,.13)'; border = '1.5px solid rgba(5,150,105,.4)';
      numColor = 'var(--text2)'; txtColor = 'var(--green)';
    } else if(hasPlanItem && !isPast){
      bg = 'rgba(59,130,201,.1)'; border = '1.5px solid transparent';
      numColor = 'var(--text)'; txtColor = 'var(--primary)';
    } else if(hasPlanItem && isPast){
      bg = 'rgba(220,38,38,.07)'; border = '1.5px solid transparent';
      numColor = 'var(--text2)'; txtColor = 'var(--red)';
    } else {
      bg = 'transparent'; border = '1.5px solid transparent';
      numColor = isPast?'var(--text2)':'var(--text)'; txtColor = 'var(--primary)';
    }

    const _fp = comp ? (comp.n.length>8?comp.n.slice(0,7)+'…':comp.n) : (planItems[0]||'');
    const shortName = _fp.length>8?_fp.slice(0,7)+'…':_fp;
    const extraLabel = !comp && planItems.length>1?` +${planItems.length-1}`:'';
    const showLabel = comp || hasPlanItem;

    cells += `<div onclick="openEliteAsignarDiaModal('${id}','${ds}','${curYM}')" style="min-height:52px;padding:4px 3px;border-radius:8px;cursor:pointer;background:${bg};border:${border};box-sizing:border-box;-webkit-tap-highlight-color:transparent;">
      <div style="font-size:11px;font-weight:${isToday?'800':'600'};color:${numColor};line-height:1;">${day}</div>
      ${showLabel?`<div style="font-size:9px;font-weight:700;color:${txtColor};margin-top:2px;line-height:1.25;overflow:hidden;">${esc(shortName)}${extraLabel?`<span style="font-size:8px;">${esc(extraLabel)}</span>`:''}</div>`:''}
      ${hasAnyActivity&&!hasPlanItem&&!comp?`<div style="width:5px;height:5px;border-radius:50%;background:var(--primary);margin-top:4px;opacity:.35;"></div>`:''}
      ${bottomIcon}
    </div>`;
  }

  openModal(`<div class="modal-head">
    <h3 style="font-size:15px;"><i class="ti ti-calendar-month"></i> Plan — ${esc(d.n)}</h3>
    <button onclick="openEliteDeportistaModal('${id}')">✕</button>
  </div>
  <div style="padding:0 12px 20px;overflow-y:auto;max-height:82vh;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 4px 14px;">
      <button onclick="openElitePlanCalendarioModal('${id}','${prevYM}')" style="all:unset;width:34px;height:34px;border-radius:10px;background:var(--bg2);font-size:18px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;line-height:34px;">‹</button>
      <span style="font-size:16px;font-weight:800;">${MESES_N[month-1]} ${year}</span>
      <button onclick="openElitePlanCalendarioModal('${id}','${nextYM}')" style="all:unset;width:34px;height:34px;border-radius:10px;background:var(--bg2);font-size:18px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;line-height:34px;">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">
      ${headerCells}${cells}
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text2);">
      <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:3px;background:rgba(59,130,201,.15);flex-shrink:0;"></span>Planificado</span>
      <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:3px;background:rgba(5,150,105,.18);flex-shrink:0;"></span>Completado</span>
      <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:3px;background:rgba(220,38,38,.1);flex-shrink:0;"></span>No realizado</span>
      <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:3px;background:rgba(251,191,36,.25);flex-shrink:0;border:1.5px solid rgba(251,191,36,.6);"></span>Competencia 🏆</span>
    </div>
  </div>`);
}

function _guardarPlanFechaCustom(){
  const {id, fecha, ym} = _asignarDiaCtx;
  if(!id || !fecha) return;
  const inp = document.getElementById('planFechaCustomInput');
  if(!inp) return;
  const val = inp.value.trim();
  if(!val){ inp.focus(); return; }
  const d = eliteById(id);
  if(!d) return;
  if(!d.planFechas) d.planFechas = {};
  const current = getPlanItems(d, fecha);
  if(!current.includes(val)){
    d.planFechas[fecha] = [...current, val];
    persist();
  }
  openEliteAsignarDiaModal(id, fecha, ym);
}

function _quitarPlanFechaCalendario(){
  const {id, fecha, ym} = _asignarDiaCtx;
  if(!id || !fecha) return;
  const d = eliteById(id);
  if(!d) return;
  if(!d.planFechas) d.planFechas = {};
  d.planFechas[fecha] = null;
  persist();
  if(ym && ym.length===10) openEliteEntrenamientosModal(id);
  else openElitePlanCalendarioModal(id, ym);
}

function getPlanItems(d, ds){
  const val = (d.planFechas||{})[ds];
  if(!val) return [];
  if(Array.isArray(val)) return val;
  return [val]; // backward compat
}

function _togglePlanFechaItem(rname){
  const {id, fecha, ym} = _asignarDiaCtx;
  if(!id || !fecha) return;
  const d = eliteById(id);
  if(!d) return;
  if(!d.planFechas) d.planFechas = {};
  const current = getPlanItems(d, fecha);
  const idx = current.indexOf(rname);
  if(idx >= 0){
    const next = current.filter((_,i)=>i!==idx);
    d.planFechas[fecha] = next.length ? next : null;
  } else {
    d.planFechas[fecha] = [...current, rname];
  }
  persist();
  openEliteAsignarDiaModal(id, fecha, ym);
}

function quitarPlanFechaItem(id, ds, rname){
  const d = eliteById(id);
  if(!d) return;
  if(!d.planFechas) d.planFechas = {};
  const current = getPlanItems(d, ds);
  const next = current.filter(x=>x!==rname);
  d.planFechas[ds] = next.length ? next : null;
  persist();
  openEliteEntrenamientoDiaModal(id, ds);
}

        ${isRutina?`<button onclick="_editarRutinaDelDia('${escQ(item)}')" style="background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--text2);line-height:1;flex-shrink:0;" title="Editar ejercicios"><i class="ti ti-pencil" style="font-size:14px;pointer-events:none;"></i></button>`:''}
        <button onclick="_togglePlanFechaItem('${escQ(item)}')" style="background:none;border:none;cursor:pointer;padding:4px;color:var(--text2);line-height:1;flex-shrink:0;"><i class="ti ti-x" style="font-size:15px;pointer-events:none;"></i></button>
      </div>`;

  openModal(`<div class="modal-head">
    <h3 style="font-size:14px;font-weight:700;">${fechaTxt}</h3>
    <button onclick="${backFn}">✕</button>

    <input id="eliteBuscaRutina" type="text" placeholder="Escribí para buscar..." autocomplete="off"
      style="width:100%;font-size:14px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text);box-sizing:border-box;margin-bottom:8px;"
      oninput="_eliteFiltrarRutinas()">
    <div id="eliteRutinaResultados" style="display:none;border:1px solid var(--border2);border-radius:12px;overflow:hidden;margin-bottom:12px;"></div>
    <div style="border-top:1px solid var(--border2);padding-top:12px;margin-top:4px;">
      <div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Actividad libre</div>
      <div style="display:flex;gap:8px;">
        <input id="planFechaCustomInput" type="text" placeholder="Ej: Partido, Descanso activo..." style="flex:1;font-size:13px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text);">
        <button onclick="_guardarPlanFechaCustom()" style="background:var(--primary);border:none;color:#fff;border-radius:10px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;">Agregar</button>
      </div>

  setTimeout(()=>{ const inp=document.getElementById('eliteBuscaRutina'); if(inp) inp.focus(); },100);
}

function _eliteFiltrarRutinas(){
  const q = (document.getElementById('eliteBuscaRutina')||{}).value||'';
  const cont = document.getElementById('eliteRutinaResultados');
  if(!cont) return;
  if(q.trim().length<1){ cont.style.display='none'; cont.innerHTML=''; return; }
  const {id, fecha} = _asignarDiaCtx;
  const d = eliteById(id);
  const currentItems = getPlanItems(d, fecha);
  const matches = RUTINAS.filter(r=>r.n.toLowerCase().includes(q.toLowerCase()));
  if(!matches.length){ cont.style.display='block'; cont.innerHTML=`<div style="padding:12px 16px;font-size:13px;color:var(--text2);">Sin resultados</div>`; return; }
  cont.style.display='block';
  cont.innerHTML = matches.map(r=>{
    const sel = currentItems.includes(r.n);
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border2);background:${sel?'var(--primary-light)':''};">
      <div>
        <div style="font-size:13px;font-weight:${sel?'700':'600'};color:${sel?'var(--primary)':'var(--text)'};">${esc(r.n)}</div>
        ${r.t?`<div style="font-size:11px;color:var(--text2);">${esc(r.t)}</div>`:''}
      </div>
      <button onclick="_seleccionarRutinaParaDia('${escQ(r.n)}')" style="background:${sel?'var(--bg2)':'var(--primary)'};border:none;color:${sel?'var(--text2)':'#fff'};border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;">
        ${sel?'Asignada':'Agregar'}
      </button>
    </div>`;
  }).join('');
}

  </div>
  <div style="padding:0 16px 16px;overflow-y:auto;max-height:75vh;">
    <div style="margin-bottom:14px;">
      <div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Nota / indicación</div>
      <textarea id="planNotaInput" rows="2" placeholder="Ej: Bajar peso, foco en técnica, ritmo suave..." style="width:100%;font-size:13px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border2);background:var(--bg);color:var(--text);resize:none;box-sizing:border-box;">${esc(notaRutina)}</textarea>
    </div>
    ${r.ejs&&r.ejs.length?`<div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Modificar ejercicios (opcional)</div>${ejRows}`:'' }
    <button onclick="_guardarSeleccionRutinaParaDia('${escQ(rname)}')" style="width:100%;margin-top:16px;background:var(--primary);border:none;color:#fff;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;">Guardar</button>

function _guardarSeleccionRutinaParaDia(rname){
  const {id, fecha, ym} = _asignarDiaCtx;
  const d = eliteById(id);
  if(!d) return;
  const r = RUTINAS.find(x=>x.n===rname);

  // Agregar rutina al plan del día
  if(!d.planFechas) d.planFechas = {};
  const arr = getPlanItems(d, fecha);
  if(!arr.includes(rname)) arr.push(rname);
  d.planFechas[fecha] = arr;

  // Guardar nota y overrides
  const nota = (document.getElementById('planNotaInput')||{}).value||'';
  const ejs = {};
  (r&&r.ejs||[]).forEach((e,ei)=>{
    const s = (document.getElementById(`planOvS_${ei}`)||{}).value||'';
    const rep = (document.getElementById(`planOvR_${ei}`)||{}).value||'';
    const kg = (document.getElementById(`planOvK_${ei}`)||{}).value||'';
    if(s||rep||kg) ejs[e.n] = {s,r:rep,kg};
  });
  if(!d.planNotas) d.planNotas = {};
  if(!d.planNotas[fecha]) d.planNotas[fecha] = {};
  d.planNotas[fecha][rname] = { nota: nota.trim(), ejs };

  persist();
  openEliteAsignarDiaModal(id, fecha, ym);
}

// ── Editor de rutina por día: reordenar + modificar ejercicios ──────
let _editDragOrder = []; // orden actual durante el drag

function _editarRutinaDelDia(rname){
  const {id, fecha, ym} = _asignarDiaCtx;
  const d = eliteById(id);
  if(!d) return;
  const r = RUTINAS.find(x=>x.n===rname);
  if(!r) return;

  const planNota = ((d.planNotas||{})[fecha]||{})[rname]||{};
  const overrides = planNota.ejs||{};
  const savedOrder = planNota.ejsOrder||[];
  // Construir orden: primero los guardados, luego los nuevos
  const baseEjs = r.ejs||[];
  const ordered = [
    ...savedOrder.map(n=>baseEjs.find(e=>e.n===n)).filter(Boolean),
    ...baseEjs.filter(e=>!savedOrder.includes(e.n))
  ];
  _editDragOrder = ordered.map(e=>e.n);

  _renderEditarRutinaDelDia(rname, ordered, overrides, planNota.nota||'');
}

  const {id, fecha, ym} = _asignarDiaCtx;
  const ejRows = ordered.map((e,i)=>{

    const _s = ov.s || String(e.s||'');

    const _kg = ov.kg || '';
    return `<div id="editEjRow_${i}" data-ejname="${escQ(e.n)}" style="display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--border2);touch-action:none;">

      <div style="flex:1;min-width:0;">

        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">
          ${e.modo!=='tiempo'?`

function _initDragEjercicios(){
  const container = document.getElementById('editEjContainer');
  if(!container || container._dragBound) return;
  container._dragBound = true; // evitar bind múltiple

  let dragEl=null, placeholder=null, savedCssText='', offsetY=0;

  // Event delegation sobre el container — un solo set de listeners
  container.addEventListener('touchstart', e=>{
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const row = handle.closest('[id^="editEjRow_"]');
    if(!row) return;
    e.preventDefault();

    dragEl = row;
    const touch = e.touches[0];
    const rect = row.getBoundingClientRect();
    offsetY = touch.clientY - rect.top;
    savedCssText = row.style.cssText; // guardar para restaurar limpio

    // Placeholder
    placeholder = document.createElement('div');
    placeholder.style.cssText = `height:${rect.height}px;background:var(--primary-light);border:2px dashed var(--primary);border-radius:8px;flex-shrink:0;margin:0;`;
    row.parentNode.insertBefore(placeholder, row.nextSibling);

    // Fijar elemento con feedback visual
    handle.style.color = 'var(--primary)';
    row.style.cssText = savedCssText + `;position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;z-index:300;background:var(--bg);box-shadow:0 12px 32px rgba(0,0,0,.22);opacity:.97;transition:none;border:2px solid var(--primary);border-radius:12px;`;
  },{passive:false});

  container.addEventListener('touchmove', e=>{
    if(!dragEl) return;
    e.preventDefault();
    const y = e.touches[0].clientY;
    dragEl.style.top = (y - offsetY)+'px';

    // Mover placeholder al lugar correcto
    const rows = [...container.querySelectorAll('[id^="editEjRow_"]')].filter(r=>r!==dragEl);
    let placed = false;
    for(const r of rows){
      const mid = r.getBoundingClientRect().top + r.getBoundingClientRect().height/2;
      if(y < mid){ container.insertBefore(placeholder, r); placed=true; break; }
    }
    if(!placed && rows.length) container.appendChild(placeholder);
  },{passive:false});

  container.addEventListener('touchend', e=>{
    if(!dragEl) return;

    // Restaurar cssText original limpio
    dragEl.style.cssText = savedCssText;
    const handle = dragEl.querySelector('.drag-handle');
    if(handle) handle.style.color = '';

    // Colocar en la posición del placeholder
    container.insertBefore(dragEl, placeholder);
    placeholder.remove();
    placeholder = null;

    // Leer nuevo orden del DOM
    const allRows = [...container.querySelectorAll('[id^="editEjRow_"]')];
    _editDragOrder = allRows.map(r=>r.dataset.ejname);

    // Re-numerar sin tocar los listeners (siguen adjuntos a los mismos elementos)
    allRows.forEach((r,ni)=>{
      r.id = 'editEjRow_'+ni;
      const h = r.querySelector('.drag-handle'); if(h) h.dataset.idx=ni;
      const lbl = r.querySelector('.ej-label');
      if(lbl) lbl.textContent = (ni+1)+'. '+(_editDragOrder[ni]||'');
      ['eds','edr','edk'].forEach(pfx=>{
        const inp = r.querySelector(`[id^="${pfx}_"]`); if(inp) inp.id=pfx+'_'+ni;
      });
    });

    dragEl = null;
  },{passive:false});
}

function _guardarEdicionRutinaDelDia(rname){
  const {id, fecha, ym} = _asignarDiaCtx;
  const d = eliteById(id);
  if(!d) return;
  const r = RUTINAS.find(x=>x.n===rname);

  // Leer overrides de inputs (por índice actual)
  const container = document.getElementById('editEjContainer');
  const rows = container ? [...container.querySelectorAll('[id^="editEjRow_"]')] : [];
  const ejs = {};
  rows.forEach((row,i)=>{
    const ejn = row.dataset.ejname;
    const s = (document.getElementById(`eds_${i}`)||{}).value||'';
    const rep = (document.getElementById(`edr_${i}`)||{}).value||'';
    const kg = (document.getElementById(`edk_${i}`)||{}).value||'';
    if(s||rep||kg) ejs[ejn]={s,r:rep,kg};
  });

  const nota = (document.getElementById('editNota')||{}).value||'';

  if(!d.planNotas) d.planNotas={};
  if(!d.planNotas[fecha]) d.planNotas[fecha]={};
  d.planNotas[fecha][rname] = {
    nota: nota.trim(),
    ejs,
    ejsOrder: _editDragOrder.length ? _editDragOrder : (r&&r.ejs||[]).map(e=>e.n)
  };
  persist();
  showToast('Cambios guardados','ok');
  openEliteAsignarDiaModal(id, fecha, ym);
}

  refreshEliteDeportistaModal(id);

function eliminarCompetenciaElite(id, key){
  const d = eliteById(id);
  if(!d||!Array.isArray(d.competencias)) return;
  const idx = d.competencias.findIndex(c=>(c.f+'|'+c.n)===key);
  if(idx<0) return;
  if(!Array.isArray(d.competenciasRemoved)) d.competenciasRemoved = [];
  if(!d.competenciasRemoved.includes(key)) d.competenciasRemoved.push(key);
  d.competencias.splice(idx,1);
  persist();
  refreshEliteDeportistaModal(id);
}

    let html = '';
    if(elitePage==='inicio') html = elitePageInicio(d);
    else if(elitePage==='rutinas') html = elitePageRutinas(d);
    else if(elitePage==='competencias') html = elitePageCompetencias(d);
    else if(elitePage==='pse') html = elitePagePseHistorial(d);
    c.innerHTML = html;
    c.style.opacity = '';
    c.style.transform = '';
    // nav activo
    $all('.elite-nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===elitePage));
  };
  // Si ya hay contenido, fade-out rápido antes de reemplazar
  if(c.children.length){
    c.style.transition = 'opacity .12s ease, transform .12s ease';
    c.style.opacity = '0';

    setTimeout(()=>{

  } else {

  }
}

function elitePageRutinas(d){

    <p style="margin:0;font-size:14px;">No tenés rutinas asignadas todavía.</p>
  </div>`;
  const todayStr = todayISO();
  return rutinas.map((rname, idx)=>{
    const r = RUTINAS.find(x=>x.n===rname);
    const rh = d.rsHechos?.[rname]||{};
    const ejs = (r?r.ejs:[]);
    const ejsHechos = ejs.filter(e=>rh[e.n]===todayStr).length;
    const completo = ejs.length>0 && ejsHechos===ejs.length;
    const parcial = ejsHechos>0 && !completo;
    return `<div class="card" style="padding:0;margin-bottom:10px;border-radius:14px;overflow:hidden;animation:eliteFadeIn .22s ease both;animation-delay:${idx*0.06}s;cursor:pointer;-webkit-tap-highlight-color:transparent;" onclick="eliteAbrirRutina('${escQ(rname)}')">
      <div style="display:flex;align-items:center;gap:12px;padding:15px 16px;">
        <div style="width:42px;height:42px;border-radius:10px;background:${completo?'rgba(5,150,105,.12)':parcial?'rgba(59,130,201,.1)':'var(--bg2)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;">
          <i class="ti ${completo?'ti-check':'ti-barbell'}" style="font-size:20px;color:${completo?'var(--green)':parcial?'var(--primary)':'var(--text2)'};"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(rname)}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:1px;">${esc(r?.t||'')} · ${ejs.length} ejercicios${parcial?` · <span style="color:var(--primary);font-weight:600;">${ejsHechos}/${ejs.length} hechos</span>`:''}${completo?' · <span style="color:var(--green);font-weight:600;">Completada hoy</span>':''}</div>
        </div>
        <i class="ti ti-chevron-right" style="font-size:18px;color:var(--text2);flex-shrink:0;"></i>
      </div>
      ${completo?`<div style="height:3px;background:linear-gradient(90deg,var(--green),rgba(5,150,105,.3));"></div>`:''}
      ${parcial?`<div style="height:3px;background:linear-gradient(90deg,var(--primary) ${Math.round(ejsHechos/ejs.length*100)}%,var(--border2) ${Math.round(ejsHechos/ejs.length*100)}%);"></div>`:''}
    </div>`;
  }).join('');
}

function elitePageCompetencias(d){
  const todayStr = todayISO();
  const proximas = (d.competencias||[]).filter(c=>c.f>=todayStr).sort((a,b)=>a.f.localeCompare(b.f));
  const pasadas = (d.competencias||[]).filter(c=>c.f<todayStr).sort((a,b)=>b.f.localeCompare(a.f));
  const renderComp = (c)=>`<div class="card" style="padding:14px;margin-bottom:8px;">
    <div style="font-weight:700;font-size:14px;">${esc(c.n)}</div>
    <div style="font-size:12px;color:var(--text2);">${esc(c.f)}${c.lugar?' · '+esc(c.lugar):''}</div>
    ${c.resultado?`<div style="margin-top:6px;"><span style="background:var(--primary-light);color:var(--primary);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:600;">${esc(c.resultado)}</span></div>`:''}
  </div>`;
  return `
    ${proximas.length?`<div style="font-weight:700;font-size:14px;margin-bottom:10px;color:var(--primary);">Próximas</div>${proximas.map(renderComp).join('')}`:''}
    ${pasadas.length?`<div style="font-weight:700;font-size:14px;margin:16px 0 10px;color:var(--text2);">Historial</div>${pasadas.map(renderComp).join('')}`:''}
    ${!proximas.length&&!pasadas.length?`<div class="card" style="text-align:center;padding:40px;color:var(--text2);">Sin competencias cargadas todavía.</div>`:''}`;
}

function elitePagePseHistorial(d){
  const pses = (d.pse||[]).slice().reverse();
  if(!pses.length) return `<div class="card" style="text-align:center;padding:40px;color:var(--text2);">No hay PSE registradas todavía.</div>`;
  return pses.slice(0,30).map(p=>{
    const labelMap = {pre:'Antes del entreno', post:'Después del entreno'};
    const resp = p.r||{};
    const items = Object.entries(resp).filter(([k,v])=>v).map(([k,v])=>{
      const preguntasList = p.tipo==='pre'?PSE_PRE:PSE_POST;
      const preg = preguntasList.find(q=>q.id===k);
      if(!preg) return '';
      return `<div style="font-size:12px;color:var(--text2);margin-top:3px;"><strong>${esc(preg.label.replace('¿','').replace('?','').trim())}:</strong> ${esc(String(v))}</div>`;
    }).filter(Boolean).join('');
    return `<div class="card" style="padding:12px;margin-bottom:8px;">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
        <span style="background:${p.tipo==='pre'?'var(--primary-light)':'rgba(5,150,105,.15)'};color:${p.tipo==='pre'?'var(--primary)':'var(--green)'};border-radius:10px;padding:2px 10px;font-size:11px;font-weight:700;">${labelMap[p.tipo]||p.tipo}</span>
        <span style="font-size:12px;color:var(--text2);">${esc(p.f)}</span>
        <span style="font-size:12px;font-weight:600;">${esc(p.rname||'')}</span>
        ${resp.rpe?`<span style="background:rgba(220,38,38,.12);color:var(--red);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;">RPE ${resp.rpe}</span>`:''}
      </div>
      ${items}
    </div>`;
  }).join('');
}

function eliteVerDiaSemana(ds){
  const d = eliteById(currentEliteId);
  if(!d) return;
  const items = getPlanItems(d, ds);
  const dt = new Date(ds+'T12:00:00');
  const DIAS_N = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const MESES_N = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fechaTxt = `${DIAS_N[dt.getDay()]} ${dt.getDate()} de ${MESES_N[dt.getMonth()]}`;
  const todayStr = todayISO();

  if(!items.length){
    openModal(`<div class="modal-head"><h3 style="font-size:14px;">${fechaTxt}</h3><button onclick="closeModal()">✕</button></div>
    <div style="text-align:center;padding:40px 20px;color:var(--text2);">
      <i class="ti ti-calendar-off" style="font-size:36px;display:block;margin-bottom:10px;opacity:.3;"></i>
      <p style="margin:0;font-size:14px;">Sin rutina asignada para este día.</p>
    </div>`);
    return;
  }

  const rows = items.map(rname=>{
    const r = RUTINAS.find(x=>x.n===rname);
