<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gimnasio Afys</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
:root{
  --primary:#3B82C9; --green:#059669; --red:#DC2626;
  --bg:#fff; --bg2:#f9fafb; --border:#e5e7eb; --border2:#f0f0f0;
  --text:#111; --text2:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg2);color:var(--text);}
.hidden{display:none !important;}
button{cursor:pointer;font-family:inherit;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;width:100%;}
.btn{padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.btn-sm{padding:7px 11px;font-size:13px;min-height:34px;min-width:34px;justify-content:center;}
.btn:hover{opacity:.9;}
.btn:active{opacity:.75;}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.empty-state{text-align:center;padding:32px 12px;color:var(--text2);}
.empty-state i{font-size:32px;display:block;margin-bottom:8px;opacity:.4;}
.empty-state p{font-size:14px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 8px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:600;}
td{padding:10px 8px;border-bottom:1px solid var(--border2);}
.badge{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;display:inline-block;}
.b-ok{background:#D1FAE5;color:#064E3B;}
.b-warn{background:#FEF3C7;color:#92400E;}
.b-err{background:#FEE2E2;color:#991B1B;}
.b-info{background:#DBEAFE;color:#1E40AF;}
.b-purple{background:#EDE9FE;color:#5B21B6;}
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.metric{background:#fff;border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:14px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.metric .num{font-size:24px;font-weight:700;color:var(--primary);}
.metric .lbl{font-size:13px;color:var(--text2);margin-top:3px;}
h2{font-size:20px;margin-bottom:14px;}
h3{font-size:15px;margin-bottom:10px;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);}
.login-box{box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-box{background:#fff;border-radius:16px;padding:36px;width:380px;max-width:92vw;}
.login-box h1{font-size:24px;text-align:center;margin-bottom:4px;}
.login-box p.sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:20px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.role-btn{padding:14px;border:2px solid var(--border);border-radius:10px;text-align:center;font-weight:600;font-size:14px;}
.role-btn.active{border-color:var(--primary);background:#DBEAFE;color:var(--primary);}
.login-box label{font-size:12.5px;font-weight:600;display:block;margin:10px 0 4px;}
.login-logo{display:block;max-width:220px;width:100%;margin:0 auto 18px;}
.hint{background:var(--bg2);border-radius:8px;padding:10px;font-size:11.5px;color:var(--text2);margin-top:16px;line-height:1.6;}

#qrGate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);}

/* STAFF LAYOUT */
#staff{display:flex;min-height:100vh;}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);padding:20px 12px;flex-shrink:0;}
.sidebar .logo{padding:0 6px 20px;display:flex;align-items:center;}
.sidebar .logo img{width:100%;max-width:170px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text2);margin-bottom:2px;}
.nav-item.active{background:#DBEAFE;color:var(--primary);font-weight:600;}
.nav-item:hover{background:var(--bg2);}
.main{flex:1;padding:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;}
.topbar .role-tag{font-size:13px;color:var(--text2);}
.bell{position:relative;font-size:20px;}
.bell .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%;}
.content{padding:24px 26px;}
.page{display:none;}
.page.active{display:block;}

/* notif dropdown */
.notif-wrap{position:relative;}
.notif-panel{position:absolute;right:0;top:34px;width:300px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:360px;overflow:auto;z-index:50;}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border2);font-size:14px;}
.notif-item .new-tag{background:var(--green);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px;}

/* groups (ejercicios) */
.group-block{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.group-head{padding:12px 16px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;}
.group-body{padding:10px 16px;}
.ej-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border2);font-size:13.5px;}
.ej-row:last-child{border-bottom:none;}
.dot-num{display:inline-flex;width:22px;height:22px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-size:11px;margin-right:8px;font-weight:700;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:14px;animation:fadeIn .15s ease;}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:460px;max-width:100%;max-height:86vh;overflow:auto;box-shadow:0 16px 48px rgba(0,0,0,.2);animation:modalIn .18s ease;}
.modal-box.wide{width:600px;max-width:100%;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@keyframes checkPop{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
.ej-done-btn{transition:background-color .3s ease,color .3s ease,border-color .3s ease;}
.ej-done-btn.pop{animation:checkPop .3s ease;}
.ej-row-card{transition:background-color .35s ease,border-color .35s ease;}
.page-fade{animation:fadeInUp .22s ease;}
.btn{transition:opacity .15s ease,transform .12s ease,background-color .2s ease,border-color .2s ease,color .2s ease;}
.btn:active{transform:scale(.96);}
.bn-item{transition:color .2s ease;}
.bn-item i{transition:transform .2s ease;}
.bn-item.active i{transform:translateY(-2px);}
.bell{transition:transform .15s ease;}
.bell:active{transform:scale(.85);}
.card{transition:box-shadow .2s ease,border-color .2s ease;}
#staffContent>*, #socioContent>*{animation:fadeInUp .22s ease;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:17px;}
.modal-sticky-top{position:sticky;top:-24px;margin:-24px -24px 16px -24px;padding:24px 24px 12px 24px;background:#fff;z-index:5;border-radius:14px 14px 0 0;box-shadow:0 4px 8px -6px rgba(0,0,0,.15);}
.field{margin-bottom:12px;}
.field label{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c1c1c;color:#fff;padding:13px 22px;border-radius:10px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:999;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{color:var(--green);font-size:19px;}
.toast.toast-error i{color:var(--red);}

/* toggle */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13.5px;}
.toggle{width:42px;height:24px;border-radius:14px;background:#DC2626;position:relative;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.15s;}
.toggle.on::after{left:21px;}
.toggle.locked{opacity:.5;cursor:not-allowed;}

/* tags */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:#DBEAFE;color:#1E40AF;padding:3px 8px;border-radius:14px;font-size:11.5px;display:flex;align-items:center;gap:5px;}
.tag .x{cursor:pointer;font-weight:700;}

/* bars */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;}
.bar-row .lbl{width:90px;flex-shrink:0;color:var(--text2);}
.bar-track{flex:1;background:var(--bg2);border-radius:6px;height:18px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary);border-radius:6px;}

/* socio app */
#socio{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
.socio-topbar{padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.socio-logo{height:34px;}
.socio-content{flex:1;padding:16px 18px;padding-bottom:92px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;}
.bn-item{flex:1;text-align:center;padding:12px 0 10px;font-size:12.5px;font-weight:600;color:var(--text2);}
.bn-item i{display:block;font-size:25px;margin-bottom:3px;}
.bn-item.active{color:var(--primary);}
.s-page{display:none;}
.s-page.active{display:block;}
.welcome-banner{display:flex;flex-direction:column;align-items:center;text-align:center;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 18px 14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:fadeInUp .25s ease;overflow:hidden;}
.welcome-logo{width:100%;max-width:170px;height:auto;object-fit:contain;margin-bottom:4px;}
.welcome-banner h2{font-size:14.5px;margin-bottom:3px;color:var(--text);}
.welcome-banner p{font-size:13px;color:var(--text2);margin:0;line-height:1.35;}
@media(max-width:480px){.welcome-banner{padding:10px 14px 12px;}.welcome-logo{max-width:140px;}}
.ej-picker{position:relative;}
.ej-picker input{width:100%;}
.ej-picker-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:190px;overflow:auto;z-index:60;box-shadow:0 6px 16px rgba(0,0,0,.12);margin-top:3px;}
.ej-picker-item{padding:8px 10px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;}
.ej-picker-item:hover{background:var(--bg2);}
.day-pills{display:flex;gap:7px;flex-wrap:wrap;}
.day-pill{padding:9px 14px;font-size:14px;font-weight:600;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--text2);cursor:pointer;transition:.15s;min-width:48px;text-align:center;}
.day-pill:hover{border-color:var(--primary);}
.day-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.day-pill-quick{font-size:11.5px;color:var(--primary);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
.profile-card{background:linear-gradient(135deg,#3B82C9,#60A5FA);color:#fff;border-radius:18px;padding:22px 22px 20px;margin-bottom:16px;position:relative;box-shadow:0 4px 14px rgba(59,130,201,.25);}
.avatar{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-bottom:10px;}
.profile-card .pname{font-size:17px;font-weight:700;margin-bottom:8px;}
.chip{background:rgba(255,255,255,.2);padding:4px 11px;border-radius:14px;font-size:11.5px;margin-right:6px;display:inline-block;margin-top:4px;}
.pay-banner{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.day-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.day-row.rest{opacity:.55;}
.class-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}

/* scan screen */
#scan{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;text-align:center;}
.scan-box{width:340px;}
.scan-spinner{font-size:60px;margin-bottom:20px;}
.qr-box{display:flex;justify-content:center;margin:16px 0;}

@media(max-width:760px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:120;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 16px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:110;}
  .sidebar-overlay.open{display:block;}
  #staffMenuBtn{display:inline-flex;}
  #staff{flex-direction:column;}
  .topbar{padding:12px 14px;}
  .content{padding:14px;}
  .modal-box{padding:16px;}
  .modal-sticky-top{margin:-16px -16px 16px -16px;padding:16px 16px 12px 16px;}
  .login-box{padding:24px;}
  .section-head{flex-wrap:wrap;gap:10px;}
  table{font-size:12.5px;}
  th,td{padding:8px 6px;}
}
@media(min-width:761px){
  #staffMenuBtn{display:none;}
  .sidebar-overlay{display:none !important;}
}
#staffMenuBtn{align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;font-size:18px;}
#staffMenuBtn:hover{background:var(--bg2);}

/* horarios - calendario semanal */
.cal-wrap{overflow-x:auto;}
.cal-grid{display:grid;grid-auto-rows:auto;border:1px solid var(--border);border-radius:8px;overflow:hidden;width:100%;font-size:10px;}
.cal-corner{grid-row:1;grid-column:1;border-bottom:1px solid var(--border);background:var(--bg2);min-width:0;}
.cal-daylabel{grid-row:1;padding:3px 1px;text-align:center;font-weight:700;font-size:9.5px;border-bottom:1px solid var(--border);border-left:1px solid var(--border2);background:var(--bg2);min-width:0;overflow:hidden;white-space:normal;word-break:break-word;line-height:1.15;}
.cal-hours{border-right:1px solid var(--border);min-width:0;}
.cal-hour{font-size:8.5px;color:var(--text2);padding:0 1px;border-top:1px solid var(--border2);box-sizing:border-box;overflow:hidden;white-space:nowrap;}
.cal-daycol{position:relative;border-left:1px solid var(--border2);box-sizing:border-box;min-width:0;overflow:hidden;}
.cal-hourline{border-top:1px solid var(--border2);box-sizing:border-box;}
.cal-event{position:absolute;left:1px;right:1px;border-radius:3px;padding:0 2px;font-size:8.5px;font-weight:600;line-height:1.15;overflow:hidden;cursor:pointer;box-sizing:border-box;white-space:nowrap;text-overflow:ellipsis;}
</style>
</head>
<body>

<div id="demoBar" class="hidden" style="position:fixed;top:0;left:0;right:0;z-index:150;background:#1c1730;color:#fff;display:flex;justify-content:center;align-items:center;gap:14px;padding:9px 14px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);">
  <span id="demoBarTxt">Modo demo</span>
  <button class="btn btn-primary btn-sm" style="background:#fff;color:#1c1730;" onclick="exitDemo()">Salir del modo demo</button>
</div>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-box" id="loginBox"></div>
</div>

<!-- ===================== QR GATE (socio escanea el QR del gimnasio) ===================== -->
<div id="qrGate" class="hidden">
  <div class="login-box" id="qrGateContent"></div>
</div>

<!-- ===================== STAFF GATE (profesor escanea el QR impreso) ===================== -->
<div id="staffGate" class="hidden">
  <div class="login-box" id="staffGateContent"></div>
</div>

<!-- ===================== SCAN ===================== -->
<div id="scan" class="hidden">
  <div class="scan-box">
    <div id="scanStep1">
      <div class="scan-spinner">⏳</div>
      <h2>Verificando código QR...</h2>
      <p style="color:#aaa;font-size:14px;">Por favor espera un momento</p>
    </div>
    <div id="scanStep2" class="hidden">
      <div class="scan-spinner">✅</div>
      <h2 id="scanName">Acceso registrado</h2>
      <p id="scanDetail" style="color:#aaa;font-size:14px;margin:8px 0 4px;"></p>
      <p id="scanTime" style="color:#fff;font-size:15px;font-weight:700;margin-bottom:20px;"></p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="closeScan()">Ir a la app</button>
    </div>
  </div>
</div>

<!-- ===================== STAFF (dueño/admin/profesor) ===================== -->
<div id="staff" class="hidden">
  <div class="sidebar-overlay" id="staffSidebarOverlay" onclick="toggleStaffSidebar(false)"></div>
  <div class="sidebar" id="staffSidebar"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="staffMenuBtn" onclick="toggleStaffSidebar()"><i class="ti ti-menu-2"></i></button>
        <div>
          <b id="staffTitle">Panel</b>
          <div class="role-tag" id="staffRoleTag"></div>
        </div>
      </div>
      <div style="display:flex;gap:16px;align-items:center;">
        <div class="notif-wrap">
          <button class="bell" onclick="toggleNotif('staff')">🔔<span class="dot hidden" id="staffNotifDot"></span></button>
          <div class="notif-panel hidden" id="staffNotifPanel"></div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="content" id="staffContent"></div>
  </div>
</div>

<!-- ===================== SOCIO ===================== -->
<div id="socio" class="hidden">
  <div class="socio-topbar">
    <img src="logo.jpg" alt="AFYS" class="socio-logo">
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="notif-wrap">
        <button class="bell" onclick="toggleNotif('socio')"><i class="ti ti-bell"></i><span class="dot hidden" id="socioNotifDot"></span></button>
        <div class="notif-panel hidden" id="socioNotifPanel" style="right:-10px;"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="socio-content" id="socioContent"></div>
  <div class="bottom-nav">
    <div class="bn-item active" data-tab="inicio"><i class="ti ti-home"></i>Inicio</div>
    <div class="bn-item" data-tab="clases"><i class="ti ti-calendar"></i>Clases</div>
    <div class="bn-item" data-tab="rutina"><i class="ti ti-barbell"></i>Rutina</div>
    <div class="bn-item" data-tab="cuenta"><i class="ti ti-user"></i>Cuenta</div>
  </div>
</div>

<!-- ===================== MODAL HOST ===================== -->

function fillArray(arr, data){ if(!Array.isArray(data)) return; arr.length=0; arr.push(...data); }
function fillObject(obj, data){ if(!data || !Object.keys(data).length) return; Object.keys(obj).forEach(k=>delete obj[k]); Object.assign(obj, data); }

function snapshotState(){
  return {
    SOCIOS, RUTINAS, CLASES_HOY, PAGOS, REGS, SOCIOS_LOGIN, EJD, EJC, EJ_VIDEOS, EJ_IMAGES,
    STAFF, GYM_HOURS, TURNOS, turnoSeq, notifStaff, notifSocio, movimientosLog, entradasHoy, collapsedGroups, DUENO_EMAIL, PENDING_INVITES, RESERVAS, socioSeq,
  };
}

function applyState(s){
  if(!s || !Object.keys(s).length) return;
  fillArray(SOCIOS, s.SOCIOS);
  fillArray(RUTINAS, s.RUTINAS);
  fillArray(CLASES_HOY, s.CLASES_HOY);
  fillArray(PAGOS, s.PAGOS);
  fillArray(REGS, s.REGS);
  fillArray(PENDING_INVITES, s.PENDING_INVITES);
  fillObject(SOCIOS_LOGIN, s.SOCIOS_LOGIN);
  fillObject(EJD, s.EJD);
  fillObject(EJC, s.EJC);
  fillObject(EJ_VIDEOS, s.EJ_VIDEOS);
  fillObject(EJ_IMAGES, s.EJ_IMAGES);
  fillObject(RESERVAS, s.RESERVAS);
  if(Array.isArray(s.STAFF)) STAFF = s.STAFF;
  if(s.GYM_HOURS) GYM_HOURS = s.GYM_HOURS;
  if(Array.isArray(s.TURNOS)) TURNOS = s.TURNOS;
  if(typeof s.turnoSeq==='number') turnoSeq = s.turnoSeq;
  if(Array.isArray(s.notifStaff)) notifStaff = s.notifStaff;
  if(Array.isArray(s.movimientosLog)) movimientosLog = s.movimientosLog;
  if(s.notifSocio) notifSocio = s.notifSocio;
  if(typeof s.entradasHoy==='number') entradasHoy = s.entradasHoy;
  if(s.collapsedGroups) collapsedGroups = s.collapsedGroups;
  if(typeof s.DUENO_EMAIL==='string') DUENO_EMAIL = s.DUENO_EMAIL;
  if(typeof s.socioSeq==='number') socioSeq = s.socioSeq;
  migrateProfesorDefaultPerms();
  migrateProfesorDefaultPermsV2();
  migrateClaseIdsUnicos();
  migrateClasesTurnos();
  migrateSocioIds();
  migrateBrazosGroup();
  migrateCoordinacionGrupo();
  migrateClaseInsId();
  Object.keys(EJD).forEach(g=>{ if(Array.isArray(EJD[g])) EJD[g].sort((a,b)=>a.localeCompare(b,'es')); });
}

function migrateClasesTurnos(){
  let changed = false;
  CLASES_HOY.forEach(c=>{
    if(!c.cId || !TURNOS.find(t=>t.claseId===c.cId)){
      syncClaseTurno(c);
      changed = true;
    }
  });
  if(changed) persist();
}

function migrateClaseIdsUnicos(){
  const vistos = new Set();
  let changed = false;
  CLASES_HOY.forEach(c=>{
    if(c.cId && !vistos.has(c.cId)){ vistos.add(c.cId); return; }
    c.cId = newClaseId();
    vistos.add(c.cId);
    syncClaseTurno(c);
    changed = true;
  });
  if(changed) persist();
}
function migrateClaseInsId(){
  CLASES_HOY.forEach(c=>{
    if(!c.insId){
      const st = STAFF.find(s=>s.n===c.ins);
      if(st) c.insId = st.id;
    }
  });
}
function migrateBrazosGroup(){
  const olds = ['Tríceps','Bíceps'];
  const hasOld = olds.some(g=>EJD[g]);
  if(!hasOld) return;
  if(!EJD['Brazos']) EJD['Brazos'] = [];
  if(!EJC['Brazos']) EJC['Brazos'] = EJC['Tríceps'] || EJC['Bíceps'] || nextEjColor();
  olds.forEach(g=>{
    if(!EJD[g]) return;
    EJD[g].forEach(e=>{ if(!EJD['Brazos'].includes(e)) EJD['Brazos'].push(e); });
    delete EJD[g];
    delete EJC[g];
    delete collapsedGroups[g];
  });
  EJD['Brazos'].sort((a,b)=>a.localeCompare(b,'es'));
  persist();
}
function migrateCoordinacionGrupo(){
  const norm = s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const olds = Object.keys(EJD).filter(g=>g!=='Coordinación' && (norm(g)==='coordinacion' || norm(g)==='coordniacion'));
  if(!olds.length) return;
  if(!EJD['Coordinación']) EJD['Coordinación'] = [];
  olds.forEach(old=>{
    EJD[old].forEach(e=>{ if(!EJD['Coordinación'].includes(e)) EJD['Coordinación'].push(e); });
    if(!EJC['Coordinación']) EJC['Coordinación'] = EJC[old] || nextEjColor();
    delete EJD[old];
    delete EJC[old];
    if(collapsedGroups[old]){ collapsedGroups['Coordinación'] = collapsedGroups[old]; delete collapsedGroups[old]; }
  });
  EJD['Coordinación'].sort((a,b)=>a.localeCompare(b,'es'));
  persist();
}
function migrateSocioIds(){
  let maxN = 0;
  SOCIOS.forEach(s=>{
    const n = s.id ? parseInt(String(s.id).replace('soc','')) : NaN;
    if(!isNaN(n) && n>maxN) maxN = n;
  });
  SOCIOS.forEach(s=>{ if(!s.id){ maxN++; s.id = 'soc'+maxN; } });
  if(socioSeq <= maxN) socioSeq = maxN+1;
  PAGOS.forEach(p=>{ if(!p.sid){ const s = SOCIOS.find(s=>s.n===p.n); if(s) p.sid = s.id; } });
  REGS.forEach(r=>{ if(!r.sid){ const s = SOCIOS.find(s=>s.i===r.i); if(s) r.sid = s.id; } });
}

function migrateProfesorDefaultPerms(){
  const defaultOnKeys = ['cargarSocios','editarSocios','editarFichas','clases','editarRutinas','asignarRutinas','cargarEjercicios','horarios'];
  let changed = false;
  STAFF.forEach(st=>{
    if(st.role!=='profesor' || !st.perms || st.permsMigratedV1) return;
    const untouched = defaultOnKeys.every(k=>st.perms[k]===false) && !st.perms.verPagos && !st.perms.cargarPagos && !st.perms.removerSocios && !st.perms.cuentas;
    if(untouched){
      defaultOnKeys.forEach(k=>st.perms[k]=true);
      changed = true;
    }
    st.permsMigratedV1 = true;
    changed = true;
  });
  if(changed) persist();
}
function migrateProfesorDefaultPermsV2(){
  let changed = false;
  STAFF.forEach(st=>{
    if(st.role!=='profesor' || !st.perms || st.permsMigratedV2) return;
    Object.assign(st.perms, PROFESOR_DEFAULT_PERMS);
    st.permsMigratedV2 = true;
    changed = true;
  });
  if(changed) persist();
}

let persistTimer = null;
let toastTimer = null;
function showToast(msg, type){
  let t = document.getElementById('appToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'appToast';
    t.className = 'toast';
    document.body.appendChild(t);
  }
  const icon = type==='error' ? 'ti-alert-circle' : 'ti-circle-check';
  t.innerHTML = `<i class="ti ${icon}"></i>${esc(msg)}`;
  t.classList.toggle('toast-error', type==='error');
  clearTimeout(toastTimer);
  t.classList.add('show');
  toastTimer = setTimeout(()=>t.classList.remove('show'), type==='error'?4000:2000);
}
function persist(){
  if(demoMode) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    sb.from('app_state').upsert({id:1, data: snapshotState(), updated_at: new Date().toISOString()}).then(({error})=>{
      if(error){
        console.error('Error guardando en Supabase:', error);
        showToast('No se pudo guardar. Revisá tu conexión a internet.', 'error');
      }
    });
  }, 500);
}

async function loadState(){
  try{
    const {data, error} = await sb.from('app_state').select('data').eq('id',1).single();
    if(error){ console.error('Error cargando de Supabase:', error); throw error; }
    if(data && data.data) applyState(data.data);
  }catch(e){
    console.error('Error cargando de Supabase:', e);
    throw e;
  }
}

function $(sel,root){return (root||document).querySelector(sel);}
function $all(sel,root){return [...(root||document).querySelectorAll(sel)];}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// Para usar un valor como argumento string dentro de un onclick="...('VALOR')" — escapa backslash/comilla simple (para que no rompa el JS) y luego & < > " (para que no rompa el atributo HTML).
function jsAttr(s){
  return (s||'').toString()
    .replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function emptyState(icon, text){

}

}

// Selector de hora en formato 24hs (00-23), reemplaza al <input type="time"> nativo
// que en algunos celulares muestra AM/PM segun la configuracion regional del equipo.
function timeSelectHTML(id, value, onchange, small){
  const [h,m] = (value||'08:00').split(':');
  const hours = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'));
  const mins = ['00','05','10','15','20','25','30','35','40','45','50','55'];
  const oc = onchange ? ` onchange="${onchange}"` : '';
  const selSt = small ? 'width:auto;font-size:10.5px;padding:2px 1px;text-align:center;-webkit-appearance:none;-moz-appearance:none;appearance:none;' : 'width:auto;';
  return `<div style="display:flex;gap:${small?'2px':'4px'};align-items:center;">
    <select id="${id}_h" style="${selSt}"${oc}>${hours.map(hh=>`<option value="${hh}" ${hh===h?'selected':''}>${hh}</option>`).join('')}</select>
    <span>:</span>
    <select id="${id}_m" style="${selSt}"${oc}>${mins.map(mm=>`<option value="${mm}" ${mm===m?'selected':''}>${mm}</option>`).join('')}</select>
  </div>`;
}

function addDaysISO(dateStr, days){
  const d = dateStr ? new Date(dateStr) : new Date();
  if(isNaN(d)) return null;
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function fmtFechaCorta(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d)) return '-';
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localDateISO(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function recalcEstados(opts){
  const notify = opts && opts.notify;
  let changed = false;
  const today = new Date(); today.setHours(0,0,0,0);
  SOCIOS.forEach(s=>{
    if(!s.vence || s.activo===false) return;
    const v = new Date(s.vence);
    if(isNaN(v)) return;
    v.setHours(0,0,0,0);
    const diffDias = Math.round((v-today)/86400000);
    const prev = s.es;
    const next = diffDias<0 ? 'de' : (diffDias<=7 ? 've' : 'ok');
    if(next!==prev){
      s.es = next;
      changed = true;
      if(notify){
        if(next==='de') notifStaff.unshift({txt:`El pago de ${s.n} venció.`, new:true});
        else if(next==='ve') notifStaff.unshift({txt:`El pago de ${s.n} vence en ${diffDias} día(s).`, new:true});
      }
    }
  });
  if(changed) persist();
}
function initials(name){return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function pagoBelongsTo(p,s){ return p.sid ? p.sid===s.id : p.n===s.n; }
function regBelongsTo(r,s){ return r.sid ? r.sid===s.id : r.i===s.i; }

async function submitForgotPassword(){
  const email = $('#fp_e').value.trim().toLowerCase();
  if(!email){ loginError='Ingresá tu email.'; loginInfo=''; renderLogin(); return; }
  loginError=''; loginInfo='Enviando...'; renderLogin();
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: APP_URL});
  if(error){ loginError = error.message; loginInfo=''; renderLogin(); return; }
  loginInfo = 'Listo, revisá tu email para crear una nueva contraseña.';
  renderLogin();
}
async function submitResetPassword(){
  const p1 = $('#rp_p1').value;
  const p2 = $('#rp_p2').value;
  if(!p1 || p1.length<6){ loginError='La contraseña debe tener al menos 6 caracteres.'; renderLogin(); return; }
  if(p1!==p2){ loginError='Las contraseñas no coinciden.'; renderLogin(); return; }
  loginError=''; renderLogin();
  const {error} = await sb.auth.updateUser({password:p1});
  if(error){ loginError = error.message; renderLogin(); return; }
  await sb.auth.signOut();

async function doLogin(){
  const email = $('#loginEmail').value.trim().toLowerCase();
  const password = $('#loginPass').value;
  if(!email || !password){ loginError='Completá email y contraseña.'; renderLogin(); return; }
  const {error} = await sb.auth.signInWithPassword({email, password});
  if(error){ loginError='Email o contraseña incorrectos, o todavía no confirmaste tu email (revisá tu casilla).'; renderLogin(); return; }
  loginError=''; loginInfo='';
  await routeLoggedInUser(email);
}

async function routeLoggedInUser(email){
  $('#login').classList.add('hidden');
  if(DUENO_EMAIL && email===DUENO_EMAIL){
    currentRole='dueno'; currentStaffId=null;
    enterStaff();
    return;
  }
  const st = STAFF.find(s=>s.email===email);
  if(st){
    currentRole = st.role; currentStaffId = st.id;
    enterStaff();
    return;
  }
  const info = SOCIOS_LOGIN[email];
  if(info && SOCIOS[info.idx]){
    currentRole='socio'; currentSocioIdx=info.idx;
    showWelcomeBanner = true;
    $('#socio').classList.remove('hidden');
    socioPage='inicio'; renderSocio();
    return;
  }
  await sb.auth.signOut();
  loginError='No encontramos tu perfil en este gimnasio. Contactá al dueño.';
  $('#login').classList.remove('hidden');
  renderLogin();
}

/* ============ QR SCAN FLOW ============ */
function startScan(){
  $('#scan').classList.remove('hidden');
  $('#scanStep1').classList.remove('hidden');
  $('#scanStep2').classList.add('hidden');
  setTimeout(()=>finishScan(), 1800);
}

function finishScan(){
  const t = pendingQR || {tipo:'general'};
  const hora = nowTime();
  let socio;
  if(currentRole==='socio'){
    socio = SOCIOS[currentSocioIdx];
  } else {
    // staff simulating: pick a random socio that hasn't entered, fallback first
    socio = SOCIOS.find(s=>!s.hoy) || SOCIOS[0];
  }
  socio.hoy = true;
  socio.entradaHora = hora;
  entradasHoy++;
  REGS.unshift({sid:socio.id, i:socio.i, n:socio.n, h:hora, cl:t.clase||null, f:new Date().toISOString()});

  const idx = SOCIOS.indexOf(socio);
  const detail = t.clase ? `Clase: ${t.clase}` : 'Entrada general';
  notifStaff.unshift({txt:`${socio.n} registró su entrada (${detail}) a las ${hora}`, new:true, tipo:'entrada'});
  logMovimiento('entrada_socio', `${socio.n} registró su entrada (${detail}) a las ${hora}`);
  notifSocio[idx] = notifSocio[idx]||[];
  notifSocio[idx].unshift({txt:`Tu entrada fue registrada a las ${hora}. ${detail}`, new:true});

  $('#scanStep1').classList.add('hidden');
  $('#scanStep2').classList.remove('hidden');
  $('#scanName').textContent = `✅ ${socio.n}`;
  $('#scanDetail').textContent = detail;
  $('#scanTime').textContent = `Hora: ${hora}`;

  if(staffPage==='qr') renderStaff();
  persist();
  updateNotifDots();
}

function closeScan(){
  $('#scan').classList.add('hidden');
  pendingQR = null;
  if(currentRole==='socio'){
    showWelcomeBanner = true;
    $('#socio').classList.remove('hidden');
    socioPage = 'inicio';
    renderSocio();
  } else if($('#staff').classList.contains('hidden') && $('#login').classList.contains('hidden')){
    // came from login qr@gym.com simulation -> go to login
    $('#login').classList.remove('hidden');
  } else {
    renderStaff();
  }
}

/* ============ NOTIFICATIONS ============ */
function notifStaffParaRol(){
  return currentRole==='profesor' ? notifStaff.filter(n=>n.tipo!=='entrada') : notifStaff;
}
function updateNotifDots(){
  $('#staffNotifDot').classList.toggle('hidden', !notifStaffParaRol().some(n=>n.new));
  const mine = notifSocio[currentSocioIdx]||[];
  $('#socioNotifDot').classList.toggle('hidden', !mine.some(n=>n.new));
}

function renderNotifPanel(who){
  const panel = who==='staff' ? $('#staffNotifPanel') : $('#socioNotifPanel');
  const list = who==='staff' ? notifStaffParaRol() : (notifSocio[currentSocioIdx]||[]);
  const canResolve = who==='staff' && (currentRole==='dueno' || currentRole==='admin');
  panel.innerHTML = list.length ? list.map(n=>{
    const showAlta = n.altaIdx!=null && SOCIOS[n.altaIdx] && SOCIOS[n.altaIdx].altaPendiente;
    const acciones = showAlta && canResolve ? `
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();resolverAltaPrevia(${n.altaIdx},false)">No, es nuevo</button>
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();resolverAltaPrevia(${n.altaIdx},true)">Sí, ya era socio</button>
      </div>` : '';
    return `<div class="notif-item">${esc(n.txt)} ${n.new?'<span class="new-tag">Nuevo</span>':''}${acciones}</div>`;
  }).join('') : `<div class="notif-item">${emptyState('ti-bell-off','Sin notificaciones')}</div>`;
}

function toggleNotif(who){
  const panel = who==='staff' ? $('#staffNotifPanel') : $('#socioNotifPanel');
  const open = panel.classList.contains('hidden');
  panel.classList.toggle('hidden');
  if(open){
    const list = who==='staff' ? notifStaff : (notifSocio[currentSocioIdx]||[]);
    renderNotifPanel(who);
    list.forEach(n=>n.new=false);
    updateNotifDots();
  }
}

function resolverAltaPrevia(idx, eraSocio){
  const s = SOCIOS[idx];
  if(!s) return;
  s.altaPendiente = false;
  if(eraSocio){
    s.es = 'ok';
    s.nt.push(`Marcado como socio anterior a la app, pago al día (${new Date().toLocaleDateString('es-AR')}). Falta asignarle un plan.`);
  } else {
    s.nt.push(`Confirmado como socio nuevo desde la app (${new Date().toLocaleDateString('es-AR')}).`);
  }
  notifStaff = notifStaff.filter(n=>n.altaIdx!==idx);
  persist();
  renderNotifPanel('staff');
  if(staffPage) renderStaff();
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.notif-wrap')){
    $('#staffNotifPanel')?.classList.add('hidden');
    $('#socioNotifPanel')?.classList.add('hidden');
  }
});

function isSuperOwner(){
  return currentRole==='dueno' && currentStaffId===null;
}
function isDueno(){
  return currentRole==='dueno';
}
function staffMenu(){

function currentStaff(){
  return STAFF.find(s=>s.id===currentStaffId) || null;
}

function hasPerm(key){
  if(isSuperOwner()) return true;
  const st = currentStaff();
  return !!(st && st.perms[key]);
}

function renderStaffSidebar(){
  const items = staffMenu().filter(it=>{
    if(isSuperOwner()) return true;
    if(it.id==='cuentas') return hasPerm('cuentas');
    if(it.id==='pagos') return hasPerm('verPagos')||hasPerm('cargarPagos');
    return true;
  });
  $('#staffSidebar').innerHTML = `
    <div class="logo"><img src="logo.jpg" alt="AFYS"></div>
    ${items.map(it=>`<div class="nav-item ${it.id===staffPage?'active':''}" data-page="${it.id}"><i class="ti ${it.icon}"></i>${it.label}</div>`).join('')}
  `;

function parseMonto(m){
  const n = parseInt(String(m||'').replace(/[^\d]/g,''),10);
  return isNaN(n) ? 0 : n;
}
function fmtMonto(n){ return '$'+n.toLocaleString('es-AR'); }
function ingresosUltimosMeses(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const total = PAGOS.filter(p=>{ const pd=new Date(p.f); return !isNaN(pd) && pd.getMonth()===d.getMonth() && pd.getFullYear()===d.getFullYear(); }).reduce((a,p)=>a+parseMonto(p.m),0);
    out.push({label: d.toLocaleDateString('es-AR',{month:'long'}), total});
  }
  return out;
}

  </div>`;
  })():''}
  `;

  persist();

  renderStaff();

function eliminarSocioCompleto(idx){
  const sEliminado = SOCIOS[idx];
  logMovimiento('eliminacion_socio', `Eliminación definitiva de socio: ${sEliminado.n}`);
  if(sEliminado.email) delete SOCIOS_LOGIN[sEliminado.email];
  SOCIOS.splice(idx,1);
  Object.keys(SOCIOS_LOGIN).forEach(email=>{
    const info = SOCIOS_LOGIN[email];
    if(info.idx===idx) delete SOCIOS_LOGIN[email];
    else if(info.idx>idx) info.idx--;
  });
  const newNotif = {};
  Object.keys(notifSocio).map(Number).forEach(k=>{
    if(k===idx) return;
    newNotif[k>idx?k-1:k] = notifSocio[k];
  });
  Object.keys(notifSocio).forEach(k=>delete notifSocio[k]);
  Object.assign(notifSocio, newNotif);
  const newRes = {};
  Object.keys(RESERVAS).map(Number).forEach(k=>{
    if(k===idx) return;
    newRes[k>idx?k-1:k] = RESERVAS[k];
  });
  Object.keys(RESERVAS).forEach(k=>delete RESERVAS[k]);
  Object.assign(RESERVAS, newRes);
  if(currentSocioIdx===idx) currentSocioIdx=null;
  else if(currentSocioIdx>idx) currentSocioIdx--;
  persist();
  closeModal(); renderStaff();
}

function mesPagoOptionsHTML(selected){
  const now = new Date();
  const opciones = [];
  for(let off=-3; off<=3; off++){
    const d = new Date(now.getFullYear(), now.getMonth()+off, 1);
    const value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    let etiqueta = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
    if(off===0) etiqueta += ' (mes actual)';
    else if(off===-1) etiqueta += ' (mes anterior)';
    opciones.push({value, etiqueta});
  }
  const sel = selected || (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  return opciones.map(o=>`<option value="${o.value}" ${o.value===sel?'selected':''}>${esc(o.etiqueta)}</option>`).join('');
}

function savePagoAnterior(idx){
  const s = SOCIOS[idx];
  const f = $('#pga_f').value;
  if(!f){ showToast('Elegí una fecha.', 'error'); return; }
  const data = {sid:s.id, n:s.n, m:$('#pga_m').value||'$0', f, mp:$('#pga_mp').value, nt:($('#pga_n').value||'Pago anterior al sistema').trim()};
  s.vence = addDaysISO(f, PLAN_DAYS[s.pl]||30);
  s.es = 'ok';
  PAGOS.push(data);
  PAGOS.sort((a,b)=>new Date(b.f)-new Date(a.f));
  logMovimiento('pago', `Pago anterior registrado: ${data.m} de ${s.n} (${mesPagoLabel(data.mp)})`);
  persist();
  showToast('Pago anterior guardado');
  closeModal(); renderStaff();
}
function savePago(){
  const s = SOCIOS.find(s=>s.id===$('#pg_s').value);
  if(!s){ showToast('Elegí un socio.', 'error'); return; }
  const data = {sid:s.id, n:s.n, m:$('#pg_m').value||'$0', f:$('#pg_f').value||'-', mp:$('#pg_mp').value, nt:$('#pg_n').value};
  if(editPagoIdx!==null){
    PAGOS[editPagoIdx] = data;
  } else {
    s.vence = addDaysISO(data.f!=='-'?data.f:null, PLAN_DAYS[s.pl]||30);
    s.es='ok';
    PAGOS.unshift(data);
    if(currentRole==='profesor'){
      const st = currentStaff();
      notifStaff.unshift({txt:`${st?st.n:'Un profesor'} cargó un pago de ${data.m} para ${s.n}.`, new:true});
    }
    logMovimiento('pago', `Pago registrado: ${data.m} de ${s.n} (${mesPagoLabel(data.mp)})`);
  }
  editPagoIdx = null;
  persist();
  showToast('Guardado');
  closeModal(); renderStaff();
}
function deletePago(payIdx){
  if(!confirm('¿Eliminar este pago? No se modificará el estado del socio.')) return;
  const pEliminado = PAGOS[payIdx];
  if(pEliminado) logMovimiento('eliminacion_pago', `Eliminación de pago: ${pEliminado.m} de ${pEliminado.n}`);
  PAGOS.splice(payIdx,1);
  editPagoIdx = null;
  persist();
  showToast('Eliminado');
  closeModal(); renderStaff();
}

function saveClase(){
  const n=$('#cl_n').value.trim()||'Nueva clase';
  const d=$('#cl_d').value;
  const h=timeSelectValue('cl_h')||'08:00';
  const dur=parseInt($('#cl_dur').value)||60;
  const insSel = $('#cl_ins').value;
  let ins, insId;
  if(insSel==='__otro__'){ ins = $('#cl_ins_otro').value.trim()||'Sin asignar'; insId = null; }
  else { const p = STAFF.find(s=>s.id===insSel); ins = p?p.n:'Sin asignar'; insId = p?p.id:null; }
  const cupo = $('#cl_c').value||12;
  let c;
  if(editClaseIdx!==null){
    c = CLASES_HOY[editClaseIdx];
    const entradas = (c.cu.split('/')[0])||0;
    Object.assign(c, {n,d,h,dur,ins,insId,cu:`${entradas}/${cupo}`});
  } else {
    c = {n,d,h,dur,ins,insId,cu:`0/${cupo}`,cId:newClaseId()};
    CLASES_HOY.push(c);
  }
  syncClaseTurno(c);
  persist();
  showToast('Guardado');
  closeModal(); renderStaff();
}
function deleteClase(idx){
  const c = CLASES_HOY[idx];
  if(!confirm(`¿Eliminar la clase "${c.n}"?`)) return;
  if(c.cId) TURNOS = TURNOS.filter(t=>t.claseId!==c.cId);

  persist();
  closeModal();
  renderStaff();

function addMinutes(hhmm, minutes){
  const mins = hToMin(hhmm)+minutes;
  const h = Math.floor((mins%1440)/60), m = mins%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function newClaseId(){
  return 'cl_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
}
function syncClaseTurno(c){
  if(!c.cId) c.cId = newClaseId();
  if(!DIAS_SEMANA.includes(c.d)) return; // sin día válido de la semana, no se puede ubicar en el calendario
  const staffMatch = c.insId ? STAFF.find(s=>s.id===c.insId) : STAFF.find(s=>s.n===c.ins);
  const data = {dia:c.d, desde:c.h, hasta:addMinutes(c.h,c.dur||60), clase:c.n, staffId: staffMatch?staffMatch.id:null, claseId:c.cId};
  const existing = TURNOS.find(t=>t.claseId===c.cId);
  if(existing) Object.assign(existing, data);
  else TURNOS.push({id:turnoSeq++, ...data});
}

function parseSeriesReps(e, val){

function canEditHorarios(){ return isSuperOwner() || (currentRole!=='profesor' && hasPerm('horarios')); }
const CAL_START = 7;   // 07:00
const CAL_END = 22;    // 22:00
const CAL_PXH = 28;    // px por hora
function hToMin(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
function proximoTurnoProfesor(st){
  if(!st) return null;
  const turnos = TURNOS.filter(t=>t.staffId===st.id);
  if(!turnos.length) return null;
  const now = new Date();
  const DIAS_JS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const idxHoy = DIAS_SEMANA.indexOf(DIAS_JS[now.getDay()]);
  const nowMin = now.getHours()*60+now.getMinutes();
  for(let off=0; off<7; off++){
    const dia = DIAS_SEMANA[(idxHoy+off)%7];
    const deDia = turnos.filter(t=>t.dia===dia && (off>0 || hToMin(t.desde)>nowMin)).sort((a,b)=>hToMin(a.desde)-hToMin(b.desde));
    if(deDia.length) return deDia[0];
  }
  return null;
}
function staffColor(id){
  const s = STAFF.find(s=>s.id===id);
  if(s && s.color) return s.color;
  const idx = STAFF.findIndex(s=>s.id===id);
  return TURNO_COLORS[idx>=0?idx%TURNO_COLORS.length:0];
}

const DIA_JS_IDX = {'Domingo':0,'Lunes':1,'Martes':2,'Miércoles':3,'Jueves':4,'Viernes':5,'Sábado':6};
function turnoHoras(t){ return Math.max(0,(hToMin(t.hasta)-hToMin(t.desde))/60); }
function weeklyHorasPorProfe(profes){
  return profes.map(p=>({
    p, horas: TURNOS.filter(t=>t.staffId===p.id).reduce((a,t)=>a+turnoHoras(t),0)
  }));
}
function monthOccurrences(dia, year, month){
  const target = DIA_JS_IDX[dia];
  const last = new Date(year, month+1, 0).getDate();
  let count = 0;
  for(let d=1; d<=last; d++){ if(new Date(year,month,d).getDay()===target) count++; }
  return count;
}
function monthlyHorasPorProfe(profes, year, month){
  return profes.map(p=>({
    p, horas: TURNOS.filter(t=>t.staffId===p.id).reduce((a,t)=>a+turnoHoras(t)*monthOccurrences(t.dia,year,month),0)
  }));
}
let horasMesSel = null;
function pageHorasProfes(profes){
  const now = new Date();
  if(!horasMesSel) horasMesSel = {year:now.getFullYear(), month:now.getMonth()};

  const mensual = monthlyHorasPorProfe(profes, horasMesSel.year, horasMesSel.month);

        <select id="hm_anio" onchange="horasMesSel.year=parseInt(this.value);renderStaff();">${[now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1].map(y=>`<option value="${y}" ${y===horasMesSel.year?'selected':''}>${y}</option>`).join('')}</select>
      </div>
    </div>
    <p style="color:var(--text2);font-size:13px;margin-bottom:10px;">Estimado a partir de cuántas veces cae cada día de la semana en el mes elegido, según los turnos fijos del calendario.</p>
    <table><thead><tr><th>Profesor/a</th><th>Horas en ${meses[horasMesSel.month]} ${horasMesSel.year}</th></tr></thead>
    <tbody>${mensual.map(({p,horas})=>`<tr><td>${esc(p.n)}</td><td>${horas.toFixed(1)} hs</td></tr>`).join('')||emptyRow('ti-users','Sin profesores cargados',2)}</tbody></table>
  </div>`;
}

function deleteEjercicio(g,name){
  if(!confirm(`¿Eliminar "${name}"? Si está en más de un tipo, se quita de todos, y también se quita de las rutinas que lo tengan.`)) return;
  Object.keys(EJD).forEach(grp=>{ EJD[grp] = EJD[grp].filter(e=>e!==name); });
  delete EJ_VIDEOS[name];
  delete EJ_IMAGES[name];
  RUTINAS.forEach(r=>{ r.ejs = r.ejs.filter(e=>e.n!==name); });
  SOCIOS.forEach(s=>{
    if(s.rsOverride) Object.values(s.rsOverride).forEach(ejs=>{ for(let i=ejs.length-1;i>=0;i--){ if(ejs[i].n===name) ejs.splice(i,1); } });
    if(s.rsMiPeso) Object.values(s.rsMiPeso).forEach(mp=>delete mp[name]);
    if(s.rsHechos) Object.values(s.rsHechos).forEach(h=>delete h[name]);
  });
  persist();
  renderStaff();
}

function renombrarEjercicio(oldName){
  const newName = $('#ren_ej_nombre').value.trim();
  if(!newName || newName===oldName){ closeModal(); return; }
  if(ejFlatList().some(e=>e.n===newName)){ alert('Ya existe un ejercicio con ese nombre.'); return; }
  Object.keys(EJD).forEach(g=>{ EJD[g] = EJD[g].map(e=>e===oldName?newName:e).sort((a,b)=>a.localeCompare(b,'es')); });
  if(EJ_VIDEOS[oldName]!==undefined){ EJ_VIDEOS[newName] = EJ_VIDEOS[oldName]; delete EJ_VIDEOS[oldName]; }
  if(EJ_IMAGES[oldName]!==undefined){ EJ_IMAGES[newName] = EJ_IMAGES[oldName]; delete EJ_IMAGES[oldName]; }
  RUTINAS.forEach(r=>{ r.ejs.forEach(e=>{ if(e.n===oldName) e.n = newName; }); });
  SOCIOS.forEach(s=>{
    if(s.rsOverride) Object.values(s.rsOverride).forEach(ejs=>{ ejs.forEach(e=>{ if(e.n===oldName) e.n = newName; }); });
    if(s.rsMiPeso) Object.values(s.rsMiPeso).forEach(mp=>{ if(mp[oldName]!==undefined){ mp[newName] = mp[oldName]; delete mp[oldName]; } });
    if(s.rsHechos) Object.values(s.rsHechos).forEach(h=>{ if(h[oldName]!==undefined){ h[newName] = h[oldName]; delete h[oldName]; } });
  });
  persist();
  closeModal();
  renderStaff();
}

  `);

function saveEjercicioGrupos(name){
  const checked = Object.keys(EJD).filter(g=>document.getElementById('eg_'+g)?.checked);
  if(!checked.length){ alert('El ejercicio debe pertenecer a al menos un tipo.'); return; }
  Object.keys(EJD).forEach(g=>{
    const has = EJD[g].includes(name);
    const should = checked.includes(g);
    if(should && !has) EJD[g].push(name);
    else if(!should && has) EJD[g] = EJD[g].filter(e=>e!==name);
  });
  Object.keys(EJD).forEach(g=>EJD[g].sort((a,b)=>a.localeCompare(b,'es')));
  persist();
  closeModal(); renderStaff();
}

function openModal(html, size){
  const prevBox = document.querySelector('.modal-box');
  const prevBoxTop = prevBox ? prevBox.scrollTop : 0;
  const prevList = document.getElementById('modalScrollList');
  const prevListTop = prevList ? prevList.scrollTop : 0;
  const active = document.activeElement;
  const focusInfo = (active && prevBox && prevBox.contains(active) && active.id) ? {
    id: active.id, start: active.selectionStart, end: active.selectionEnd
  } : null;
  $('#modalHost').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box ${size==='wide'?'wide':''}">${html}</div></div>`;
  const box = document.querySelector('.modal-box');
  if(box) box.scrollTop = prevBoxTop;
  const list = document.getElementById('modalScrollList');
  if(list) list.scrollTop = prevListTop;
  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      el.focus();
      if(typeof focusInfo.start==='number'){ try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){} }
    }
  }
}

function calcAge(birthStr){
  const b = new Date(birthStr+'T00:00:00');
  if(isNaN(b)) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const hadBirthdayThisYear = (now.getMonth()>b.getMonth()) || (now.getMonth()===b.getMonth() && now.getDate()>=b.getDate());
  if(!hadBirthdayThisYear) age--;
  return age;
}

}
function claseKey(c){ return c.cId || (c.n+'_'+c.h); }
function inscriptosClase(c){
  const k = claseKey(c);
  const list = [];
  Object.keys(RESERVAS).forEach(idxStr=>{
    const idx = Number(idxStr);
    if(RESERVAS[idx] && RESERVAS[idx][k] && SOCIOS[idx]) list.push(SOCIOS[idx]);
  });
  return list;
}
function openInscriptosModal(idx){
  const c = CLASES_HOY[idx];
  const list = inscriptosClase(c);
  openModal(`
    <div class="modal-head"><h3>Inscriptos — ${esc(c.n)}</h3><button onclick="closeModal()">✕</button></div>
    <p style="color:var(--text2);font-size:14px;margin-bottom:10px;">${esc(c.d||'')} ${c.h} — ${list.length} inscripto${list.length===1?'':'s'}</p>
    <div id="inscriptosListBox">${inscriptosListHTML(idx)}</div>

  `);
}
function inscriptosListHTML(idx){
  const c = CLASES_HOY[idx];
  const k = claseKey(c);
  const list = [];
  Object.keys(RESERVAS).forEach(idxStr=>{
    const si = Number(idxStr);
    if(RESERVAS[si] && RESERVAS[si][k] && SOCIOS[si]) list.push({s:SOCIOS[si], si});
  });
  return list.length?`<table><thead><tr><th>Nombre</th><th>Teléfono</th><th></th></tr></thead><tbody>
    ${list.map(({s,si})=>`<tr><td>${esc(s.n)}</td><td>${esc(s.tel||'-')}</td><td><button class="btn btn-outline btn-sm" onclick="quitarInscripto(${idx},${si})" title="Quitar">✕</button></td></tr>`).join('')}

}
function agregarInscriptoOptionsHTML(q,c){
  q = (q||'').toLowerCase().trim();
  const k = claseKey(c);
  const candidatos = SOCIOS.map((s,idx)=>({s,idx})).filter(({s,idx})=>s.activo!==false && s.n.toLowerCase().includes(q) && !(RESERVAS[idx]&&RESERVAS[idx][k]));
  return candidatos.length ? candidatos.map(({s,idx})=>`<option value="${idx}">${esc(s.n)}</option>`).join('') : `<option value="" disabled>Sin resultados</option>`;
}
function filterAgregarInscriptoSelect(idx,q){
  const sel = document.getElementById('insc_add_s');
  if(sel) sel.innerHTML = agregarInscriptoOptionsHTML(q, CLASES_HOY[idx]);
}
function agregarInscripto(idx){
  const c = CLASES_HOY[idx];
  const sel = document.getElementById('insc_add_s');
  const si = parseInt(sel.value);
  if(isNaN(si)){ showToast('Elegí un socio.', 'error'); return; }
  const k = claseKey(c);
  if(!RESERVAS[si]) RESERVAS[si] = {};
  RESERVAS[si][k] = true;
  persist();
  openInscriptosModal(idx);
}
function quitarInscripto(idx, si){
  const c = CLASES_HOY[idx];
  const k = claseKey(c);
  if(RESERVAS[si]) delete RESERVAS[si][k];
  persist();
  openInscriptosModal(idx);
}
function socioReservas(){ return RESERVAS[currentSocioIdx] || (RESERVAS[currentSocioIdx]={}); }
function socioClases(){
  const misReservas = socioReservas();
  const DIAS_JS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const diaHoy = DIAS_JS[new Date().getDay()];
  const idxHoy = DIAS_SEMANA.indexOf(diaHoy);
  const clasesSemana = CLASES_HOY.map((c,i)=>({c,i})).filter(({c})=>DIAS_SEMANA.indexOf(c.d)>=idxHoy);
  if(!clasesSemana.length) return `<h2>Clases disponibles</h2>${emptyState('ti-calendar-plus','No hay clases programadas para el resto de esta semana.')}`;
  return `
  <h2>Clases disponibles</h2>
  ${clasesSemana.map(({c,i})=>{
    const [act,tot] = c.cu.split('/').map(Number);
    const full = act>=tot;
    const booked = !!misReservas[claseKey(c)];
    const esHoy = c.d===diaHoy;
    return `<div class="class-card" style="${booked?'border:2px solid var(--green);background:rgba(34,197,94,.08);':''}">
      <div style="display:flex;align-items:center;gap:10px;">
        ${booked?`<span style="width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-check" style="font-size:18px;"></i></span>`:''}
        <div><b>${esc(c.n)}</b><div style="font-size:13px;color:var(--text2);">${esHoy?'<b style="color:var(--primary);">Hoy</b>':esc(c.d)} · ${c.h} · ${esc(c.ins)} · ${c.cu}</div></div>
      </div>
      <button class="btn btn-sm ${booked?'btn-outline':full?'btn-outline':'btn-primary'}" style="${booked?'color:var(--green);border-color:var(--green);':''}" ${full&&!booked?'disabled':''} onclick="toggleReserva(${i})">${booked?'✓ Reservada':full?'Sin cupo':'Reservar'}</button>
    </div>`;

}
function toggleReserva(i){
  const c = CLASES_HOY[i];
  const misReservas = socioReservas();
  const k = claseKey(c);
  if(misReservas[k]) delete misReservas[k];
  else misReservas[k] = true;
  persist();
  renderSocio();
}

  return `<div style="display:flex;gap:5px;margin-top:8px;">${DIAS_SEMANA.map(d=>{
    const on = dias && dias.includes(d);
    return `<span style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;${on?'background:var(--primary);color:#fff;':'background:var(--bg2);color:var(--text2);'}">${letras[d]}</span>`;
  }).join('')}</div>`;
}

  const cuando = s.ultimoEntreno.f===hoy ? 'hoy' : `el ${fmtFechaCorta(s.ultimoEntreno.f)}`;
  return `Último entrenamiento: <b>${nombre}</b>${r?'':' (rutina eliminada)'} · ${cuando}`;
}

    ${misRutinas.map((r,i)=>{
      const ejs = (s.rsOverride&&s.rsOverride[r.n]) ? s.rsOverride[r.n] : r.ejs;

        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            ${esHoy?`<span class="badge" style="background:var(--primary);color:#fff;margin-bottom:6px;display:inline-block;">HOY TE TOCA</span>`:''}
            <div><b style="font-size:17px;">${esc((s.rsNombre&&s.rsNombre[r.n])||r.n)}</b></div>
            ${r.ob?`<p style="color:var(--text2);font-size:14px;margin:3px 0 0;">${esc(r.ob)}</p>`:''}
          </div>
          <span class="badge ${ejs.length&&doneCount===ejs.length?'b-ok':''}" style="font-size:13px;white-space:nowrap;">${doneCount}/${ejs.length} hechos</span>
        </div>

}

            <button id="ejBtn${ei}" class="btn btn-sm ej-done-btn ${done?'btn-primary':'btn-outline'}" style="margin-left:auto;height:40px;width:128px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;" onclick="toggleEjercicioHecho('${rname.replace(/'/g,"\\'")}','${e.n.replace(/'/g,"\\'")}',${ei})"><i class="ti ti-check" style="font-size:19px;"></i><span>${done?'Hecho':'Marcar hecho'}</span></button>

function toggleEjercicioHecho(rname, ejName, ei){
  const s = SOCIOS[currentSocioIdx];
  if(!s.rsHechos) s.rsHechos = {};
  if(!s.rsHechos[rname]) s.rsHechos[rname] = {};
  const hoy = todayISO();
  if(s.rsHechos[rname][ejName]===hoy) delete s.rsHechos[rname][ejName];
  else { s.rsHechos[rname][ejName] = hoy; s.ultimoEntreno = {r:rname, f:hoy}; }
  persist();
  const done = s.rsHechos[rname][ejName]===hoy;
  if(typeof ei==='number'){
    const row = document.getElementById('ejRow'+ei);
    const btn = document.getElementById('ejBtn'+ei);
    if(row && btn){
      row.style.backgroundColor = done ? '#eceef1' : '';
      btn.className = 'btn btn-sm ej-done-btn '+(done?'btn-primary':'btn-outline');
      btn.querySelector('span').textContent = done ? 'Hecho' : 'Marcar hecho';
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
      return;
    }
  }
  openSocioRutinaDetalleModal(rname);
}
function setMiPesoEj(si, rname, ejName, val){
  const s = SOCIOS[si];
  if(!s.rsMiPeso) s.rsMiPeso = {};
  if(!s.rsMiPeso[rname]) s.rsMiPeso[rname] = {};
  s.rsMiPeso[rname][ejName] = val;
  persist();
}

/* ============ ARRANQUE: cargar datos guardados antes de mostrar el login ============ */
(async function init(){
  $('#login').classList.add('hidden');
  document.body.insertAdjacentHTML('beforeend', '<div id="loadingOverlay" style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary);z-index:999;">Cargando datos...</div>');
  try{
    await loadState();
  }catch(e){
    const ov = $('#loadingOverlay');
    ov.style.flexDirection = 'column';
    ov.style.gap = '14px';
    ov.style.color = 'var(--red)';
    ov.innerHTML = `<i class="ti ti-wifi-off" style="font-size:32px;"></i>
      <span>No se pudo conectar. Revisá tu internet e intentá de nuevo.</span>
      <button class="btn btn-primary" onclick="location.reload()">Reintentar</button>`;
    return;
  }
  recalcEstados({notify:true});
  $('#loadingOverlay').remove();

  const urlParams = new URLSearchParams(window.location.search);
  const qrType = urlParams.get('qr'); // 'general' | 'clase' (escaneado con la cámara del celular)
  const isStaffQR = urlParams.get('staff')==='1';
  const inviteToken = urlParams.get('invite');
  if(qrType || isStaffQR || inviteToken){
    if(qrType) pendingQR = {tipo: qrType, clase: urlParams.get('nombre')||null};
    window.history.replaceState({}, '', window.location.pathname);
  }
  let invite = null;
  if(inviteToken){
    invite = PENDING_INVITES.find(i=>i.token===inviteToken) || null;
  }

  const isRecovery = window.location.hash.includes('type=recovery');
  const {data:{session}} = await sb.auth.getSession();
  if(isRecovery && session){
    window.history.replaceState({}, '', window.location.pathname);
    loginView='resetPassword'; loginError=''; loginInfo='';
    $('#login').classList.remove('hidden');
    renderLogin();
  } else if(session && session.user && session.user.email){
    const sEmail = session.user.email.toLowerCase();
    if(isStaffQR && sEmail!==DUENO_EMAIL && !STAFF.find(s=>s.email===sEmail) && !SOCIOS_LOGIN[sEmail]){
      ensureStaffProfile(sEmail, session.user);
    }
    await routeLoggedInUser(sEmail);
    if(pendingQR && currentRole==='socio') startScan();
  } else if(invite){
    openStaffGate(invite);
  } else if(inviteToken){
    $('#login').classList.remove('hidden');
    loginError='Este link de invitación ya no es válido. Pedí uno nuevo.';
    renderLogin();
  } else if(isStaffQR){
    openStaffGate();
  } else if(pendingQR){
    openQRGate();
  } else {
    $('#login').classList.remove('hidden');
    renderLogin();
  }
})();
</script>
