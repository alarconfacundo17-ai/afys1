<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gimnasio Afys</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
:root{
  --primary:#3B82C9; --primary-light:rgba(59,130,201,.13);
  --green:#059669; --red:#DC2626;
  --bg:#fff; --bg2:#f9fafb; --border:#e5e7eb; --border2:#f0f0f0;
  --text:#111; --text2:#6b7280;
  --card-shadow:0 1px 3px rgba(0,0,0,.06);
}
/* ── DARK MODE ─────────────────────────────────────────────────────── */
[data-theme="dark"]{
  --primary:#5fa8f5;
  --primary-light:rgba(95,168,245,.15);
  --green:#34d399; --red:#f87171;
  --bg:#1e2029;      /* card / panel surface */
  --bg2:#13141a;     /* deepest background */
  --border:#2a2d3a;  /* subtle borders */
  --border2:#1f2130; /* hairline separators */
  --text:#dde1ed;    /* main text — slightly cool-white */
  --text2:#7a82a0;   /* muted / secondary */
  --card-shadow:0 1px 6px rgba(0,0,0,.35);
}
/* surfaces that were hardcoded #fff */
[data-theme="dark"] body{background:var(--bg2);}
[data-theme="dark"] .card,
[data-theme="dark"] .metric,
[data-theme="dark"] .modal-box,
[data-theme="dark"] .login-box,
[data-theme="dark"] .sidebar,
[data-theme="dark"] .topbar,
[data-theme="dark"] .notif-panel,
[data-theme="dark"] .bottom-nav,
[data-theme="dark"] .welcome-banner,
[data-theme="dark"] .ej-picker-list,
[data-theme="dark"] .day-pill,
[data-theme="dark"] .socio-topbar{
  background:var(--bg);
  color:var(--text);
  border-color:var(--border);
}
/* form controls */
[data-theme="dark"] input,
[data-theme="dark"] select,
[data-theme="dark"] textarea{
  background:var(--bg2);
  color:var(--text);
  border-color:var(--border);
}
[data-theme="dark"] input::placeholder,
[data-theme="dark"] textarea::placeholder{ color:var(--text2); }
/* sticky modal header */
[data-theme="dark"] .modal-sticky-top{ background:var(--bg); }
/* btn-outline */
[data-theme="dark"] .btn-outline{
  background:var(--bg);
  color:var(--text);
  border-color:var(--border);
}
[data-theme="dark"] .btn-outline:hover{ background:var(--bg2); }
/* table */
[data-theme="dark"] th{ color:var(--text2); background:transparent; }
[data-theme="dark"] td{ border-color:var(--border2); }
/* group blocks (ejercicios) */
[data-theme="dark"] .group-head{ background:var(--bg2); }
[data-theme="dark"] .group-block{ border-color:var(--border); }
/* navigation */
[data-theme="dark"] .nav-item.active{ background:rgba(95,168,245,.15); color:var(--primary); }
[data-theme="dark"] .nav-item:hover{ background:rgba(255,255,255,.04); }
/* badges */
[data-theme="dark"] .b-ok  { background:rgba(52,211,153,.12); color:#6ee7b7; }
[data-theme="dark"] .b-warn{ background:rgba(251,191,36,.12);  color:#fcd34d; }
[data-theme="dark"] .b-err { background:rgba(248,113,113,.12); color:#fca5a5; }
[data-theme="dark"] .b-info{ background:rgba(96,165,250,.12);  color:#93c5fd; }
[data-theme="dark"] .b-purple{ background:rgba(167,139,250,.12); color:#c4b5fd; }
/* tags (rutinas asignadas) */
[data-theme="dark"] .tag{ background:rgba(95,168,245,.15); color:#93c5fd; }
/* role button (login) */
[data-theme="dark"] .role-btn.active{ background:rgba(95,168,245,.15); color:var(--primary); border-color:var(--primary); }
[data-theme="dark"] .role-btn{ border-color:var(--border); color:var(--text2); }
/* metric cards */
[data-theme="dark"] .metric{ border-left-color:var(--primary); }
/* calendar grid */
[data-theme="dark"] .cal-corner,
[data-theme="dark"] .cal-daylabel{ background:var(--bg2); }
[data-theme="dark"] .cal-hourline,
[data-theme="dark"] .cal-daycol{ border-color:var(--border2); }
/* notif panel items */
[data-theme="dark"] .notif-item{ border-color:var(--border2); }
/* hint block */
[data-theme="dark"] .hint{ background:var(--bg2); }
/* bar track */
[data-theme="dark"] .bar-track{ background:var(--border); }
/* day-row (clases socio) */
[data-theme="dark"] .class-card,
[data-theme="dark"] .day-row{ border-color:var(--border); }
/* socio app nav */
[data-theme="dark"] #socio{ background:var(--bg2); }
/* toast stays dark in both modes — no override needed */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg2);color:var(--text);}
.hidden{display:none !important;}
button{cursor:pointer;font-family:inherit;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;width:100%;}
.btn{padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-outline{background:var(--bg);border:1px solid var(--border);color:var(--text);}
.btn-sm{padding:7px 11px;font-size:13px;min-height:34px;min-width:34px;justify-content:center;}
.btn:hover{opacity:.9;}
.btn:active{opacity:.75;}
.card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px;overflow-x:auto;box-shadow:var(--card-shadow);}
.empty-state{text-align:center;padding:32px 12px;color:var(--text2);}
.empty-state i{font-size:32px;display:block;margin-bottom:8px;opacity:.4;}
.empty-state p{font-size:14px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 8px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:600;}
td{padding:10px 8px;border-bottom:1px solid var(--border2);}
.badge{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;display:inline-block;}
.b-ok{background:#D1FAE5;color:#064E3B;}
.b-warn{background:#FEF3C7;color:#92400E;}
.b-err{background:#FEE2E2;color:#991B1B;}
.b-info{background:#dbeafe;color:#1e40af;}
.b-purple{background:#EDE9FE;color:#5B21B6;}
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.metric{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:14px;padding:14px 16px;box-shadow:var(--card-shadow);}
.metric .num{font-size:24px;font-weight:700;color:var(--primary);}
.metric .lbl{font-size:13px;color:var(--text2);margin-top:3px;}
h2{font-size:20px;margin-bottom:14px;}
h3{font-size:15px;margin-bottom:10px;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);}
.login-box{background:var(--bg);border-radius:16px;padding:36px;width:380px;max-width:92vw;box-shadow:0 4px 32px rgba(0,0,0,.12);}
.login-box h1{font-size:24px;text-align:center;margin-bottom:4px;}
.login-box p.sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:20px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.role-btn{padding:14px;border:2px solid var(--border);border-radius:10px;text-align:center;font-weight:600;font-size:14px;}
.role-btn.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);}
.login-box label{font-size:12.5px;font-weight:600;display:block;margin:10px 0 4px;}
.login-logo{display:block;max-width:220px;width:100%;margin:0 auto 18px;}
.hint{background:var(--bg2);border-radius:8px;padding:10px;font-size:11.5px;color:var(--text2);margin-top:16px;line-height:1.6;}

#qrGate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);}

/* STAFF LAYOUT */
#staff{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--bg);border-right:1px solid var(--border);padding:20px 12px;flex-shrink:0;}
.sidebar .logo{padding:0 6px 20px;display:flex;align-items:center;}
.sidebar .logo img{width:100%;max-width:170px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text2);margin-bottom:2px;}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600;}
.nav-item:hover{background:var(--bg2);}
.main{flex:1;padding:0;}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;}
.topbar .role-tag{font-size:13px;color:var(--text2);}
.bell{position:relative;font-size:20px;}
.bell .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%;}
.content{padding:24px 26px;}
.page{display:none;}
.page.active{display:block;}

/* notif dropdown */
.notif-wrap{position:relative;}
.notif-panel{position:absolute;right:0;top:34px;width:300px;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:360px;overflow:auto;z-index:50;}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border2);font-size:14px;}
.notif-item .new-tag{background:var(--green);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px;}

/* groups (ejercicios) */
.group-block{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.group-head{padding:12px 16px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;}
.group-body{padding:10px 16px;}
.ej-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border2);font-size:13.5px;}
.ej-row:last-child{border-bottom:none;}
.dot-num{display:inline-flex;width:22px;height:22px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-size:11px;margin-right:8px;font-weight:700;}

/* ── KEYFRAMES ─────────────────────────────────────────────────────── */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes overlayOut{from{opacity:1;}to{opacity:0;}}
@keyframes sheetIn{from{opacity:0;transform:translateY(32px) scale(.98);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes sheetOut{from{opacity:1;transform:translateY(0) scale(1);}to{opacity:0;transform:translateY(24px) scale(.97);}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeInStagger{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes checkPop{0%{transform:scale(1);}35%{transform:scale(1.22);}70%{transform:scale(.95);}100%{transform:scale(1);}}
@keyframes eliteFadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes eliteSlideUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes navTabIn{from{transform:scale(.88);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes ripple{from{transform:scale(0);opacity:.35;}to{transform:scale(2.5);opacity:0;}}
@keyframes progressFill{from{width:0%;}to{width:var(--pct,0%);}}

/* ── MODAL / SHEET ─────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:200;
  animation:overlayIn .2s ease both;
  -webkit-backdrop-filter:blur(2px);
  backdrop-filter:blur(2px);
}
@media(min-width:520px){.modal-overlay{align-items:center;padding:14px;}}
.modal-overlay.closing{animation:overlayOut .18s ease both;}
.modal-box{
  background:var(--bg);
  border-radius:22px 22px 0 0;
  padding:20px 20px 32px;
  width:100%;max-width:520px;
  max-height:92vh;overflow:auto;
  box-shadow:0 -4px 40px rgba(0,0,0,.18);
  animation:sheetIn .28s cubic-bezier(.32,1.1,.56,1) both;
  color:var(--text);
  position:relative;
}
.modal-box::before{
  content:'';display:block;width:36px;height:4px;
  background:var(--border);border-radius:2px;
  margin:0 auto 18px;
}
@media(min-width:520px){
  .modal-box{border-radius:18px;padding:22px;box-shadow:0 16px 60px rgba(0,0,0,.22);}
  .modal-box::before{display:none;}
}
.modal-box.wide{max-width:600px;}
.modal-box.closing{animation:sheetOut .18s ease both;}

/* ── NAV ───────────────────────────────────────────────────────────── */
.elite-nav-item{
  all:unset;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--text2);
  padding:6px 12px;border-radius:14px;cursor:pointer;flex:1;text-align:center;
  transition:color .22s cubic-bezier(.4,0,.2,1),background .22s;
  -webkit-tap-highlight-color:transparent;position:relative;overflow:hidden;
}
.elite-nav-item i{font-size:22px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.elite-nav-item.active{color:var(--primary);}
.elite-nav-item.active i{transform:scale(1.18) translateY(-1px);}
.elite-nav-item:active i{transform:scale(.88);}

/* ── PAGE TRANSITIONS ──────────────────────────────────────────────── */
.page-fade{animation:fadeInUp .24s cubic-bezier(.22,1,.36,1) both;}
.elite-fade{animation:eliteFadeIn .3s cubic-bezier(.22,1,.36,1) both;}
.elite-slide{animation:eliteSlideUp .34s cubic-bezier(.22,1,.36,1) both;}

/* Staggered children */
#eliteContent > *{animation:fadeInStagger .3s cubic-bezier(.22,1,.36,1) both;}
#eliteContent > *:nth-child(1){animation-delay:.03s;}
#eliteContent > *:nth-child(2){animation-delay:.07s;}
#eliteContent > *:nth-child(3){animation-delay:.11s;}
#eliteContent > *:nth-child(4){animation-delay:.14s;}
#eliteContent > *:nth-child(5){animation-delay:.17s;}
#staffContent>*, #socioContent>*{animation:fadeInUp .24s cubic-bezier(.22,1,.36,1) both;}

/* ── BUTTONS ───────────────────────────────────────────────────────── */
.btn{
  transition:
    opacity .15s ease,
    transform .14s cubic-bezier(.34,1.56,.64,1),
    background-color .2s ease,
    border-color .2s ease,
    color .2s ease,
    box-shadow .2s ease;
}
.btn:active{transform:scale(.94);}
.btn-primary:not(:disabled):hover{box-shadow:0 4px 16px rgba(59,130,201,.35);}
.rutinas-badge-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--primary-light);color:var(--primary);
  border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;
  white-space:nowrap;border:none;cursor:pointer;
  transition:box-shadow .18s,transform .15s cubic-bezier(.34,1.56,.64,1);
  -webkit-tap-highlight-color:transparent;
}
.rutinas-badge-btn:active{transform:scale(.94);}

/* ── EXERCISES ─────────────────────────────────────────────────────── */
.ej-done-btn{transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .14s cubic-bezier(.34,1.56,.64,1);}
.ej-done-btn.pop{animation:checkPop .38s cubic-bezier(.34,1.56,.64,1);}
.ej-row-card{transition:background-color .3s ease,border-color .3s ease,opacity .3s ease;}
.ej-row-done{background:rgba(5,150,105,.07) !important;border-color:rgba(5,150,105,.3) !important;}
[data-theme="dark"] .ej-row-done{background:rgba(52,211,153,.09) !important;border-color:rgba(52,211,153,.25) !important;}

/* ── BOTTOM NAV (socios) ───────────────────────────────────────────── */
.bn-item{transition:color .22s ease;}
.bn-item i{transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
.bn-item.active i{transform:translateY(-2px) scale(1.1);}
.bell{transition:transform .15s ease;}
.bell:active{transform:scale(.85);}

/* ── CARDS ─────────────────────────────────────────────────────────── */
.card{transition:box-shadow .22s ease,border-color .22s ease,transform .14s ease;}
.card:active{transform:scale(.985);}

/* ── PROGRESS BARS (animated on load) ─────────────────────────────── */
.pbar-fill{animation:progressFill .6s cubic-bezier(.22,1,.36,1) both;animation-delay:.2s;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:17px;}
.modal-sticky-top{position:sticky;top:-24px;margin:-24px -24px 16px -24px;padding:24px 24px 12px 24px;background:var(--bg);z-index:5;border-radius:14px 14px 0 0;box-shadow:0 4px 8px -6px rgba(0,0,0,.15);}
.field{margin-bottom:12px;}
.field label{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c1c1c;color:#fff;padding:13px 22px;border-radius:10px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:999;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast i{color:var(--green);font-size:19px;}
.toast.toast-error i{color:var(--red);}
.toast-undo{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:7px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:6px;}

/* toggle */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13.5px;}
.toggle-row:last-child{border-bottom:none;}
.toggle{width:42px;height:24px;border-radius:14px;background:#DC2626;position:relative;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.15s;}
.toggle.on::after{left:21px;}
.toggle.locked{opacity:.5;cursor:not-allowed;}

/* tags */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:var(--primary-light);color:var(--primary);padding:3px 8px;border-radius:14px;font-size:11.5px;display:flex;align-items:center;gap:5px;}
.tag .x{cursor:pointer;font-weight:700;}

/* bars */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;}
.bar-row .lbl{width:90px;flex-shrink:0;color:var(--text2);}
.bar-track{flex:1;background:var(--bg2);border-radius:6px;height:18px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary);border-radius:6px;}

/* socio app */
#socio{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}
.socio-topbar{padding:10px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);background:var(--bg);}
.socio-logo{height:34px;}
.socio-content{flex:1;padding:16px 18px;padding-bottom:92px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg);border-top:1px solid var(--border);display:flex;}
.bn-item{flex:1;text-align:center;padding:12px 0 10px;font-size:12.5px;font-weight:600;color:var(--text2);}
.bn-item i{display:block;font-size:25px;margin-bottom:3px;}
.bn-item.active{color:var(--primary);}
.s-page{display:none;}
.s-page.active{display:block;}
.welcome-banner{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 18px 14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);animation:fadeInUp .25s ease;overflow:hidden;}
.welcome-logo{width:100%;max-width:170px;height:auto;object-fit:contain;margin-bottom:4px;}
.welcome-banner h2{font-size:14.5px;margin-bottom:3px;color:var(--text);}
.welcome-banner p{font-size:13px;color:var(--text2);margin:0;line-height:1.35;}
@media(max-width:480px){.welcome-banner{padding:10px 14px 12px;}.welcome-logo{max-width:140px;}}
.ej-picker{position:relative;}
.ej-picker input{width:100%;}
.ej-picker-list{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--border);border-radius:8px;max-height:190px;overflow:auto;z-index:60;box-shadow:0 6px 16px rgba(0,0,0,.12);margin-top:3px;}
.ej-picker-item{padding:8px 10px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;}
.ej-picker-item:hover{background:var(--bg2);}
.day-pills{display:flex;gap:7px;flex-wrap:wrap;}
.day-pill{padding:9px 14px;font-size:14px;font-weight:600;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;transition:.15s;min-width:48px;text-align:center;}
.day-pill:hover{border-color:var(--primary);}
.day-pill.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.day-pill-quick{font-size:11.5px;color:var(--primary);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}
.profile-card{background:linear-gradient(135deg,#3B82C9,#60A5FA);color:#fff;border-radius:18px;padding:22px 22px 20px;margin-bottom:16px;position:relative;box-shadow:0 4px 14px rgba(59,130,201,.25);}
.avatar{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-bottom:10px;}
.profile-card .pname{font-size:17px;font-weight:700;margin-bottom:8px;}
.chip{background:rgba(255,255,255,.2);padding:4px 11px;border-radius:14px;font-size:11.5px;margin-right:6px;display:inline-block;margin-top:4px;}
.pay-banner{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.day-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.day-row.rest{opacity:.55;}
.class-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}

/* scan screen */
#scan{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;text-align:center;}
.scan-box{width:340px;}
.scan-spinner{font-size:60px;margin-bottom:20px;}
.qr-box{display:flex;justify-content:center;margin:16px 0;}

@media(max-width:760px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:120;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 16px rgba(0,0,0,.15);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:110;}
  .sidebar-overlay.open{display:block;}
  #staffMenuBtn{display:inline-flex;}
  #staff{flex-direction:column;}
  .topbar{padding:12px 14px;}
  .content{padding:14px;}
  .modal-box{padding:16px;}
  .modal-sticky-top{margin:-16px -16px 16px -16px;padding:16px 16px 12px 16px;}
  .login-box{padding:24px;}
  .section-head{flex-wrap:wrap;gap:10px;}
  table{font-size:12.5px;}
  th,td{padding:8px 6px;}
}
@media(min-width:761px){
  #staffMenuBtn{display:none;}
  .sidebar-overlay{display:none !important;}
}
#staffMenuBtn{align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;font-size:18px;}
#staffMenuBtn:hover{background:var(--bg2);}

/* horarios - calendario semanal */
.cal-wrap{overflow-x:auto;}
.cal-grid{display:grid;grid-auto-rows:auto;border:1px solid var(--border);border-radius:8px;overflow:hidden;width:100%;font-size:10px;}
.cal-corner{grid-row:1;grid-column:1;border-bottom:1px solid var(--border);background:var(--bg2);min-width:0;}
.cal-daylabel{grid-row:1;padding:3px 1px;text-align:center;font-weight:700;font-size:9.5px;border-bottom:1px solid var(--border);border-left:1px solid var(--border2);background:var(--bg2);min-width:0;overflow:hidden;white-space:normal;word-break:break-word;line-height:1.15;}
.cal-hours{border-right:1px solid var(--border);min-width:0;}
.cal-hour{font-size:8.5px;color:var(--text2);padding:0 1px;border-top:1px solid var(--border2);box-sizing:border-box;overflow:hidden;white-space:nowrap;}
.cal-daycol{position:relative;border-left:1px solid var(--border2);box-sizing:border-box;min-width:0;overflow:hidden;}
.cal-hourline{border-top:1px solid var(--border2);box-sizing:border-box;}
.cal-event{position:absolute;left:1px;border-radius:3px;font-size:8.5px;font-weight:600;line-height:1.15;overflow:hidden;cursor:pointer;box-sizing:border-box;}
</style>
</head>
<body>

<div id="demoBar" class="hidden" style="position:fixed;top:0;left:0;right:0;z-index:150;background:#1c1730;color:#fff;display:flex;justify-content:center;align-items:center;gap:14px;padding:9px 14px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.25);">
  <span id="demoBarTxt">Modo demo</span>
  <button class="btn btn-primary btn-sm" style="background:#fff;color:#1c1730;" onclick="exitDemo()">Salir del modo demo</button>
</div>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-box" id="loginBox"></div>
</div>

<!-- ===================== QR GATE (socio escanea el QR del gimnasio) ===================== -->
<div id="qrGate" class="hidden">
  <div class="login-box" id="qrGateContent"></div>
</div>

<!-- ===================== STAFF GATE (profesor escanea el QR impreso) ===================== -->
<div id="staffGate" class="hidden">
  <div class="login-box" id="staffGateContent"></div>
</div>

<!-- ===================== SCAN ===================== -->
<div id="scan" class="hidden">
  <div class="scan-box">
    <div id="scanStep1">
      <div class="scan-spinner">⏳</div>
      <h2>Verificando código QR...</h2>
      <p style="color:#aaa;font-size:14px;">Por favor espera un momento</p>
    </div>
    <div id="scanStep2" class="hidden">
      <div class="scan-spinner">✅</div>
      <h2 id="scanName">Acceso registrado</h2>
      <p id="scanDetail" style="color:#aaa;font-size:14px;margin:8px 0 4px;"></p>
      <p id="scanTime" style="color:#fff;font-size:15px;font-weight:700;margin-bottom:20px;"></p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="closeScan()">Ir a la app</button>
    </div>
  </div>
</div>

<!-- ===================== STAFF (dueño/admin/profesor) ===================== -->
<div id="staff" class="hidden">
  <div class="sidebar-overlay" id="staffSidebarOverlay" onclick="toggleStaffSidebar(false)"></div>
  <div class="sidebar" id="staffSidebar"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="staffMenuBtn" onclick="toggleStaffSidebar()"><i class="ti ti-menu-2"></i></button>
        <div>
          <b id="staffTitle">Panel</b>
          <div class="role-tag" id="staffRoleTag"></div>
        </div>
      </div>
      <div style="display:flex;gap:16px;align-items:center;">
        <button class="bell" onclick="openBuscarSocioModal()" title="Buscar socio"><i class="ti ti-search"></i></button>
        <div class="notif-wrap">
          <button class="bell" onclick="toggleNotif('staff')">🔔<span class="dot hidden" id="staffNotifDot"></span></button>
          <div class="notif-panel hidden" id="staffNotifPanel"></div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="toggleDarkMode()" title="Modo oscuro" style="padding:7px 10px;" id="darkModeBtn"><i class="ti ti-moon" style="font-size:18px;"></i></button>
        <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="content" id="staffContent"></div>
  </div>
</div>

<!-- ===================== SOCIO ===================== -->
<div id="socio" class="hidden">
  <div class="socio-topbar">
    <img src="logo.png" alt="AFYS" class="socio-logo">
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="notif-wrap">
        <button class="bell" onclick="toggleNotif('socio')"><i class="ti ti-bell"></i><span class="dot hidden" id="socioNotifDot"></span></button>
        <div class="notif-panel hidden" id="socioNotifPanel" style="right:-10px;"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="toggleDarkMode()" title="Modo oscuro" id="darkModeBtnSocio" style="padding:7px 10px;"><i class="ti ti-moon" style="font-size:18px;"></i></button>
      <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="socio-content" id="socioContent"></div>
  <div class="bottom-nav">
    <div class="bn-item active" data-tab="inicio"><i class="ti ti-home"></i>Inicio</div>
    <div class="bn-item" data-tab="clases"><i class="ti ti-calendar"></i>Clases</div>
    <div class="bn-item" data-tab="rutina"><i class="ti ti-barbell"></i>Rutina</div>
    <div class="bn-item" data-tab="cuenta"><i class="ti ti-user"></i>Cuenta</div>
  </div>
</div>

<!-- ===================== MODAL HOST ===================== -->
<div id="modalHost"></div>

function normName(n){ return (n||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' '); }
function mergeDupSocio(keepIdx, dupIdx, toRemove){
  const keep = SOCIOS[keepIdx], dup = SOCIOS[dupIdx];
  if(!keep||!dup) return;
  if(!keep.email && dup.email) keep.email = dup.email;
  if(!keep.tel && dup.tel) keep.tel = dup.tel;
  if(!keep.cumple && dup.cumple) keep.cumple = dup.cumple;
  if(!keep.pe && dup.pe) keep.pe = dup.pe;
  if(!keep.ob && dup.ob) keep.ob = dup.ob;
  if(!keep.obs && dup.obs) keep.obs = dup.obs;
  if((!keep.nt || !keep.nt.length) && dup.nt) keep.nt = dup.nt;

  if(!keep.vence && dup.vence) keep.vence = dup.vence;
  // merge rs: additive union, respetando rsRemoved de ambos
  if(!Array.isArray(keep.rs)) keep.rs = [];
  if(Array.isArray(dup.rs)) dup.rs.forEach(r=>{ if(!keep.rs.includes(r)) keep.rs.push(r); });
  // merge rsRemoved: union de tombstones
  if(Array.isArray(dup.rsRemoved) && dup.rsRemoved.length){
    if(!Array.isArray(keep.rsRemoved)) keep.rsRemoved = [];
    dup.rsRemoved.forEach(r=>{ if(!keep.rsRemoved.includes(r)) keep.rsRemoved.push(r); });
  }
  // aplicar tombstone combinado a keep.rs
  if(Array.isArray(keep.rsRemoved) && keep.rsRemoved.length){
    const rmSet = new Set(keep.rsRemoved);
    keep.rs = keep.rs.filter(r=>!rmSet.has(r));
  }
  if(dup.rsHechos){ if(!keep.rsHechos) keep.rsHechos={}; mergeRsHechos(keep.rsHechos, dup.rsHechos); }
  PAGOS.forEach(p=>{ if(p.sid===dup.id) p.sid = keep.id; });
  REGS.forEach(r=>{ if(r.sid===dup.id) r.sid = keep.id; });
  Object.keys(SOCIOS_LOGIN).forEach(em=>{ if(SOCIOS_LOGIN[em].idx===dupIdx) SOCIOS_LOGIN[em] = {idx:keepIdx, pe:SOCIOS_LOGIN[em].pe, pm:SOCIOS_LOGIN[em].pm}; });
  if(notifSocio[dupIdx] && notifSocio[dupIdx].length){ if(!notifSocio[keepIdx]) notifSocio[keepIdx]=[]; notifSocio[keepIdx].push(...notifSocio[dupIdx]); delete notifSocio[dupIdx]; }
  toRemove.add(dupIdx);
}
function migrateDedupSocios(){
  const score = s=>((s.email)?2:0)+((s.rs&&s.rs.length)?1:0)+((s.tel)?1:0)+((s.cumple)?1:0);
  const emailMap = {};
  const nameMap = {};
  const toRemove = new Set();
  SOCIOS.forEach((s, idx)=>{
    const emailKey = (s.email||'').trim().toLowerCase();
    if(emailKey){
      if(emailMap[emailKey]===undefined){ emailMap[emailKey] = idx; }
      else{
        const keepIdx = score(s)>score(SOCIOS[emailMap[emailKey]]) ? idx : emailMap[emailKey];
        const dupIdx = keepIdx===idx ? emailMap[emailKey] : idx;
        emailMap[emailKey] = keepIdx;
        mergeDupSocio(keepIdx, dupIdx, toRemove);
        return;
      }
    }
    const nameKey = normName(s.n);
    if(!nameKey) return;
    if(nameMap[nameKey]===undefined){ nameMap[nameKey] = idx; return; }
    const existingIdx = nameMap[nameKey];
    const keepIdx = score(s)>score(SOCIOS[existingIdx]) ? idx : existingIdx;
    const dupIdx = keepIdx===idx ? existingIdx : idx;
    nameMap[nameKey] = keepIdx;
    mergeDupSocio(keepIdx, dupIdx, toRemove);
  });
  if(!toRemove.size) return;
  const kept = SOCIOS.filter((_,i)=>!toRemove.has(i));
  const idxMap = {};
  let ki = 0;
  SOCIOS.forEach((s,oldIdx)=>{ if(!toRemove.has(oldIdx)){ idxMap[oldIdx]=ki; ki++; } });
  SOCIOS.length = 0; kept.forEach(s=>SOCIOS.push(s));
  Object.keys(SOCIOS_LOGIN).forEach(em=>{ const info = SOCIOS_LOGIN[em]; if(idxMap[info.idx]!==undefined) info.idx = idxMap[info.idx]; else delete SOCIOS_LOGIN[em]; });
  Object.keys(notifSocio).forEach(k=>{ const nk = idxMap[Number(k)]; if(nk!==undefined && nk!==Number(k)){ notifSocio[nk]=notifSocio[k]; delete notifSocio[k]; } else if(nk===undefined) delete notifSocio[k]; });
  Object.keys(RESERVAS).forEach(k=>{ const nk = idxMap[Number(k)]; if(nk!==undefined && nk!==Number(k)){ RESERVAS[nk]=RESERVAS[k]; delete RESERVAS[k]; } else if(nk===undefined) delete RESERVAS[k]; });
  persistDirect();
}
function migrateDedupRegs(){
  const seen = new Set();
  const before = REGS.length;
  const deduped = REGS.filter(r=>{
    const key = (r.sid||r.i||r.n) + '|' + (r.f ? localDateISO(r.f) : r.h||'') + '|' + (r.cl||'');
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  if(deduped.length === before) return;
  REGS.length = 0;
  deduped.forEach(r=>REGS.push(r));
  persistDirect();
}

function socioMergeKey(s){ return s.id || (s.email||'').trim().toLowerCase() || s.n; }
function mergeRsHechos(local, remote){
  if(!remote) return;
  Object.keys(remote).forEach(rname=>{
    if(!local[rname]) local[rname] = {};
    Object.keys(remote[rname]).forEach(ejName=>{
      local[rname][ejName] = remote[rname][ejName]; // last-write-wins: remote may be newer
    });
  });
}

function mergeRsHechosAdditivo(local, remote){
  if(!remote) return;
  Object.keys(remote).forEach(rname=>{
    if(!local[rname]) local[rname] = {};
    Object.keys(remote[rname]).forEach(ejName=>{
      // undefined = nunca visto → tomar remoto
      // null = explícitamente desmarcado → respetar (no restaurar)
      if(local[rname][ejName] === undefined) local[rname][ejName] = remote[rname][ejName];
    });
  });
}

        if(!RESERVAS[ki]) RESERVAS[ki]={};
        Object.keys(remote.RESERVAS[k]).forEach(claseK=>{
          if(remote.RESERVAS[k][claseK]===true&&RESERVAS[ki][claseK]===undefined) RESERVAS[ki][claseK]=true;
          if(remote.RESERVAS[k][claseK]===false&&RESERVAS[ki][claseK]===true) RESERVAS[ki][claseK]=false;
        });
      });
    }

    if(Array.isArray(remote.REGS)){
      const _regKey = r => r.sid+'|'+(r.f?localDateISO(r.f):r.f);
      const localKeys = new Set(REGS.map(_regKey));
      remote.REGS.forEach(r=>{
        const key = _regKey(r);
        if(!localKeys.has(key)){ REGS.push(r); localKeys.add(key); }
      });
      REGS.sort((a,b)=>new Date(b.f)-new Date(a.f));
      entradasHoy = REGS.filter(r=>r.f && localDateISO(r.f)===todayISO()).length;
    }

    if(Array.isArray(remote.PAGOS)){
      const delPK = new Set(deletedPagoKeys);
      const localKeys = new Set(PAGOS.map(p=>p.sid+'|'+p.f+'|'+p.m+'|'+p.mp));
      remote.PAGOS.forEach(p=>{
        const key = p.sid+'|'+p.f+'|'+p.m+'|'+p.mp;
        if(!delPK.has(key) && !localKeys.has(key)){ PAGOS.push(p); localKeys.add(key); }
      });
      PAGOS.sort((a,b)=>new Date(b.f)-new Date(a.f));
    }

    if(Array.isArray(remote.PENDING_INVITES)){
      const localTokens = new Set(PENDING_INVITES.map(i=>i.token));
      remote.PENDING_INVITES.forEach(i=>{
        if(!localTokens.has(i.token)){ PENDING_INVITES.push(i); localTokens.add(i.token); }
      });
    }

    if(Array.isArray(remote.movimientosLog)){
      const localFechas = new Set(movimientosLog.map(m=>m.fecha));
      const nuevos = remote.movimientosLog.filter(m=>!localFechas.has(m.fecha));
      if(nuevos.length){
        movimientosLog.push(...nuevos);
        movimientosLog.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
        if(movimientosLog.length>1000) movimientosLog.length = 1000;
      }
    }

    if(Array.isArray(remote.notifStaff)){
      const localTxts = new Set(notifStaff.map(n=>n.txt));
      remote.notifStaff.forEach(n=>{
        if(!localTxts.has(n.txt)){ notifStaff.unshift(n); localTxts.add(n.txt); }
      });
    }

    if(Array.isArray(remote.DUENOS)){
      const localEmails = new Set(DUENOS.map(d=>d.email));
      remote.DUENOS.forEach(d=>{ if(d.email && !localEmails.has(d.email)){ DUENOS.push(d); localEmails.add(d.email); } });
    }

    if(Array.isArray(remote.TURNOS)){
      const delT = new Set(deletedTurnoIds);
      const localById = {};
      TURNOS.forEach(t=>{ localById[t.id]=t; });
      remote.TURNOS.forEach(t=>{
        if(!t.id || delT.has(t.id)) return;
        if(localById[t.id]){ if(!_editingTurnoId || _editingTurnoId!==t.id) Object.assign(localById[t.id], t); }
        else { TURNOS.push(t); localById[t.id]=t; }
      });
      // aplicar eliminaciones remotas
      if(Array.isArray(remote.deletedTurnoIds)){
        remote.deletedTurnoIds.forEach(id=>{ if(!deletedTurnoIds.includes(id)) deletedTurnoIds.push(id); });
        TURNOS = TURNOS.filter(t=>!new Set(deletedTurnoIds).has(t.id));
      }
    }

    // RUTINAS: sync aditivo con actualización de existentes y respeto de eliminadas
    if(Array.isArray(remote.RUTINAS)){
      const delR = new Set(deletedRutinaNames);
      if(Array.isArray(remote.deletedRutinaNames)){
        remote.deletedRutinaNames.forEach(n=>{ if(!deletedRutinaNames.includes(n)) deletedRutinaNames.push(n); delR.add(n); });
        RUTINAS.splice(0, RUTINAS.length, ...RUTINAS.filter(r=>!delR.has(r.n)));
      }
      const localByName = {};
      RUTINAS.forEach(r=>{ localByName[r.n]=r; });
      remote.RUTINAS.forEach(r=>{
        if(!r.n || delR.has(r.n)) return;
        if(localByName[r.n]){
          if(!_editingRutinaName || _editingRutinaName!==r.n){
            if((r.ts||0) >= (localByName[r.n].ts||0)) Object.assign(localByName[r.n], r);
          }
        } else { RUTINAS.push(r); localByName[r.n]=r; }
      });
    }

    // sync deletedPagoKeys remotos
    if(Array.isArray(remote.deletedPagoKeys)){
      remote.deletedPagoKeys.forEach(k=>{ if(!deletedPagoKeys.includes(k)) deletedPagoKeys.push(k); });
      const delPK = new Set(deletedPagoKeys);
      PAGOS.splice(0, PAGOS.length, ...PAGOS.filter(p=>{ const k=p.sid+'|'+p.f+'|'+p.m+'|'+p.mp; return !delPK.has(k); }));
    }

    if(Array.isArray(remote.STAFF)){
      const localById = {};
      STAFF.forEach(s=>{ if(s.id) localById[s.id]=s; });
      remote.STAFF.forEach(s=>{
        if(!s.id) return;
        if(!localById[s.id]){ STAFF.push(s); localById[s.id]=s; }
        // no pisar el staff que el usuario está editando ahora mismo (si hay modal abierto)
        else if(!document.querySelector('.modal-overlay')){ Object.assign(localById[s.id], s); }
      });
    }

    if(remote.EJD && typeof remote.EJD==='object'){
      Object.keys(remote.EJD).forEach(g=>{
        if(!EJD[g]) EJD[g] = [];
        const local = new Set(EJD[g]);
        (remote.EJD[g]||[]).forEach(e=>{ if(!local.has(e)){ EJD[g].push(e); local.add(e); } });
      });
    }

    if(remote.EJC && typeof remote.EJC==='object'){
      Object.keys(remote.EJC).forEach(g=>{ if(!EJC[g]) EJC[g] = remote.EJC[g]; });
    }

    if(typeof remote.turnoSeq==='number' && remote.turnoSeq > turnoSeq) turnoSeq = remote.turnoSeq;
    if(typeof remote.socioSeq==='number' && remote.socioSeq > socioSeq) socioSeq = remote.socioSeq;
    if(typeof remote.eliteSeq==='number' && remote.eliteSeq > eliteSeq) eliteSeq = remote.eliteSeq;
    mergeEliteRemote(remote.ELITE_DEPORTISTAS, remote.deletedEliteIds);

    if(Array.isArray(remote.CLASES_HOY)){
      if(Array.isArray(remote.deletedClaseIds)){
        remote.deletedClaseIds.forEach(id=>{ if(!deletedClaseIds.includes(id)) deletedClaseIds.push(id); });
        const delC=new Set(deletedClaseIds);
        for(let i=CLASES_HOY.length-1;i>=0;i--){ if(CLASES_HOY[i].cId && delC.has(CLASES_HOY[i].cId)) CLASES_HOY.splice(i,1); }
      }
      const delC=new Set(deletedClaseIds);
      const modalOpen = !!document.querySelector('.modal-overlay');
      const localByClaseId = {};
      CLASES_HOY.forEach(c=>{ if(c.cId) localByClaseId[c.cId]=c; });
      remote.CLASES_HOY.forEach(c=>{
        if(!c.cId || delC.has(c.cId)) return;
        if(localByClaseId[c.cId]){ if(!modalOpen) Object.assign(localByClaseId[c.cId], c); }
        else { CLASES_HOY.push(c); localByClaseId[c.cId]=c; }
      });
    }

    if(remote.notifSocio){
      const _nRemIdxToLocal={};
      if(Array.isArray(remote.SOCIOS)) remote.SOCIOS.forEach((rs,ri)=>{ const li=SOCIOS.findIndex(s=>socioMergeKey(s)===socioMergeKey(rs)); if(li>=0) _nRemIdxToLocal[ri]=li; });
      Object.keys(remote.notifSocio).forEach(remIdx=>{
        if(_nRemIdxToLocal[Number(remIdx)]===undefined) return;
        const localIdx = _nRemIdxToLocal[Number(remIdx)];
        if(!notifSocio[localIdx]) notifSocio[localIdx] = [];
        const localTxts = new Set(notifSocio[localIdx].map(n=>n.txt));
        (remote.notifSocio[remIdx]||[]).forEach(n=>{
          if(!localTxts.has(n.txt)){ notifSocio[localIdx].unshift(n); localTxts.add(n.txt); }
        });
      });
    }
  }catch(e){
    console.error('Error sincronizando antes de guardar:', e);
  } finally {
    _merging = false;
  }
}
function persistDirect(){
  if(demoMode) return;
  clearTimeout(persistTimer);
  const ts = new Date().toISOString();
  _lastOwnWrite = Date.now(); _lastOwnWriteTs = ts;
  sb.from('app_state').upsert({id:1, data: snapshotState(), updated_at: ts}).then(({error})=>{
    if(error) console.error('Error guardando en Supabase:', error);
    else _lastRemoteTs = ts;
  });
}
function persist(){
  if(demoMode) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(async ()=>{
    await mergeRemoteAntesDeGuardar();
    const ts = new Date().toISOString();
    _lastOwnWrite = Date.now(); _lastOwnWriteTs = ts;
    sb.from('app_state').upsert({id:1, data: snapshotState(), updated_at: ts}).then(({error})=>{
      if(error){
        console.error('Error guardando en Supabase:', error);
        showToast('No se pudo guardar. Revisá tu conexión a internet.', 'error');
      } else { _lastRemoteTs = ts; }
    });
  }, 500);
}

async function loadState(){
  try{
    const {data, error} = await sb.from('app_state').select('data, updated_at').eq('id',1).single();
    if(error){ console.error('Error cargando de Supabase:', error); throw error; }
    if(data && data.data){
      applyState(data.data);
      _lastRemoteTs = data.updated_at || '';
    }
  }catch(e){
    console.error('Error cargando de Supabase:', e);
    throw e;
  }
}

function downloadCSV(filename, headers, csvRows){
  const csvEsc = v => '"'+(v==null?'':String(v).replace(/"/g,'""'))+'"';
  const csv = [headers.map(csvEsc).join(','), ...csvRows.map(r=>r.map(csvEsc).join(','))].join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿'+encodeURIComponent(csv);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

    .replace(/\\/g,'\\\\').replace(/'/g,"\\'")

// Selector de hora en formato 24hs (00-23), reemplaza al <input type="time"> nativo
// que en algunos celulares muestra AM/PM segun la configuracion regional del equipo.
function timeSelectHTML(id, value, onchange, small){
  const [h,m] = (value||'08:00').split(':');

  return `<div style="display:flex;gap:${small?'2px':'4px'};align-items:center;">

    <span>:</span>
    <select id="${id}_m" style="${selSt}"${oc}>${mins.map(mm=>`<option value="${mm}" ${mm===m?'selected':''}>${mm}</option>`).join('')}</select>

const PLAN_DAYS = {};
function addDaysISO(dateStr, days){
  const d = dateStr ? new Date(dateStr) : new Date();
  if(isNaN(d)) return null;
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function fmtFechaCorta(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d)) return '-';
  return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
}
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function localDateISO(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function recalcEstados(opts){
  const notify = opts && opts.notify;
  let changed = false;
  const today = new Date(); today.setHours(0,0,0,0);
  SOCIOS.forEach(s=>{
    if(s.activo===false){ if(s.es !== 'de') { s.es='de'; changed=true; } return; }
    if(!s.vence) return;
    const v = new Date(s.vence);
    if(isNaN(v)) return;
    v.setHours(0,0,0,0);
    const diffDias = Math.round((v-today)/86400000);
    const prev = s.es;
    const next = diffDias<=0 ? 'de' : (diffDias<=5 ? 've' : 'ok'); // vence el día 10: diffDias=0 → vencido
    if(next!==prev){
      s.es = next;
      changed = true;
      if(notify){
        if(next==='de') notifStaff.unshift({txt:`El pago de ${s.n} venció.`, new:true});
        else if(next==='ve') notifStaff.unshift({txt:`El pago de ${s.n} vence en ${diffDias} día(s).`, new:true});
      }
    }
  });
  if(changed && !_merging) persist();
}
function initials(name){return (name||'').split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';}
function pagoBelongsTo(p,s){ return p.sid ? p.sid===s.id : p.n===s.n; }
function regBelongsTo(r,s){ return r.sid ? r.sid===s.id : r.i===s.i; }

async function submitForgotPassword(){
  const email = $('#fp_e').value.trim().toLowerCase();
  if(!email){ loginError='Ingresá tu email.'; loginInfo=''; renderLogin(); return; }
  loginError=''; loginInfo='Enviando...'; renderLogin();
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: APP_URL});
  if(error){
    const msg = error.message||'';
    if(/rate.limit|too.many/i.test(msg))
      loginError='Se enviaron demasiados emails seguidos. Esperá unos minutos y volvé a intentar.';
    else if(/invalid.email|unable.to.validate/i.test(msg))
      loginError='El email ingresado no es válido.';
    else if(/not.found|user.not.found/i.test(msg))
      loginError='No encontramos ninguna cuenta con ese email.';
    else
      loginError='No se pudo enviar el email. Revisá que la dirección sea correcta o contactá al gimnasio.';
    loginInfo=''; renderLogin(); return;
  }
  loginInfo='¡Listo! Te mandamos un email con el link para cambiar tu contraseña. Revisá también la carpeta de spam si no aparece en unos minutos.';
  loginError=''; renderLogin();
}

async function doLoginDni(){
  const dni = String($('#loginDni').value).trim();
  if(!dni){ loginError='Ingresá tu DNI.'; renderLogin(); return; }
  let email = dniCache[dni];
  if(!email){
    // Caché local vacío — intentar buscar el email en Supabase directamente
    loginError=''; loginInfo='Buscando...'; renderLogin();
    try {
      const {data: remoteData} = await sb.from('app_state').select('data').eq('id',1).single();
      if(remoteData && remoteData.data && Array.isArray(remoteData.data.SOCIOS)){
        const found = remoteData.data.SOCIOS.find(s => String(s.dni)===dni && s.dniAccesoRapido && s.email);
        if(found){
          email = (found.email||'').toLowerCase();
          cacheDni(dni, email);
          // Poblar caché para todos mientras estamos acá
          remoteData.data.SOCIOS.forEach(s=>{ if(s.dni && s.dniAccesoRapido && s.email) cacheDni(String(s.dni),(s.email||'').toLowerCase()); });
        }
      }
    } catch(e){ /* si no hay acceso anónimo, ignorar y seguir */ }
    loginInfo='';
    if(!email){
      loginView='loginDniFirstTime'; loginError=''; renderLogin(); return;
    }
  }
  // Bloquear login por DNI para dueños y staff
  const isStaffOrOwner = (DUENO_EMAIL && email===DUENO_EMAIL) || CO_DUENOS.includes(email) || !!STAFF.find(s=>(s.email||'').toLowerCase()===email) || !!DUENOS.find(d=>(d.email||'').toLowerCase()===email);
  if(isStaffOrOwner){
    loginView='login'; loginError='El acceso por DNI es solo para socios. Iniciá sesión con tu email y contraseña.'; renderLogin(); return;
  }
  const {error} = await sb.auth.signInWithPassword({email, password: dni});
  if(error){
    // El DNI está en el caché pero la contraseña no coincide (ej: la cuenta
    // es vieja y nunca se actualizó la contraseña al DNI). Ir a email+pass.
    loginView='loginDniFirstTime';
    loginError='Ingresá tu email y contraseña para continuar.';
    renderLogin(); return;
  }
  loginError=''; loginInfo='';
  cacheDni(dni, email);
  await routeLoggedInUser(email);
}

async function routeLoggedInUser(email){
  $('#login').classList.add('hidden');
  if((DUENO_EMAIL && email===DUENO_EMAIL) || CO_DUENOS.includes(email)){
    currentRole='dueno'; currentStaffId=null;
    // ensure dueño entry in DUENOS
    const uMeta = (await sb.auth.getUser())?.data?.user?.user_metadata || {};
    const nombreDueno = uMeta.nombre || uMeta.name || email.split('@')[0];
    if(!DUENOS.find(d=>d.email===email)){
      DUENOS.push({id:'dueno_'+email.replace(/[^a-z0-9]/gi,'_'), n: nombreDueno, email, color:''});
      persist();
    }
    enterStaff();
    return;
  }
  const st = STAFF.find(s=>s.email===email);
  if(st){
    currentRole = st.role; currentStaffId = st.id;
    enterStaff();
    return;
  }
  const emailLow = email.toLowerCase();
  const info = lookupSocioLogin(email);
  if(info && Number.isInteger(info.idx) && SOCIOS[info.idx] && (SOCIOS[info.idx].email||'').toLowerCase()===emailLow){
    currentRole='socio'; currentSocioIdx=info.idx; _dniPopupShown=false;
    // auto-cachear DNI si el dueño ya lo cargó en el perfil
    const sp = SOCIOS[info.idx];
    if(sp.dni && sp.dniAccesoRapido) cacheDni(sp.dni, emailLow);
    showWelcomeBanner = true;
    $('#socio').classList.remove('hidden');
    socioPage='inicio'; renderSocio();
    return;
  }
  const idxRecuperado = await intentarRecuperarPerfilSocio(email);
  if(idxRecuperado!==null){
    currentRole='socio'; currentSocioIdx=idxRecuperado; _dniPopupShown=false;
    showWelcomeBanner = true;
    $('#socio').classList.remove('hidden');
    socioPage='inicio'; renderSocio();
    showToast('Recuperamos tu perfil. ¡Bienvenido/a de nuevo!');
    return;
  }
  await sb.auth.signOut();
  loginError='No encontramos tu perfil en este gimnasio. Contactá al dueño.';
  $('#login').classList.remove('hidden');
  renderLogin();
}

function recrearPerfilSocioPerdido(email, nombre){
  const emailLower = (email||'').trim().toLowerCase();
  const existente = SOCIOS.findIndex(s=>(s.email||'').trim().toLowerCase()===emailLower);
  if(existente!==-1){
    // Normalizar siempre con lowercase para que lookupSocioLogin lo encuentre fácil
    SOCIOS_LOGIN[emailLower] = {idx:existente, pe:SOCIOS[existente].es||'ok', pm:'Sin plan asignado todavía'};
    notifSocio[existente] = notifSocio[existente]||[];
    persist();
    return existente;
  }
  const initialsV = (nombre||email).trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const idx = SOCIOS.length;
  SOCIOS.push({id:'soc'+Date.now()+'_'+(socioSeq++)+'_'+Math.random().toString(36).slice(2,6), i:initialsV, n:nombre||email, email:emailLower, tel:'', cumple:null, es:'ok', vence:null, rs:[], nt:[], ed:null, pe:null, ob:null, hoy:false, entradaHora:null, activo:true, altaPendiente:true});
  SOCIOS_LOGIN[emailLower] = {idx, pe:'ok', pm:'Sin plan asignado todavía'};
  notifSocio[idx]=[];
  notifStaff.unshift({txt:`Se recuperó automáticamente el perfil de ${nombre||email} (${email}), que se había perdido. Revisá y completá sus datos.`, new:true, altaIdx:idx});
  logMovimiento('alta_socio', `Perfil de socio recuperado automáticamente: ${nombre||email} (${email})`);
  persist();
  return idx;
}

async function intentarRecuperarPerfilSocio(email){
  try{
    const emailLow = (email||'').toLowerCase();
    // 1. Buscar por email en SOCIOS (la forma más directa, no depende de metadata)
    const idxDirecto = SOCIOS.findIndex(s=>(s.email||'').toLowerCase()===emailLow);
    if(idxDirecto !== -1) return recrearPerfilSocioPerdido(email, SOCIOS[idxDirecto].n);
    // 2. Si no está en SOCIOS, revisar metadata de Supabase para ver si es un socio
    //    nuevo que nunca fue añadido manualmente (ej: se registró vía QR en otro dispositivo)
    const {data} = await sb.auth.getUser();
    const meta = data && data.user && data.user.user_metadata;
    if(!meta || meta.role !== 'socio') return null;
    return recrearPerfilSocioPerdido(email, meta.nombre || meta.name);
  }catch(e){
    console.error('Error intentando recuperar perfil de socio:', e);
    return null;
  }
}

async function submitSignupDueno(){
  const n = $('#sd_n').value.trim();
  const e = $('#sd_e').value.trim().toLowerCase();
  const p = $('#sd_p').value;
  if(!n||!e||p.length<6){ loginError='Completá nombre, email y una contraseña de al menos 6 caracteres.'; renderLogin(); return; }
  if(DUENO_EMAIL){ loginError='Ya existe una cuenta de dueño.'; renderLogin(); return; }
  const {error} = await sb.auth.signUp({email:e, password:p, options:{data:{nombre:n, role:'dueno'}, emailRedirectTo:APP_URL}});
  if(error){
    // Si la cuenta ya existe, intentar iniciar sesión directamente y reclamar el rol
    const alreadyExists = error.message && (error.message.toLowerCase().includes('already') || error.message.toLowerCase().includes('registered') || error.status===422 || error.status===400);
    if(alreadyExists){
      const {error:loginErr} = await sb.auth.signInWithPassword({email:e, password:p});
      if(loginErr){ loginError='Cuenta existente pero contraseña incorrecta.'; renderLogin(); return; }
      DUENO_EMAIL = e;
      if(!DUENOS.find(d=>d.email===e)) DUENOS.push({id:'dueno_'+e.replace(/[^a-z0-9]/gi,'_'), n, email:e, color:''});
      persist();
      loginView='login'; loginError='';
      await routeLoggedInUser(e);
      return;
    }
    loginError=sbErr(error); renderLogin(); return;
  }
  DUENO_EMAIL = e;
  if(!DUENOS.find(d=>d.email===e)) DUENOS.push({id:'dueno_'+e.replace(/[^a-z0-9]/gi,'_'), n, email:e, color:''});
  persist();
  loginView='login'; loginError='';
  await routeLoggedInUser(e);
}

async function submitSignupSocio(){
  const n = $('#su_n').value.trim();
  const e = $('#su_e').value.trim().toLowerCase();
  const dni = String($('#su_dni').value).trim();
  const t = $('#su_t').value.trim();
  const cumple = $('#su_cumple').value || null;
  const pe = parseInt($('#su_pe').value)||null;
  const ob = $('#su_ob').value.trim()||null;
  if(!n||!e||!dni||isNaN(Number(dni))||dni.length<6){ loginError='Completá nombre, email y un DNI válido (mínimo 6 dígitos).'; renderLogin(); return; }
  cleanOrphanSocioLogin(e);
  if(lookupSocioLogin(e)){ loginError='Ya existe una cuenta con ese email.'; renderLogin(); return; }
  let {data, error} = await sb.auth.signUp({email:e, password:dni, options:{data:{nombre:n, role:'socio', dni}, emailRedirectTo:APP_URL}});
  if(!error && data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
    error = {message:'already registered'};
  }
  if(error){
    if(/already.*(registered|exists)|user_already_exists/i.test(error.message)){
      const {error:loginErr} = await sb.auth.signInWithPassword({email:e, password:dni});
      if(loginErr){ loginError='Ese email ya tiene una cuenta. Si no recordás tu DNI, contactá al gimnasio.'; renderLogin(); return; }
    } else { loginError=sbErr(error); renderLogin(); return; }
  }
  const initialsV = n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const idx = SOCIOS.length;
  const ed = cumple ? calcAge(cumple) : null;
  SOCIOS.push({id:'soc'+Date.now()+'_'+(socioSeq++)+'_'+Math.random().toString(36).slice(2,6), i:initialsV, n, email:e, dni, tel:t, cumple, es:'de', vence:null, rs:[], nt:[], ed, pe, ob, hoy:false, entradaHora:null, activo:true, altaPendiente:true, dniAccesoRapido:!!dni});
  SOCIOS_LOGIN[e] = {idx, pe:'de', pm:'Sin plan asignado todavía'};
  notifSocio[idx]=[];
  notifStaff.unshift({txt:`${n} se registró desde la app. ¿Ya era socio antes de usar la app?`, new:true, altaIdx:idx});
  cacheDni(dni, e);
  persist();
  loginView='login'; loginError='';
  await routeLoggedInUser(e);
}

const QR_DEVICE_KEY = 'gymQrSocioEmail';

async function openQRGate(){
  $('#login').classList.add('hidden');
  $('#qrGate').classList.remove('hidden');
  const savedEmail = localStorage.getItem(QR_DEVICE_KEY);
  const savedInfo = savedEmail ? lookupSocioLogin(savedEmail) : null;
  if(savedEmail && savedInfo && Number.isInteger(savedInfo.idx) && SOCIOS[savedInfo.idx]){
    // Sesión activa en este dispositivo → entrar directo sin pedir nada
    try{
      const {data:{session}} = await sb.auth.getSession();
      if(session && session.user && session.user.email.toLowerCase()===savedEmail.toLowerCase()){
        currentRole='socio'; _dniPopupShown=false;
        currentSocioIdx=savedInfo.idx;
        pendingQR=pendingQR||{tipo:'general'};
        $('#qrGate').classList.add('hidden');
        startScan(); return;
      }
    }catch(e){}
    // Sin sesión: si tiene DNI pedir DNI, si no tiene mostrar login con DNI+fallback
    const socioTieneDni = SOCIOS[savedInfo.idx] && SOCIOS[savedInfo.idx].dni;
    if(socioTieneDni){
      renderQRGateLoginDni(savedEmail);
    } else {
      renderQRGateLoginDni(null); // pantalla de login sin usuario recordado
    }
  } else {
    renderQRGateLanding();
  }
}

async function qrGateCreateSocio(){
  const n = $('#qrg_n').value.trim();
  const e = $('#qrg_e').value.trim().toLowerCase();
  const dni = String($('#qrg_dni').value).trim();
  const t = $('#qrg_t').value.trim();

  const pe = parseInt($('#qrg_pe').value)||null;
  const ob = $('#qrg_ob').value.trim()||null;
  const obs = $('#qrg_obs').value.trim()||null;
  if(!n||!e||!dni||isNaN(Number(dni))||dni.length<6){ renderQRGateCreateAccount('Completá nombre, email y un DNI válido (mínimo 6 dígitos).'); return; }
  cleanOrphanSocioLogin(e);
  if(lookupSocioLogin(e)){ renderQRGateCreateAccount('Ya existe una cuenta con ese email. Usá "Iniciar sesión".'); return; }
  const btn=$('#qrg_create_btn'); btn.disabled=true; btn.textContent='Creando cuenta...';
  let {data,error}=await sb.auth.signUp({email:e,password:dni,options:{data:{nombre:n,role:'socio',dni},emailRedirectTo:APP_URL}});
  if(!error&&data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0) error={message:'already registered'};
  if(error){
    if(/already.*(registered|exists)|user_already_exists/i.test(error.message)){
      const {error:le}=await sb.auth.signInWithPassword({email:e,password:dni});
      if(le){ renderQRGateCreateAccount('Ese email ya tiene cuenta. Si no recordás tu DNI, usá "Iniciar sesión" → "Ingresar con email y contraseña".'); return; }

  const initialsV=n.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const idx=SOCIOS.length;
  const ed=cumple?calcAge(cumple):null;
  SOCIOS.push({id:'soc'+Date.now()+'_'+(socioSeq++)+'_'+Math.random().toString(36).slice(2,6),i:initialsV,n,email:e,dni,tel:t,cumple,es:'ok',vence:null,rs:[],nt:[],ed,pe,ob,obs,hoy:false,entradaHora:null,activo:true,altaPendiente:true,dniAccesoRapido:!!dni});

  const _resolvedIdx = SOCIOS.findIndex(s=>(s.email||'').toLowerCase()===e);

  pendingQR=pendingQR||{tipo:'general'};

async function qrGateLoginAndCheckIn(savedEmail){
  const dni=String($('#qrg_login_dni').value).trim();
  if(!dni){ $('#qrLoginError').textContent='Ingresá tu DNI.'; return; }

  // Buscar email: si hay uno guardado usarlo, si no buscar en el caché de DNI
  let email = (savedEmail && savedEmail.trim()) ? savedEmail.trim() : dniCache[dni];
  if(!email || !email.includes('@')){
    // No conocemos el email → pedir email+contraseña
    renderQRGateLoginForm('No encontramos tu cuenta con ese DNI. Ingresá con email y contraseña.');
    return;
  }

  const {error}=await sb.auth.signInWithPassword({email,password:dni});
  if(error){
    $('#qrLoginError').innerHTML='DNI incorrecto. <a href="#" style="color:var(--primary);" onclick="renderQRGateLoginForm();return false;">Ingresá con email y contraseña</a>';
    return;
  }
  cacheDni(dni,email);
  let info=lookupSocioLogin(email);
  if(!info||!Number.isInteger(info.idx)||!SOCIOS[info.idx]||(SOCIOS[info.idx].email||'').toLowerCase()!==email){
    const idxR=await intentarRecuperarPerfilSocio(email);
    if(idxR===null){ await sb.auth.signOut(); renderQRGateLoginForm('No encontramos tu perfil. Contactá al gimnasio.'); return; }
    info={idx:idxR};
    if(SOCIOS_LOGIN[email]) SOCIOS_LOGIN[email].idx=idxR;
  }
  currentRole='socio'; _dniPopupShown=false; currentSocioIdx=info.idx;
  pendingQR=pendingQR||{tipo:'general'};
  localStorage.setItem(QR_DEVICE_KEY,email);
  $('#qrGate').classList.add('hidden');
  startScan();
}

/* ============ QR SCAN FLOW ============ */
function startScan(){
  $('#scan').classList.remove('hidden');
  $('#scanStep1').classList.remove('hidden');
  $('#scanStep2').classList.add('hidden');
  setTimeout(()=>finishScan(), 1800);
}

function finishScan(){
  const t = pendingQR || {tipo:'general'};
  const hora = nowTime();
  let socio;
  if(currentRole==='socio'){
    socio = SOCIOS[currentSocioIdx];
    // Guard against stale idx after a background merge
    if(!socio){ console.warn('finishScan: socio not found at idx', currentSocioIdx); $('#scanStep2').classList.remove('hidden'); $('#scanStep1').classList.add('hidden'); $('#scanName').textContent='Error'; $('#scanDetail').textContent='Perfil no encontrado. Cerrá sesión y volvé a entrar.'; $('#scanTime').textContent=''; return; }
  } else {
    // staff simulating: pick a random socio that hasn't entered, fallback first
    socio = SOCIOS.find(s=>!s.hoy) || SOCIOS[0];
  }
  const yaEntroHoy = REGS.some(r=>r.sid===socio.id && r.f && localDateISO(r.f)===todayISO() && (r.cl||null)===(t.clase||null));
  if(yaEntroHoy){
    $('#scanStep1').classList.add('hidden');
    $('#scanStep2').classList.remove('hidden');
    $('#scanName').textContent = `✅ ${socio.n}`;
    $('#scanDetail').textContent = t.clase ? `Clase: ${t.clase}` : 'Entrada general';
    $('#scanTime').textContent = `Ya registrada hoy`;
    return;
  }
  socio.hoy = true;
  socio.entradaHora = hora;
  entradasHoy++;
  REGS.unshift({sid:socio.id, i:socio.i, n:socio.n, h:hora, cl:t.clase||null, f:new Date().toISOString()});

  const idx = SOCIOS.indexOf(socio);
  const detail = t.clase ? `Clase: ${t.clase}` : 'Entrada general';
  notifStaff.unshift({txt:`${socio.n} registró su entrada (${detail}) a las ${hora}`, new:true, tipo:'entrada'});
  logMovimiento('entrada_socio', `${socio.n} registró su entrada (${detail}) a las ${hora}`);
  notifSocio[idx] = notifSocio[idx]||[];
  notifSocio[idx].unshift({txt:`Tu entrada fue registrada a las ${hora}. ${detail}`, new:true});

  $('#scanStep1').classList.add('hidden');
  $('#scanStep2').classList.remove('hidden');
  $('#scanName').textContent = `✅ ${socio.n}`;
  $('#scanDetail').textContent = detail;
  $('#scanTime').textContent = `Hora: ${hora}`;

  if(staffPage==='qr') renderStaff();
  persist();
  updateNotifDots();
}

function closeScan(){

function notifStaffParaRol(){

}
function updateNotifDots(){
  $('#staffNotifDot').classList.toggle('hidden', !notifStaffParaRol().some(n=>n.new));

function renderNotifPanel(who){
  const panel = who==='staff' ? $('#staffNotifPanel') : $('#socioNotifPanel');
  const list = who==='staff' ? notifStaffParaRol() : (notifSocio[currentSocioIdx]||[]);
  const canResolve = who==='staff' && (currentRole==='dueno' || currentRole==='admin');
  panel.innerHTML = list.length ? list.map(n=>{
    const showAlta = n.altaIdx!=null && SOCIOS[n.altaIdx] && SOCIOS[n.altaIdx].altaPendiente;
    const acciones = showAlta && canResolve ? `
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();resolverAltaPrevia(${n.altaIdx},false)">No, es nuevo</button>
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();resolverAltaPrevia(${n.altaIdx},true)">Sí, ya era socio</button>
      </div>` : '';
    return `<div class="notif-item">${esc(n.txt)} ${n.new?'<span class="new-tag">Nuevo</span>':''}${acciones}</div>`;
  }).join('') : `<div class="notif-item">${emptyState('ti-bell-off','Sin notificaciones')}</div>`;
}

function toggleNotif(who){
  const panel = who==='staff' ? $('#staffNotifPanel') : $('#socioNotifPanel');
  const open = panel.classList.contains('hidden');
  panel.classList.toggle('hidden');
  if(open){
    const list = who==='staff' ? notifStaff : (notifSocio[currentSocioIdx]||[]);
    renderNotifPanel(who);
    list.forEach(n=>n.new=false);
    updateNotifDots();
  }
}

function resolverAltaPrevia(idx, eraSocio){
  const s = SOCIOS[idx];
  if(!s) return;
  s.altaPendiente = false;
  if(eraSocio){
    s.es = 'ok';
    s.nt.push(`Marcado como socio anterior a la app, pago al día (${new Date().toLocaleDateString('es-AR')}). Falta asignarle un plan.`);
  } else {
    s.nt.push(`Confirmado como socio nuevo desde la app (${new Date().toLocaleDateString('es-AR')}).`);
  }
  notifStaff = notifStaff.filter(n=>n.altaIdx!==idx);
  persist();
  renderNotifPanel('staff');
  if(staffPage) renderStaff();
}

function parseMonto(m){
  const n = parseInt(String(m||'').replace(/[^\d]/g,''),10);
  return isNaN(n) ? 0 : n;
}
function fmtMonto(n){ return '$'+n.toLocaleString('es-AR'); }
function ingresosUltimosMeses(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const total = PAGOS.filter(p=>{ const pd=new Date(p.f); return !isNaN(pd) && pd.getMonth()===d.getMonth() && pd.getFullYear()===d.getFullYear(); }).reduce((a,p)=>a+parseMonto(p.m),0);
    out.push({label: d.toLocaleDateString('es-AR',{month:'long'}), total});
  }
  return out;
}

function csvCell(v){
  v = (v===null||v===undefined) ? '' : String(v);
  return /[",\n;]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
}
function descargarCSV(filename, headers, rows){
  const lines = [headers.map(csvCell).join(';'), ...rows.map(r=>r.map(csvCell).join(';'))];
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function _confirmarEntradaRapida(socioId){
  const idx = SOCIOS.findIndex(s=>s.id===socioId);
  const s = idx>=0 ? SOCIOS[idx] : null;
  if(!s) return;
  const hora = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit',hour12:false});
  s.hoy = true; s.entradaHora = hora; entradasHoy++;
  REGS.unshift({sid:s.id, i:s.i, n:s.n, h:hora, cl:null, f:new Date().toISOString()});
  notifSocio[idx] = notifSocio[idx]||[];
  notifSocio[idx].unshift({txt:`Tu entrada fue registrada a las ${hora}. Entrada general`, new:true});
  notifStaff.unshift({txt:`${s.n} — entrada manual registrada a las ${hora}`, new:true, tipo:'entrada'});
  logMovimiento('entrada_socio', `${s.n} — entrada manual registrada a las ${hora}`);
  persist();
  const _sid = s.id;
  showToast(`Entrada de ${s.n} registrada ✓`, null, null, `function(){deshacerEntrada('${s.id}')}`);
  const tbody = document.getElementById('sociosTableBody');
  if(tbody){
    const rows = sociosOrdenados();
    const showPay = isSuperOwner()||hasPerm('verPagos');
    const cols = showPay ? 6 : 4;
    tbody.innerHTML = rows.length ? rows.map(({s,idx})=>socioRowHTML(s,idx)).join('') : `<tr><td colspan="${cols}" style="text-align:center;color:var(--text2);padding:20px;">Sin resultados</td></tr>`;
  }
}
function sociosOrdenados(){
  const withIdx = SOCIOS.map((s,idx)=>({s,idx}));
  return withIdx
    .filter(o=>o.s.activo!==false)
    .sort((a,b)=>a.s.n.localeCompare(b.s.n,'es'))
    .concat(withIdx.filter(o=>o.s.activo===false).sort((a,b)=>a.s.n.localeCompare(b.s.n,'es')));

  `);

function eliminarSocioCompleto(idx){
  const sEliminado = SOCIOS[idx];
  logMovimiento('eliminacion_socio', `Eliminación definitiva de socio: ${sEliminado.n}`);
  if(sEliminado.id && !deletedSocioIds.includes(sEliminado.id)) deletedSocioIds.push(sEliminado.id);
  if(sEliminado.email){
    delete SOCIOS_LOGIN[sEliminado.email];
    delete SOCIOS_LOGIN[(sEliminado.email||'').toLowerCase()];
  }
  // Limpiar PAGOS y REGS del socio eliminado
  if(sEliminado.id){
    const pk = new Set(PAGOS.filter(p=>p.sid===sEliminado.id).map(p=>p.sid+'|'+p.f+'|'+p.m+'|'+p.mp));
    pk.forEach(k=>{ if(!deletedPagoKeys.includes(k)) deletedPagoKeys.push(k); });
    PAGOS.splice(0,PAGOS.length,...PAGOS.filter(p=>p.sid!==sEliminado.id));
    REGS.splice(0,REGS.length,...REGS.filter(r=>r.sid!==sEliminado.id));
  }
  SOCIOS.splice(idx,1);
  Object.keys(SOCIOS_LOGIN).forEach(email=>{
    const info = SOCIOS_LOGIN[email];
    if(info.idx===idx) delete SOCIOS_LOGIN[email];
    else if(info.idx>idx) info.idx--;
  });
  const newNotif = {};
  Object.keys(notifSocio).map(Number).forEach(k=>{
    if(k===idx) return;
    newNotif[k>idx?k-1:k] = notifSocio[k];
  });
  Object.keys(notifSocio).forEach(k=>delete notifSocio[k]);
  Object.assign(notifSocio, newNotif);
  const newRes = {};
  Object.keys(RESERVAS).map(Number).forEach(k=>{
    if(k===idx) return;
    newRes[k>idx?k-1:k] = RESERVAS[k];
  });
  Object.keys(RESERVAS).forEach(k=>delete RESERVAS[k]);
  Object.assign(RESERVAS, newRes);
  if(currentSocioIdx===idx) currentSocioIdx=null;
  else if(currentSocioIdx>idx) currentSocioIdx--;
  persist();
  closeModal(); renderStaff();
}

async function saveSocio(){
  const n = $('#ns_n').value.trim();
  const email = $('#ns_email').value.trim().toLowerCase();
  const dni = String($('#ns_dni').value).trim();
  const errEl = $('#ns_error');
  if(!n){ errEl.textContent='El nombre es obligatorio.'; errEl.style.display='block'; return; }
  if(!email){ errEl.textContent='El email es obligatorio.'; errEl.style.display='block'; return; }
  if(!dni || isNaN(Number(dni)) || dni.length<6){ errEl.textContent='El DNI debe tener al menos 6 dígitos.'; errEl.style.display='block'; return; }
  cleanOrphanSocioLogin(email);
  if(lookupSocioLogin(email)){ errEl.textContent='Ya existe un socio con ese email.'; errEl.style.display='block'; return; }
  errEl.style.display='none';
  const btn = $('#ns_btn'); btn.disabled=true; btn.textContent='Guardando...';

  const tel = $('#ns_tel').value.trim();
  const cumple = $('#ns_cumple').value || null;
  const ed = cumple ? calcAge(cumple) : (parseInt($('#ns_ed').value)||null);
  const pe = parseInt($('#ns_pe').value)||null;
  const ob = $('#ns_ob').value.trim()||null;
  const obs = $('#ns_obs').value.trim()||null;

  // Crear cuenta Supabase con DNI como contraseña
  let {data, error} = await sb.auth.signUp({email, password:dni, options:{data:{nombre:n, role:'socio', dni}, emailRedirectTo:APP_URL}});
  // Si la cuenta ya existe intentar con las credenciales actuales
  if(!error && data && data.user && Array.isArray(data.user.identities) && data.user.identities.length===0){
    error = {message:'already registered'};
  }
  if(error){
    if(/already.*(registered|exists)|user_already_exists/i.test(error.message)){
      // Cuenta existente — vincularla igualmente al perfil local
    } else {
      errEl.textContent = sbErr(error);
      errEl.style.display='block';
      btn.disabled=false; btn.textContent='Guardar';
      return;
    }
  }

  try{
    const idx = SOCIOS.length;
    SOCIOS.push({id:'soc'+Date.now()+'_'+(socioSeq++)+'_'+Math.random().toString(36).slice(2,6), i:initials(n), n, email, dni, tel:tel||null, cumple, es:'ok', vence:addDaysISO(null,30), rs:[], nt:[], ed, pe, ob, obs, hoy:false, entradaHora:null, activo:true, dniAccesoRapido:!!dni});
    notifSocio[idx]=[];
    SOCIOS_LOGIN[email] = {idx, pe:'ok', pm:'Sin pagos registrados todavía'};
    cacheDni(dni, email);
    logMovimiento('alta_socio', `Alta de socio: ${n} (${email})`);
    persist();
    closeModal(); renderStaff();
    openModal(`
      <div class="modal-head"><h3 style="color:var(--green);">✅ Socio creado</h3><button onclick="closeModal()">✕</button></div>
      <p style="margin-bottom:14px;color:var(--text2);font-size:14px;">La cuenta quedó lista. El socio puede iniciar sesión con:</p>
      <div style="background:var(--bg2);border-radius:10px;padding:14px 16px;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;color:var(--text2);">Email</span>
          <span style="font-weight:600;font-size:14px;">${esc(email)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;color:var(--text2);">Contraseña</span>
          <span style="font-weight:600;font-size:14px;">DNI: ${esc(dni)}</span>
        </div>
      </div>
      <p style="font-size:12.5px;color:var(--text2);margin-bottom:14px;">También puede entrar escaneando el QR del gimnasio con su DNI.</p>
      <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Entendido</button></div>
    `);
  }catch(err){
    errEl.textContent='Error al guardar. Intentá de nuevo.';
    errEl.style.display='block';
    const btn=$('#ns_btn'); if(btn){btn.disabled=false;btn.textContent='Guardar';}

function saveEditSocio(idx){
  const s = SOCIOS[idx];
  const oldEmail = s.email;
  const newEmail = $('#es_email').value.trim().toLowerCase();
  s.email = newEmail||null;
  s.tel = $('#es_tel').value.trim()||null;
  s.pe = parseInt($('#es_pe').value)||null;
  s.ob = $('#es_ob').value.trim()||null;
  s.obs = $('#es_obs').value.trim()||null;
  s.vence = $('#es_vence').value || null;
  // Update SOCIOS_LOGIN BEFORE recalcEstados so any persist() it triggers sees correct state
  if(oldEmail && oldEmail!==newEmail){
    delete SOCIOS_LOGIN[oldEmail];
    delete SOCIOS_LOGIN[(oldEmail||'').toLowerCase()];
    if(s.dni) cacheDni(s.dni, newEmail);
  }
  if(newEmail) SOCIOS_LOGIN[newEmail] = {...(SOCIOS_LOGIN[newEmail]||{pe:'ok',pm:''}), idx};
  // Auto-activar acceso por DNI si tiene DNI cargado
  if(s.dni && !s.dniAccesoRapido){ s.dniAccesoRapido=true; if(s.email) cacheDni(s.dni,(s.email||'').toLowerCase()); }
  recalcEstados({notify:false});
  persist();
  showToast('Guardado');
  closeModal(); renderStaff();
}

async function activarAccesoDni(idx){
  const s = SOCIOS[idx];
  const dni = String($('#es_dni').value||'').trim();
  const email = (s.email||'').trim().toLowerCase();
  const errEl = $('#es_dni_status');
  const btn = $('#es_dni_btn');

  if(!dni || isNaN(Number(dni)) || dni.length < 6){
    errEl.style.color='var(--red)'; errEl.innerHTML='<i class="ti ti-alert-circle"></i> El DNI debe tener al menos 6 dígitos.'; return;
  }
  if(!email){
    errEl.style.color='var(--red)'; errEl.innerHTML='<i class="ti ti-alert-circle"></i> Este socio no tiene email asignado.'; return;
  }

  btn.disabled=true; btn.textContent='Activando...';

  // Intentar crear cuenta Supabase con DNI como contraseña (si no existe aún)
  const {data, error} = await sb.auth.signUp({email, password:dni, options:{data:{nombre:s.n, role:'socio', dni}, emailRedirectTo:APP_URL}});
  const alreadyExists = error && /already.*(registered|exists)|user_already_exists/i.test(error.message||'');
  const newAccount = !error && data && data.user && Array.isArray(data.user.identities) && data.user.identities.length > 0;
  const identitiesEmpty = !error && data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0;

  if(error && !alreadyExists){
    errEl.style.color='var(--red)'; errEl.innerHTML=`<i class="ti ti-alert-circle"></i> Error: ${esc(error.message||'Intentá de nuevo.')}`;
    btn.disabled=false; btn.innerHTML='<i class="ti ti-fingerprint"></i> Activar acceso por DNI'; return;
  }

  // Guardar DNI en perfil y activar flag
  s.dni = dni;
  s.dniAccesoRapido = true;
  cacheDni(dni, email);
  persist();

  if(newAccount){
    errEl.style.color='var(--green)';
    errEl.innerHTML='<i class="ti ti-shield-check"></i> Cuenta creada y acceso por DNI activado. El socio ya puede entrar solo con su DNI desde cualquier dispositivo.';
  } else if(alreadyExists){
    // Cuenta existía con otra contraseña — verificar si el DNI funciona como contraseña
    errEl.style.color='var(--yellow,#f59e0b)';
    errEl.innerHTML='<i class="ti ti-alert-triangle"></i> Esta cuenta fue creada con otro método. El socio deberá ingresar una vez con su email y contraseña para que el acceso por DNI quede activo en todos los dispositivos.';
  } else {
    errEl.style.color='var(--green)';
    errEl.innerHTML='<i class="ti ti-shield-check"></i> Acceso por DNI activado. El socio ya puede entrar solo con su DNI desde cualquier dispositivo.';
  }
  btn.disabled=false;
  btn.innerHTML='<i class="ti ti-fingerprint"></i> Actualizar DNI y reactivar acceso';
  renderStaff();
}

function asignarRutinaSocio(si, rname, search){
  const s = SOCIOS[si];
  if(!s.rs.includes(rname)) s.rs.push(rname);
  // quitar del tombstone para que el merge no lo bloquee
  if(s.rsRemoved) s.rsRemoved = s.rsRemoved.filter(r=>r!==rname);
  persist();
  refreshSocioRutinasList(si, search);

function quitarRutinaSocio(si, rname, search){
  const s = SOCIOS[si];
  s.rs = s.rs.filter(r=>r!==rname);
  if(!s.rsRemoved) s.rsRemoved = [];
  if(!s.rsRemoved.includes(rname)) s.rsRemoved.push(rname);
  if(s.rsDias) delete s.rsDias[rname];
  if(s.rsNotas) delete s.rsNotas[rname];
  if(s.rsNombre) delete s.rsNombre[rname];
  if(s.rsOverride) delete s.rsOverride[rname];

function copiarRutinaDeSOcio(si, rname){
  const s = SOCIOS[si];
  const r = RUTINAS.find(x=>x.n===rname);
  if(!s||!r) return;
  const ejs = (s.rsOverride&&s.rsOverride[rname]) ? JSON.parse(JSON.stringify(s.rsOverride[rname])) : JSON.parse(JSON.stringify(r.ejs));
  _rutinaCopied = {
    rname,
    ejs,
    nombre: (s.rsNombre&&s.rsNombre[rname])||'',
    nota: (s.rsNotas&&s.rsNotas[rname])||'',
    dias: (s.rsDias&&s.rsDias[rname]) ? [...s.rsDias[rname]] : [],
    t: r.t, ob: r.ob
  };
  showToast('Rutina copiada. Abrí otro socio y pegala.');
  closeModal();
}
function pegarRutinaEnSocio(si){
  const s = SOCIOS[si];
  if(!s||!_rutinaCopied) return;
  // Generar nombre único para la nueva rutina
  let base = _rutinaCopied.rname + ' (copia)';
  let n = base, i = 2;
  while(RUTINAS.some(r=>r.n===n)){ n = base+' '+i; i++; }
  // Crear nueva rutina con los ejercicios copiados (baked in, independiente)
  RUTINAS.push({n, t:_rutinaCopied.t||'', ob:_rutinaCopied.ob||'', cr:'Tú', ejs: JSON.parse(JSON.stringify(_rutinaCopied.ejs))});
  // Asignar al socio
  if(!s.rs.includes(n)) s.rs.push(n);
  if(s.rsRemoved) s.rsRemoved = s.rsRemoved.filter(r=>r!==n);
  // Copiar nombre personalizado, nota y días si los tenía
  if(_rutinaCopied.nombre){ if(!s.rsNombre) s.rsNombre={}; s.rsNombre[n]=_rutinaCopied.nombre; }
  if(_rutinaCopied.nota){ if(!s.rsNotas) s.rsNotas={}; s.rsNotas[n]=_rutinaCopied.nota; }
  if(_rutinaCopied.dias&&_rutinaCopied.dias.length){ if(!s.rsDias) s.rsDias={}; s.rsDias[n]=[..._rutinaCopied.dias]; }
  persist();
  showToast('Rutina pegada: "'+n+'"');
  openSocioRutinasModal(si);
}

function mesPagoOptionsHTML(selected){
  const now = new Date();
  const opciones = [];
  for(let off=-3; off<=3; off++){
    const d = new Date(now.getFullYear(), now.getMonth()+off, 1);
    const value = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    let etiqueta = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
    if(off===0) etiqueta += ' (mes actual)';
    else if(off===-1) etiqueta += ' (mes anterior)';
    opciones.push({value, etiqueta});
  }
  const sel = selected || (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  return opciones.map(o=>`<option value="${o.value}" ${o.value===sel?'selected':''}>${esc(o.etiqueta)}</option>`).join('');
}
function mesPagoLabel(mp){
  if(!mp) return '-';

// Calcula vence = día 10 del mes siguiente al mes pagado (ej: mp='2025-07' → '2025-08-10')
function venceDesdeMp(mp){
  if(!mp) return addDaysISO(null, 40);
  const [y,m] = mp.split('-').map(Number);
  const nextM = m===12 ? 1 : m+1;
  const nextY = m===12 ? y+1 : y;
  return `${nextY}-${String(nextM).padStart(2,'0')}-10`;
}
