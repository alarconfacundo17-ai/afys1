    const ejs = r ? r.ejs||[] : [];
    const ejsHechos = ejs.filter(e=>rh[e.n]===ds).length;
    const pct = ejs.length ? Math.round(ejsHechos/ejs.length*100) : 0;
    const completo = ejs.length>0 && ejsHechos===ejs.length;
    const esHoy = ds===todayStr;
    const planNota = ((d.planNotas||{})[ds]||{})[rname];
    const nota = planNota&&planNota.nota ? planNota.nota : '';
    return `<div class="card" style="padding:16px;border-radius:14px;margin-bottom:10px;${esHoy?'cursor:pointer;-webkit-tap-highlight-color:transparent;':''}" ${esHoy?`onclick="closeModal();eliteAbrirRutina('${escQ(rname)}')"`:''}>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:${ejs.length?'10px':'0'};">
        <div style="background:${completo?'rgba(5,150,105,.12)':'var(--primary-light)'};border-radius:10px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="ti ${completo?'ti-check':'ti-barbell'}" style="font-size:20px;color:${completo?'var(--green)':'var(--primary)'};"></i>
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(rname)}</div>
          ${ejs.length ? `<div style="font-size:12px;color:var(--text2);">${ejs.length} ejercicios</div>` : ''}
          ${nota ? `<div style="font-size:11px;color:var(--text2);margin-top:2px;font-style:italic;">${esc(nota)}</div>` : ''}
        </div>
        ${completo ? `<span style="background:rgba(5,150,105,.12);color:var(--green);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;flex-shrink:0;">✓</span>` : esHoy ? `<i class="ti ti-chevron-right" style="color:var(--text2);font-size:18px;flex-shrink:0;"></i>` : ''}
      </div>
      ${ejs.length ? `
      <div style="background:var(--border2);border-radius:6px;height:5px;overflow:hidden;">
        <div style="background:${completo?'var(--green)':'var(--primary)'};height:100%;width:${pct}%;border-radius:6px;"></div>
      </div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px;">${ejsHechos}/${ejs.length} completados</div>` : ''}
    </div>`;
  }).join('');

  openModal(`<div class="modal-head"><h3 style="font-size:14px;">${fechaTxt}</h3><button onclick="closeModal()">✕</button></div>
  <div style="padding:0 16px 16px;overflow-y:auto;max-height:75vh;">
    ${rows}
    ${ds===todayStr ? '<p style="font-size:12px;color:var(--text2);text-align:center;margin:0;">Tocá una rutina para ver los ejercicios</p>' : ''}
  </div>`);
}

/* ---- Rutina detalle elite ---- */
function eliteAbrirRutina(rname){
  const d = eliteById(currentEliteId);
  if(!d) return;
  // Si no hay PSE pre registrada hoy → mostrar cuestionario PRE primero
  const todayStr = todayISO();
  const yaTienePre = (d.pse||[]).some(p=>p.tipo==='pre'&&p.rname===rname&&p.f===todayStr);
  if(!yaTienePre){
    _pseMode = 'pre'; _pseRutinaName = rname; _pseTemp = {};
    openPseModal();
    return;
  }
  openEliteRutinaDetalleModal(rname);
}

function openEliteRutinaDetalleModal(rname){
  const d = eliteById(currentEliteId);
  if(!d) return;
  const r = RUTINAS.find(x=>x.n===rname);
  if(!r) return;
  const todayStr = todayISO();
  const rh = d.rsHechos?.[rname]||{};
  const ejs = r.ejs||[];
  const todosHechos = ejs.length>0 && ejs.every(e=>rh[e.n]===todayStr);
  const miPeso = (d.rsMiPeso&&d.rsMiPeso[rname])||{};
  const miSR = (d.rsMiSR&&d.rsMiSR[rname])||{};

  const yaHizoPost = (d.pse||[]).some(p=>p.tipo==='post'&&p.rname===rname&&p.f===todayStr);
  const hechosCnt = ejs.filter(e=>rh[e.n]===todayStr).length;

  const ejRows = ejs.map((e, ei)=>{
    const hecho = rh[e.n]===todayStr;
    const rn_esc = rname.replace(/'/g,"\\'");
    const en_esc = e.n.replace(/'/g,"\\'");
    const _s = (miSR[e.n]&&miSR[e.n].s) ? String(miSR[e.n].s) : String(e.s||'');
    const _r = (miSR[e.n]&&miSR[e.n].r) ? String(miSR[e.n].r) : String(e.r||'');
    const _p = miPeso[e.n] ? String(miPeso[e.n]) : '';
    const summaryText = e.modo==='tiempo' ? ('Tiempo: '+(e.tiempo||'')) : (_s+'×'+_r+(_p?' | '+_p+' kg':''));
    const selectOpts = '<option value="">-</option>'+[1,2,3,4].map(n=>'<option value="'+n+'"'+(_s==String(n)?' selected':'')+'>'+n+'</option>').join('');
    const img = EJ_IMAGES[e.n];
    return `<div id="eliteEjRow${ei}" style="display:flex;gap:12px;padding:12px;border:1px solid var(--border2);border-radius:12px;margin-bottom:8px;${hecho?'opacity:.7;':''}">
      ${img?`<img src="${esc(img)}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;flex:0 0 auto;" onerror="this.style.display='none'">`:''}
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <b style="font-size:15px;font-weight:700;">${ei+1}. ${esc(e.n).toUpperCase()}</b>
          <button onclick="eliteToggleEjEdit(${ei})" style="height:26px;width:26px;padding:0;border:none;border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ti-pencil" style="font-size:14px;"></i></button>
        </div>
        <p id="eliteEjSum${ei}" style="font-size:14px;font-weight:700;margin:0 0 8px;color:var(--text);">${esc(summaryText)}</p>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          ${e.kg?`<span style="font-size:12px;font-weight:600;color:var(--primary);background:rgba(59,130,201,0.1);padding:4px 9px;border-radius:6px;">Ref: ${esc(e.kg)} kg</span>`:''}
          <button id="eliteEjBtn${ei}" class="btn btn-sm ${hecho?'btn-primary':'btn-outline'}" style="margin-left:auto;height:38px;min-width:110px;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;" onclick="eliteToggleEjercicio('${rn_esc}','${en_esc}',${ei})"><i class="ti ti-check" style="font-size:18px;"></i><span>${hecho?'Hecho':'Marcar hecho'}</span></button>
        </div>
        <div id="eliteEjEdit${ei}" style="display:none;flex-direction:column;gap:10px;margin-top:10px;padding:12px;background:var(--bg2);border-radius:10px;">
          ${e.modo!=='tiempo'?'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><div style="display:flex;flex-direction:column;gap:3px;"><label style="font-size:10px;color:var(--text2);font-weight:600;">SERIES</label><select onchange="eliteSetMiSREj(\''+rn_esc+'\',\''+en_esc+'\',\'s\',this.value)" style="width:64px;font-size:15px;padding:7px 4px;font-weight:700;text-align:center;border:1px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);">'+selectOpts+'</select></div><span style="font-size:18px;color:var(--text2);font-weight:300;align-self:flex-end;padding-bottom:6px;">×</span><div style="display:flex;flex-direction:column;gap:3px;"><label style="font-size:10px;color:var(--text2);font-weight:600;">REPS</label><input type="text" placeholder="'+esc(e.r)+'" value="'+esc((miSR[e.n]&&miSR[e.n].r)||'')+'" oninput="eliteSetMiSREj(\''+rn_esc+'\',\''+en_esc+'\',\'r\',this.value)" style="width:72px;font-size:15px;padding:7px 6px;font-weight:700;text-align:center;border:1px solid var(--border2);border-radius:8px;"></div></div>':''}<div style="display:flex;flex-direction:column;gap:3px;"><label style="font-size:10px;color:var(--text2);font-weight:600;">MI PESO (kg)</label><input type="text" placeholder="ej: 15" value="${esc(_p)}" oninput="eliteSetMiPesoEj('${rn_esc}','${en_esc}',this.value)" style="width:110px;font-size:15px;padding:7px 9px;border:1px solid var(--border2);border-radius:8px;"></div>
          <button onclick="eliteGuardarEjEdit(${ei},'${rn_esc}','${en_esc}')" style="align-self:flex-end;height:38px;padding:0 18px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;">Guardar</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const btnLabel = yaHizoPost
    ? `<i class="ti ti-check"></i> Entrenamiento finalizado`
    : todosHechos
      ? `<i class="ti ti-player-stop-filled"></i> Finalizar y registrar`
      : `<i class="ti ti-check"></i> Completar entrenamiento`;

  openModal(`
    <div class="modal-head">
      <h3 style="font-size:15px;">${esc(rname)}</h3>
      <button onclick="closeModal()">✕</button>
    </div>
    <div style="padding:0 16px 16px;overflow-y:auto;max-height:72vh;-webkit-overflow-scrolling:touch;">
      <div style="font-size:12px;color:var(--text2);margin-bottom:12px;">${esc(r.t||'')} · <span id="eliteRutDetProg">${hechosCnt}/${ejs.length} ejercicios</span>${r.ob?` · ${esc(r.ob)}`:''}</div>
      <div id="eliteRutDetRows">${ejRows}</div>
      <button id="eliteRutDetBtn" class="btn btn-primary" style="width:100%;margin-top:16px;border-radius:10px;font-size:15px;padding:13px;${yaHizoPost?'opacity:.6;pointer-events:none;background:var(--green);border-color:var(--green);':''}" onclick="eliteCompletarEntrenamiento('${escQ(rname)}')">
        ${btnLabel}
      </button>
    </div>`,'wide');
  window._eliteRutinaDetalleRname = rname;
}
function eliteToggleEjEdit(ei){
  const el = document.getElementById('eliteEjEdit'+ei);
  if(el) el.style.display = el.style.display==='none' ? 'flex' : 'none';
}
function eliteGuardarEjEdit(ei, rname, ejName){
  const d = eliteById(currentEliteId);
  if(!d) return;
  const r = RUTINAS.find(x=>x.n===rname);
  const ej = (r&&r.ejs||[]).find(x=>x.n===ejName)||{};
  const miSR = (d.rsMiSR&&d.rsMiSR[rname])||{};
  const miPeso = (d.rsMiPeso&&d.rsMiPeso[rname])||{};
  const _s = (miSR[ejName]&&miSR[ejName].s) ? String(miSR[ejName].s) : String(ej.s||'');
  const _r = (miSR[ejName]&&miSR[ejName].r) ? String(miSR[ejName].r) : String(ej.r||'');
  const _p = miPeso[ejName] ? String(miPeso[ejName]) : '';
  const summaryText = ej.modo==='tiempo' ? ('Tiempo: '+(ej.tiempo||'')) : (_s+'×'+_r+(_p?' | '+_p+' kg':''));
  const sumEl = document.getElementById('eliteEjSum'+ei);
  if(sumEl) sumEl.textContent = summaryText;
  eliteToggleEjEdit(ei);
}
function eliteSetMiPesoEj(rname, ejName, val){
  const d = eliteById(currentEliteId);
  if(!d) return;
  if(!d.rsMiPeso) d.rsMiPeso = {};
  if(!d.rsMiPeso[rname]) d.rsMiPeso[rname] = {};
  if(val.trim()) d.rsMiPeso[rname][ejName] = val.trim();
  else delete d.rsMiPeso[rname][ejName];
  persist();
}
function eliteSetMiSREj(rname, ejName, field, val){
  const d = eliteById(currentEliteId);
  if(!d) return;
  if(!d.rsMiSR) d.rsMiSR = {};
  if(!d.rsMiSR[rname]) d.rsMiSR[rname] = {};
  if(!d.rsMiSR[rname][ejName]) d.rsMiSR[rname][ejName] = {};
  if(val.trim()) d.rsMiSR[rname][ejName][field] = val.trim();
  else delete d.rsMiSR[rname][ejName][field];
  if(Object.keys(d.rsMiSR[rname][ejName]).length===0) delete d.rsMiSR[rname][ejName];
  persist();
}

function eliteToggleEjercicio(rname, ejName, ejIdx){
  const d = eliteById(currentEliteId);
  if(!d) return;
  if(!d.rsHechos) d.rsHechos = {};
  if(!d.rsHechos[rname]) d.rsHechos[rname] = {};
  const todayStr = todayISO();
  const wasHecho = d.rsHechos[rname][ejName]===todayStr;
  d.rsHechos[rname][ejName] = wasHecho ? null : todayStr;
  persist();
  // Update DOM in-place (no re-render)
  const hecho = !wasHecho;
  const row = document.getElementById(`eliteEjRow${ejIdx}`);
  const btn = document.getElementById(`eliteEjBtn${ejIdx}`);
  if(row) row.style.opacity = hecho ? '.7' : '1';
  if(btn){
    btn.className = 'btn btn-sm '+(hecho?'btn-primary':'btn-outline');
    btn.querySelector('span').textContent = hecho ? 'Hecho' : 'Marcar hecho';
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  }
  // Update progress + button
  const r = RUTINAS.find(x=>x.n===rname);
  const ejs = r ? r.ejs||[] : [];
  const rh = d.rsHechos[rname]||{};
  const hechos = ejs.filter(e=>rh[e.n]===todayStr).length;
  const todosHechos = ejs.length>0 && hechos===ejs.length;
  const prog = document.getElementById('eliteRutDetProg');
  if(prog) prog.textContent = `${hechos}/${ejs.length} ejercicios`;
  const btnFin = document.getElementById('eliteRutDetBtn');
  if(btnFin){
    const yaHizoPost = (d.pse||[]).some(p=>p.tipo==='post'&&p.rname===rname&&p.f===todayStr);
    if(!yaHizoPost){
      btnFin.innerHTML = todosHechos
        ? `<i class="ti ti-player-stop-filled"></i> Finalizar y registrar`
        : `<i class="ti ti-check"></i> Completar entrenamiento`;
    }
  }
}

function eliteCompletarEntrenamiento(rname){
  const d = eliteById(currentEliteId);
  if(!d) return;
  const r = RUTINAS.find(x=>x.n===rname);
  if(!r) return;
  const todayStr = todayISO();
  if(!d.rsHechos) d.rsHechos = {};
  if(!d.rsHechos[rname]) d.rsHechos[rname] = {};
  const ejs = r.ejs||[];
  // Marcar todos los ejercicios que falten
  ejs.forEach(e=>{ d.rsHechos[rname][e.n]=todayStr; });
  d.ultimoEntreno = {r:rname, f:todayStr};
  persist();
  closeModal();
  // Si ya respondió el PSE post hoy → toast y volver al panel
  const yaHizoPost = (d.pse||[]).some(p=>p.tipo==='post'&&p.rname===rname&&p.f===todayStr);
  if(yaHizoPost){
    showToast('¡Entrenamiento registrado! Muy bien.', 'ok');
    renderElitePanel();
  } else {
    _pseMode = 'post'; _pseRutinaName = rname; _pseTemp = {};
    setTimeout(()=>openPseModal(), 200);
  }
}

/* ---- PSE Modal ---- */
function _pseUpdateRpe(qid){
  document.querySelectorAll(`[data-pseq="${qid}"]`).forEach(b=>{
    const n = +b.dataset.pseval;
    const sel = String(_pseTemp[qid])===String(n);
    const c = n<=3?'#059669':n<=6?'#d97706':'#dc2626';
    b.style.border = '2px solid '+(sel?c:'var(--border)');
    b.style.background = sel?c+'22':'var(--bg2)';
    b.style.color = sel?c:'var(--text)';
    b.style.transform = sel?'scale(1.12)':'scale(1)';
  });
}
function _pseUpdateChoice(qid){
  document.querySelectorAll(`[data-pseq="${qid}"]`).forEach(b=>{
    const sel = b.dataset.pseval===String(_pseTemp[qid]);
    b.style.border = '1.5px solid '+(sel?'var(--primary)':'var(--border)');
    b.style.background = sel?'var(--primary-light)':'var(--bg2)';

/* merge para ELITE_DEPORTISTAS en mergeRemoteIntoLocal/mergeRemoteAntesDeGuardar */
function mergeEliteRemote(remoteElite, remoteDeletedEliteIds){
  if(Array.isArray(remoteDeletedEliteIds)){
    remoteDeletedEliteIds.forEach(id=>{ if(!deletedEliteIds.includes(id)) deletedEliteIds.push(id); });
    const delSet = new Set(deletedEliteIds);
    for(let i=ELITE_DEPORTISTAS.length-1;i>=0;i--){ if(delSet.has(ELITE_DEPORTISTAS[i].id)) ELITE_DEPORTISTAS.splice(i,1); }
  }
  if(!Array.isArray(remoteElite)) return;
  const delSet = new Set(deletedEliteIds);
  const localById = {};
  ELITE_DEPORTISTAS.forEach(d=>{ localById[d.id]=d; });
  remoteElite.forEach(rd=>{
    if(!rd.id||delSet.has(rd.id)) return;
    if(localById[rd.id]){
      const ld = localById[rd.id];
      // merge rsHechos
      if(rd.rsHechos) mergeRsHechosAdditivo(ld.rsHechos||(ld.rsHechos={}), rd.rsHechos);
      // merge rsMiPeso (additivo: no sobreescribir si local ya tiene)
      if(rd.rsMiPeso&&typeof rd.rsMiPeso==='object'){ if(!ld.rsMiPeso) ld.rsMiPeso={}; Object.keys(rd.rsMiPeso).forEach(rn=>{ if(!ld.rsMiPeso[rn]) ld.rsMiPeso[rn]={}; Object.keys(rd.rsMiPeso[rn]).forEach(en=>{ if(!ld.rsMiPeso[rn][en]) ld.rsMiPeso[rn][en]=rd.rsMiPeso[rn][en]; }); }); }
      // merge rsMiSR (additivo: no sobreescribir si local ya tiene)
      if(rd.rsMiSR&&typeof rd.rsMiSR==='object'){ if(!ld.rsMiSR) ld.rsMiSR={}; Object.keys(rd.rsMiSR).forEach(rn=>{ if(!ld.rsMiSR[rn]) ld.rsMiSR[rn]={}; Object.keys(rd.rsMiSR[rn]).forEach(en=>{ if(!ld.rsMiSR[rn][en]||Object.keys(ld.rsMiSR[rn][en]).length===0) ld.rsMiSR[rn][en]=rd.rsMiSR[rn][en]; }); }); }
      if(rd.ultimoEntreno&&(!ld.ultimoEntreno||rd.ultimoEntreno.f>ld.ultimoEntreno.f)) ld.ultimoEntreno=rd.ultimoEntreno;
      // merge pse (additivo por timestamp)
      if(Array.isArray(rd.pse)&&rd.pse.length){
        if(!Array.isArray(ld.pse)) ld.pse=[];
        const lk=new Set(ld.pse.map(p=>p.f+'|'+p.tipo+'|'+(p.rname||'')));
        rd.pse.forEach(p=>{ const k=p.f+'|'+p.tipo+'|'+(p.rname||''); if(!lk.has(k)){ ld.pse.push(p); lk.add(k); } });
      }
      // merge competencias (respeta tombstones de eliminadas)
      if(Array.isArray(rd.competencias)&&rd.competencias.length){
        if(!Array.isArray(ld.competencias)) ld.competencias=[];
        const removed=new Set(ld.competenciasRemoved||[]);
        const lk=new Set(ld.competencias.map(c=>c.f+'|'+c.n));
        rd.competencias.forEach(c=>{ const k=c.f+'|'+c.n; if(!lk.has(k)&&!removed.has(k)){ ld.competencias.push(c); lk.add(k); } });
      }
      // merge competenciasRemoved
      if(Array.isArray(rd.competenciasRemoved)&&rd.competenciasRemoved.length){
        if(!Array.isArray(ld.competenciasRemoved)) ld.competenciasRemoved=[];
        const lk=new Set(ld.competenciasRemoved);
        rd.competenciasRemoved.forEach(k=>{ if(!lk.has(k)){ ld.competenciasRemoved.push(k); lk.add(k); } });
      }
      // merge rs (rutinas asignadas)
      if(Array.isArray(rd.rs)&&rd.rs.length){
        if(!Array.isArray(ld.rs)) ld.rs=[];
        const localRemoved=new Set(ld.rsRemoved||[]);
        const lk=new Set(ld.rs);
        rd.rs.forEach(r=>{if(!localRemoved.has(r)&&!lk.has(r)){ld.rs.push(r);lk.add(r);}});
      }
      // campos simples: tomar remoto si el local no tiene
      ['n','dni','disciplina','tel','email','ob'].forEach(k=>{ if(rd[k]&&!ld[k]) ld[k]=rd[k]; });
      if(typeof rd.activo==='boolean') ld.activo=rd.activo;
      // planSemanal: merge additive por rutina
      if(rd.planSemanal && typeof rd.planSemanal==='object'){
        if(!ld.planSemanal) ld.planSemanal = {};
        Object.keys(rd.planSemanal).forEach(rname=>{ ld.planSemanal[rname] = rd.planSemanal[rname]; });
      }
      // planFechas: merge por fecha (remoto gana si local no tiene ese día)
      if(rd.planFechas && typeof rd.planFechas==='object'){
        if(!ld.planFechas) ld.planFechas = {};
        Object.keys(rd.planFechas).forEach(fecha=>{ if(ld.planFechas[fecha]===undefined) ld.planFechas[fecha]=rd.planFechas[fecha]; });
      }
    } else {
      ELITE_DEPORTISTAS.push(rd);
      localById[rd.id]=rd;
    }
  });
}

function openHistorialAnualModal(idx, year, editMode){

function toggleHistorialEntreno(idx, year, m){
  const s = SOCIOS[idx];
  if(!s) return;
  const fechaISO = `${year}-${String(m+1).padStart(2,'0')}-15T12:00:00.000Z`;
  const existe = REGS.findIndex(r=>regBelongsTo(r,s) && new Date(r.f).getFullYear()===year && new Date(r.f).getMonth()===m);
  if(existe>=0){
    REGS.splice(existe,1);
  } else {
    REGS.unshift({sid:s.id, i:s.i, n:s.n, h:'12:00', cl:null, f:fechaISO, manual:true});
  }
  REGS.sort((a,b)=>new Date(b.f)-new Date(a.f));
  entradasHoy = REGS.filter(r=>r.f&&localDateISO(r.f)===todayISO()).length;
  persist();
  openHistorialAnualModal(idx, year, _histEditMode);
}
function toggleHistorialPago(idx, year, m, mpKey){
  const s = SOCIOS[idx];
  if(!s) return;
  const fechaISO = `${year}-${String(m+1).padStart(2,'0')}-01`;
  const existeIdx = PAGOS.findIndex(p=>pagoBelongsTo(p,s) && p.mp===mpKey);
  if(existeIdx>=0){
    const pk = PAGOS[existeIdx].sid+'|'+PAGOS[existeIdx].f+'|'+PAGOS[existeIdx].m+'|'+PAGOS[existeIdx].mp;
    if(!deletedPagoKeys.includes(pk)) deletedPagoKeys.push(pk);
    PAGOS.splice(existeIdx,1);
  } else {
    PAGOS.unshift({sid:s.id, n:s.n, m:'Manual', f:fechaISO, mp:mpKey, med:'Efectivo', nt:'Cargado manualmente'});
    PAGOS.sort((a,b)=>new Date(b.f)-new Date(a.f));
    // Actualizar vence si este mes es el más reciente pagado
    const nuevoVence = venceDesdeMp(mpKey);
    if(!s.vence || nuevoVence > s.vence) { s.vence = nuevoVence; s.es='ok'; }
  }
  recalcEstados({notify:false});
  persist();
  openHistorialAnualModal(idx, year, _histEditMode);
}

let _closeModalTimer = null;
function openModal(html, size){
  // Cancelar cualquier timer pendiente de close para que no borre este nuevo modal
  if(_closeModalTimer){ clearTimeout(_closeModalTimer); _closeModalTimer=null; }
  const prevBox = document.querySelector('.modal-box');
  const prevBoxTop = prevBox ? prevBox.scrollTop : 0;
  const prevList = document.getElementById('modalScrollList');
  const prevListTop = prevList ? prevList.scrollTop : 0;
  const active = document.activeElement;
  const focusInfo = (active && prevBox && prevBox.contains(active) && active.id) ? {
    id: active.id, start: active.selectionStart, end: active.selectionEnd
  } : null;
  $('#modalHost').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box ${size==='wide'?'wide':''}">${html}</div></div>`;
  const box = document.querySelector('.modal-box');
  if(box) box.scrollTop = prevBoxTop;
  const list = document.getElementById('modalScrollList');
  if(list) list.scrollTop = prevListTop;
  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      el.focus();
      if(typeof focusInfo.start==='number'){ try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){} }
    }
  }
}
function closeModal(){
  const overlay = document.querySelector('.modal-overlay');
  const box = document.querySelector('.modal-box');
  if(overlay && box){
    overlay.classList.add('closing');
    box.classList.add('closing');
    _closeModalTimer = setTimeout(()=>{ _closeModalTimer=null; $('#modalHost').innerHTML=''; }, 170);
  } else {
    $('#modalHost').innerHTML='';

}

function calcAge(birthStr){
  const b = new Date(birthStr+'T00:00:00');
  if(isNaN(b)) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const hadBirthdayThisYear = (now.getMonth()>b.getMonth()) || (now.getMonth()===b.getMonth() && now.getDate()>=b.getDate());
  if(!hadBirthdayThisYear) age--;
  return age;
}

  return s.cumple ? calcAge(s.cumple) : s.ed;

function claseKey(c){ return c.cId || (c.n+'_'+c.h); }

function completarEntrenamiento(rname){
  const s = SOCIOS[currentSocioIdx];
  const r = RUTINAS.find(x=>x.n===rname);
  if(!r||!s) return;
  const ejs = (s.rsOverride&&s.rsOverride[rname]) ? s.rsOverride[rname] : r.ejs;
  const hoy = todayISO();
  if(!s.rsHechos) s.rsHechos = {};
  if(!s.rsHechos[rname]) s.rsHechos[rname] = {};
  const todosHechos = ejs.length>0 && ejs.every(e=>s.rsHechos[rname][e.n]===hoy);
  if(todosHechos){
    ejs.forEach(e=>delete s.rsHechos[rname][e.n]);
  } else {
    ejs.forEach(e=>{ s.rsHechos[rname][e.n]=hoy; });
    s.ultimoEntreno = {r:rname, f:hoy};
  }
  persist();
  openSocioRutinaDetalleModal(rname);
}

function toggleEjercicioHecho(rname, ejName, ei){

  if(s.rsHechos[rname][ejName]===hoy) delete s.rsHechos[rname][ejName];
  else { s.rsHechos[rname][ejName] = hoy; s.ultimoEntreno = {r:rname, f:hoy}; }

      btn.classList.add('pop');
      return;

  }

function setMiPesoEj(si, rname, ejName, val){
  const s = SOCIOS[si];
  if(!s.rsMiPeso) s.rsMiPeso = {};
  if(!s.rsMiPeso[rname]) s.rsMiPeso[rname] = {};
  if(val.trim()) s.rsMiPeso[rname][ejName] = val.trim();
  else delete s.rsMiPeso[rname][ejName];
  persist();
}
function setMiSREj(si, rname, ejName, field, val){
  const s = SOCIOS[si];
  if(!s.rsMiSR) s.rsMiSR = {};
  if(!s.rsMiSR[rname]) s.rsMiSR[rname] = {};
  if(!s.rsMiSR[rname][ejName]) s.rsMiSR[rname][ejName] = {};
  if(val.trim()) s.rsMiSR[rname][ejName][field] = val.trim();
  else delete s.rsMiSR[rname][ejName][field];
  if(Object.keys(s.rsMiSR[rname][ejName]).length===0) delete s.rsMiSR[rname][ejName];
  persist();
}

    // necesitamos re-persistir después del merge para volver a escribir nuestro estado.
    let localAheadOfRemote = false;
    if(Array.isArray(data.SOCIOS)){
      const remByKey = {};
      data.SOCIOS.forEach(rs=>{ remByKey[socioMergeKey(rs)] = rs; });
      for(const ls of SOCIOS){
        const rs = remByKey[socioMergeKey(ls)];

        if(Array.isArray(ls.rs) && ls.rs.some(r => !remRs.has(r) && !remRemoved.has(r))){

        if(Array.isArray(ls.rsRemoved) && ls.rsRemoved.some(r => !remRemoved.has(r))){
          localAheadOfRemote = true; break;
        }

        }
      }
    }

    if(!localAheadOfRemote && Array.isArray(data.RUTINAS)){

      data.RUTINAS.forEach(r=>{ remByName[r.n]=r; });
      for(const lr of RUTINAS){
        const rr = remByName[lr.n];
        if(rr && (lr.ts||0) > (rr.ts||0)){ localAheadOfRemote = true; break; }
      }
    }

    // Detectar si hay deportistas elite locales que no existen en el remoto (recién creados)
    if(!localAheadOfRemote && Array.isArray(data.ELITE_DEPORTISTAS)){
      const remEliteIds = new Set(data.ELITE_DEPORTISTAS.map(rd=>rd.id));
      if(ELITE_DEPORTISTAS.some(ld=>!remEliteIds.has(ld.id))) localAheadOfRemote = true;
    }

    if(!localAheadOfRemote && Array.isArray(data.ELITE_DEPORTISTAS)){
      const todayStr = todayISO();
      const remEliteById = {};

        const rd = remEliteById[ld.id];

    if(remote.notifSocio){ const _n2remap={}; if(Array.isArray(remote.SOCIOS)) remote.SOCIOS.forEach((rs,ri)=>{ const li=SOCIOS.findIndex(s=>socioMergeKey(s)===socioMergeKey(rs)); if(li>=0) _n2remap[ri]=li; }); Object.keys(remote.notifSocio).forEach(remIdx=>{ if(_n2remap[Number(remIdx)]===undefined) return; const li=_n2remap[Number(remIdx)]; if(!notifSocio[li]) notifSocio[li]=[]; const lk=new Set(notifSocio[li].map(n=>n.txt)); (remote.notifSocio[remIdx]||[]).forEach(n=>{ if(!lk.has(n.txt)){ notifSocio[li].unshift(n); lk.add(n.txt); } }); }); }
    if(typeof remote.turnoSeq==='number' && remote.turnoSeq > turnoSeq) turnoSeq = remote.turnoSeq;
    if(typeof remote.socioSeq==='number' && remote.socioSeq > socioSeq) socioSeq = remote.socioSeq;
    if(typeof remote.eliteSeq==='number' && remote.eliteSeq > eliteSeq) eliteSeq = remote.eliteSeq;
    mergeEliteRemote(remote.ELITE_DEPORTISTAS, remote.deletedEliteIds);
    recalcEstados({notify:false}); // _merging removed: allows persist() when es status changes
  }

  sb.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY'){
      window.history.replaceState({}, '', window.location.pathname);
      loginView='resetPassword'; loginError=''; loginInfo='';
      $('#login').classList.remove('hidden');
      $('#staff').classList.add('hidden');
      $('#socio').classList.add('hidden');
      $('#qrGate').classList.add('hidden');
      renderLogin();
    }
  });

  const {data:{session}} = await sb.auth.getSession();
  if(isRecovery && session){
    window.history.replaceState({}, '', window.location.pathname);
    loginView='resetPassword'; loginError=''; loginInfo='';
    $('#login').classList.remove('hidden');
    renderLogin();
  } else if(!isRecovery && session && session.user && session.user.email){
    const sEmail = session.user.email.toLowerCase();
    if(isStaffQR && sEmail!==DUENO_EMAIL && !STAFF.find(s=>s.email===sEmail) && !SOCIOS_LOGIN[sEmail]){
      ensureStaffProfile(sEmail, session.user);
    }
    await routeLoggedInUser(sEmail);
    if(pendingQR && currentRole==='socio') startScan();
  } else if(eliteDniParam){
    // Login directo por link con DNI
    renderEliteLogin(eliteDniParam);
    // intentar login automático si el DNI está en la URL
    const dFound = eliteByDni(eliteDniParam);
    if(dFound && dFound.activo!==false){
      currentEliteId = dFound.id;
      localStorage.setItem('afys_elite_id', dFound.id);
      $('#login').classList.add('hidden');
      $('#elite').classList.remove('hidden');
      elitePage = 'inicio';
      renderElitePanel();
    }
  } else if(invite){
    openStaffGate(invite);
  } else if(inviteToken){
    $('#login').classList.remove('hidden');
    loginError='Este link de invitación ya no es válido. Pedí uno nuevo.';
    renderLogin();
  } else if(isStaffQR){
    openStaffGate();
  } else if(pendingQR){
    openQRGate();
  } else {
    // Verificar si hay sesión elite guardada en localStorage
    const savedEliteId = localStorage.getItem('afys_elite_id');
    if(savedEliteId && eliteById(savedEliteId) && eliteById(savedEliteId).activo!==false){
      currentEliteId = savedEliteId;
      $('#login').classList.add('hidden');
      $('#elite').classList.remove('hidden');
      elitePage = 'inicio';
      renderElitePanel();
    } else {
      $('#login').classList.remove('hidden');
      renderLogin();
    }
  }
})();
</script>
</body>
</html>
