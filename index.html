<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gimnasio Afys</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/dist/tabler-icons.min.css">
<style>
:root{
  --primary:#3B82C9; --green:#059669; --red:#DC2626;
  --bg:#fff; --bg2:#f9fafb; --border:#e5e7eb; --border2:#f0f0f0;
  --text:#111; --text2:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg2);color:var(--text);}
.hidden{display:none !important;}
button{cursor:pointer;font-family:inherit;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;width:100%;}
.btn{padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn:hover{opacity:.9;}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:10px 8px;color:var(--text2);border-bottom:1px solid var(--border);font-weight:600;}
td{padding:10px 8px;border-bottom:1px solid var(--border2);}
.badge{padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;display:inline-block;}
.b-ok{background:#D1FAE5;color:#064E3B;}
.b-warn{background:#FEF3C7;color:#92400E;}
.b-err{background:#FEE2E2;color:#991B1B;}
.b-info{background:#DBEAFE;color:#1E40AF;}
.b-purple{background:#DBEAFE;color:#1E40AF;}
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.metric{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;}
.metric .num{font-size:26px;font-weight:700;}
.metric .lbl{font-size:12.5px;color:var(--text2);margin-top:4px;}
h2{font-size:20px;margin-bottom:14px;}
h3{font-size:15px;margin-bottom:10px;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);}
.login-box{box-shadow:0 4px 24px rgba(0,0,0,.08);}
.login-box{background:#fff;border-radius:16px;padding:36px;width:380px;}
.login-box h1{font-size:24px;text-align:center;margin-bottom:4px;}
.login-box p.sub{text-align:center;color:var(--text2);font-size:13px;margin-bottom:20px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.role-btn{padding:14px;border:2px solid var(--border);border-radius:10px;text-align:center;font-weight:600;font-size:13px;}
.role-btn.active{border-color:var(--primary);background:#DBEAFE;color:var(--primary);}
.login-box label{font-size:12.5px;font-weight:600;display:block;margin:10px 0 4px;}
.hint{background:var(--bg2);border-radius:8px;padding:10px;font-size:11.5px;color:var(--text2);margin-top:16px;line-height:1.6;}

#qrGate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);}

/* STAFF LAYOUT */
#staff{display:flex;min-height:100vh;}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);padding:20px 12px;flex-shrink:0;}
.sidebar .logo{font-weight:700;font-size:18px;color:var(--primary);padding:0 10px 20px;display:flex;align-items:center;gap:8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text2);margin-bottom:2px;}
.nav-item.active{background:#DBEAFE;color:var(--primary);font-weight:600;}
.nav-item:hover{background:var(--bg2);}
.main{flex:1;padding:0;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 26px;display:flex;justify-content:space-between;align-items:center;}
.topbar .role-tag{font-size:12px;color:var(--text2);}
.bell{position:relative;font-size:20px;}
.bell .dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--red);border-radius:50%;}
.content{padding:24px 26px;}
.page{display:none;}
.page.active{display:block;}

/* notif dropdown */
.notif-wrap{position:relative;}
.notif-panel{position:absolute;right:0;top:34px;width:300px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:360px;overflow:auto;z-index:50;}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border2);font-size:13px;}
.notif-item .new-tag{background:var(--green);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px;}

/* groups (ejercicios) */
.group-block{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.group-head{padding:12px 16px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;}
.group-body{padding:10px 16px;}
.ej-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border2);font-size:13.5px;}
.ej-row:last-child{border-bottom:none;}
.dot-num{display:inline-flex;width:22px;height:22px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-size:11px;margin-right:8px;font-weight:700;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:460px;max-height:86vh;overflow:auto;}
.modal-box.wide{width:600px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{margin:0;font-size:17px;}
.field{margin-bottom:12px;}
.field label{font-size:12.5px;font-weight:600;display:block;margin-bottom:4px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

/* toggle */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13.5px;}
.toggle{width:42px;height:24px;border-radius:14px;background:#DC2626;position:relative;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.15s;}
.toggle.on::after{left:21px;}
.toggle.locked{opacity:.5;cursor:not-allowed;}

/* tags */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:#DBEAFE;color:#1E40AF;padding:3px 8px;border-radius:14px;font-size:11.5px;display:flex;align-items:center;gap:5px;}
.tag .x{cursor:pointer;font-weight:700;}

/* bars */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
.bar-row .lbl{width:90px;flex-shrink:0;color:var(--text2);}
.bar-track{flex:1;background:var(--bg2);border-radius:6px;height:18px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary);border-radius:6px;}

/* socio app */
#socio{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
.socio-topbar{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.socio-content{flex:1;padding:16px 18px;padding-bottom:80px;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid var(--border);display:flex;}
.bn-item{flex:1;text-align:center;padding:10px 0 8px;font-size:11px;color:var(--text2);}
.bn-item i{display:block;font-size:20px;margin-bottom:2px;}
.bn-item.active{color:var(--primary);}
.s-page{display:none;}
.s-page.active{display:block;}
.profile-card{background:linear-gradient(135deg,#3B82C9,#60A5FA);color:#fff;border-radius:16px;padding:20px;margin-bottom:16px;position:relative;}
.avatar{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:10px;}
.chip{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:14px;font-size:11.5px;margin-right:6px;}
.pay-banner{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.day-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.day-row.rest{opacity:.55;}
.class-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}

/* scan screen */
#scan{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;text-align:center;}
.scan-box{width:340px;}
.scan-spinner{font-size:60px;margin-bottom:20px;}
.qr-box{display:flex;justify-content:center;margin:16px 0;}

@media(max-width:760px){
  .sidebar{display:none;}
  #staff{flex-direction:column;}
}

/* horarios - calendario semanal */
.cal-wrap{overflow-x:auto;}
.cal-grid{display:grid;grid-auto-rows:auto;border:1px solid var(--border);border-radius:8px;overflow:hidden;min-width:520px;font-size:12px;}
.cal-corner{grid-row:1;grid-column:1;border-bottom:1px solid var(--border);background:var(--bg2);}
.cal-daylabel{grid-row:1;padding:5px 4px;text-align:center;font-weight:600;font-size:11.5px;border-bottom:1px solid var(--border);border-left:1px solid var(--border2);background:var(--bg2);}
.cal-hours{border-right:1px solid var(--border);}
.cal-hour{font-size:10px;color:var(--text2);padding:1px 4px;border-top:1px solid var(--border2);box-sizing:border-box;}
.cal-daycol{position:relative;border-left:1px solid var(--border2);box-sizing:border-box;}
.cal-hourline{border-top:1px solid var(--border2);box-sizing:border-box;}
.cal-event{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 4px;font-size:10px;line-height:1.25;overflow:hidden;cursor:pointer;box-sizing:border-box;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="login-box" id="loginBox"></div>
</div>

<!-- ===================== QR GATE (socio escanea el QR del gimnasio) ===================== -->
<div id="qrGate" class="hidden">
  <div class="login-box" id="qrGateContent"></div>
</div>

<!-- ===================== STAFF GATE (profesor escanea el QR impreso) ===================== -->
<div id="staffGate" class="hidden">
  <div class="login-box" id="staffGateContent"></div>
</div>

<!-- ===================== SCAN ===================== -->
<div id="scan" class="hidden">
  <div class="scan-box">
    <div id="scanStep1">
      <div class="scan-spinner">⏳</div>
      <h2>Verificando código QR...</h2>
      <p style="color:#aaa;font-size:13px;">Por favor espera un momento</p>
    </div>
    <div id="scanStep2" class="hidden">
      <div class="scan-spinner">✅</div>
      <h2 id="scanName">Acceso registrado</h2>
      <p id="scanDetail" style="color:#aaa;font-size:13px;margin:8px 0 4px;"></p>
      <p id="scanTime" style="color:#fff;font-size:15px;font-weight:700;margin-bottom:20px;"></p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="closeScan()">Ir a la app</button>
    </div>
  </div>
</div>

<!-- ===================== STAFF (dueño/admin/profesor) ===================== -->
<div id="staff" class="hidden">
  <div class="sidebar" id="staffSidebar"></div>
  <div class="main">
    <div class="topbar">
      <div>
        <b id="staffTitle">Panel</b>
        <div class="role-tag" id="staffRoleTag"></div>
      </div>
      <div style="display:flex;gap:16px;align-items:center;">
        <div class="notif-wrap">
          <button class="bell" onclick="toggleNotif('staff')">🔔<span class="dot hidden" id="staffNotifDot"></span></button>
          <div class="notif-panel hidden" id="staffNotifPanel"></div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
      </div>
    </div>
    <div class="content" id="staffContent"></div>
  </div>
</div>

<!-- ===================== SOCIO ===================== -->
<div id="socio" class="hidden">
  <div class="socio-topbar">
    <b>Gimnasio Afys</b>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="notif-wrap">
        <button class="bell" onclick="toggleNotif('socio')">🔔<span class="dot hidden" id="socioNotifDot"></span></button>
        <div class="notif-panel hidden" id="socioNotifPanel" style="right:-10px;"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="logout()">Salir</button>
    </div>
  </div>
  <div class="socio-content" id="socioContent"></div>
  <div class="bottom-nav">
    <div class="bn-item active" data-tab="inicio"><i class="ti ti-home"></i>Inicio</div>
    <div class="bn-item" data-tab="clases"><i class="ti ti-calendar"></i>Clases</div>
    <div class="bn-item" data-tab="rutina"><i class="ti ti-barbell"></i>Rutina</div>
    <div class="bn-item" data-tab="asistencia"><i class="ti ti-check"></i>Asistencia</div>
    <div class="bn-item" data-tab="cuenta"><i class="ti ti-user"></i>Cuenta</div>
  </div>
</div>

<!-- ===================== MODAL HOST ===================== -->
<div id="modalHost"></div>

function fillArray(arr, data){ if(!Array.isArray(data)) return; arr.length=0; arr.push(...data); }
function fillObject(obj, data){ if(!data || !Object.keys(data).length) return; Object.keys(obj).forEach(k=>delete obj[k]); Object.assign(obj, data); }

function snapshotState(){
  return {
    SOCIOS, RUTINAS, CLASES_HOY, PAGOS, REGS, SOCIOS_LOGIN, EJD, EJC, EJ_VIDEOS, EJ_IMAGES,
    STAFF, GYM_HOURS, TURNOS, turnoSeq, notifStaff, notifSocio, entradasHoy, collapsedGroups, DUENO_EMAIL,
  };
}

function applyState(s){
  if(!s || !Object.keys(s).length) return;
  fillArray(SOCIOS, s.SOCIOS);
  fillArray(RUTINAS, s.RUTINAS);
  fillArray(CLASES_HOY, s.CLASES_HOY);
  fillArray(PAGOS, s.PAGOS);
  fillArray(REGS, s.REGS);
  fillObject(SOCIOS_LOGIN, s.SOCIOS_LOGIN);
  fillObject(EJD, s.EJD);
  fillObject(EJC, s.EJC);
  fillObject(EJ_VIDEOS, s.EJ_VIDEOS);
  fillObject(EJ_IMAGES, s.EJ_IMAGES);
  if(Array.isArray(s.STAFF)) STAFF = s.STAFF;
  if(s.GYM_HOURS) GYM_HOURS = s.GYM_HOURS;
  if(Array.isArray(s.TURNOS)) TURNOS = s.TURNOS;
  if(typeof s.turnoSeq==='number') turnoSeq = s.turnoSeq;
  if(Array.isArray(s.notifStaff)) notifStaff = s.notifStaff;
  if(s.notifSocio) notifSocio = s.notifSocio;
  if(typeof s.entradasHoy==='number') entradasHoy = s.entradasHoy;
  if(s.collapsedGroups) collapsedGroups = s.collapsedGroups;
  if(typeof s.DUENO_EMAIL==='string') DUENO_EMAIL = s.DUENO_EMAIL;
}

let persistTimer = null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    sb.from('app_state').upsert({id:1, data: snapshotState(), updated_at: new Date().toISOString()}).then(({error})=>{
      if(error) console.error('Error guardando en Supabase:', error);
    });
  }, 500);
}

async function loadState(){
  try{
    const {data, error} = await sb.from('app_state').select('data').eq('id',1).single();
    if(error){ console.error('Error cargando de Supabase:', error); return; }
    if(data && data.data) applyState(data.data);
  }catch(e){
    console.error('Error cargando de Supabase:', e);
  }
}

/* ============ QR SCAN FLOW ============ */
function startScan(){
  $('#scan').classList.remove('hidden');
  $('#scanStep1').classList.remove('hidden');
  $('#scanStep2').classList.add('hidden');
  setTimeout(()=>finishScan(), 1800);
}

function finishScan(){
  const t = pendingQR || {tipo:'general'};
  const hora = nowTime();
  let socio;
  if(currentRole==='socio'){
    socio = SOCIOS[currentSocioIdx];
  } else {
    // staff simulating: pick a random socio that hasn't entered, fallback first
    socio = SOCIOS.find(s=>!s.hoy) || SOCIOS[0];
  }
  socio.hoy = true;
  socio.entradaHora = hora;
  entradasHoy++;
  REGS.unshift({i:socio.i, n:socio.n, h:hora, cl:t.clase||null, f:new Date().toISOString()});

  const idx = SOCIOS.indexOf(socio);
  const detail = t.clase ? `Clase: ${t.clase}` : 'Entrada general';
  notifStaff.unshift({txt:`${socio.n} registró su entrada (${detail}) a las ${hora}`, new:true});
  notifSocio[idx] = notifSocio[idx]||[];
  notifSocio[idx].unshift({txt:`Tu entrada fue registrada a las ${hora}. ${detail}`, new:true});

  $('#scanStep1').classList.add('hidden');
  $('#scanStep2').classList.remove('hidden');
  $('#scanName').textContent = `✅ ${socio.n}`;
  $('#scanDetail').textContent = detail;
  $('#scanTime').textContent = `Hora: ${hora}`;

  if(staffPage==='qr') renderStaff();
  else persist();
  updateNotifDots();
}

function closeScan(){
  $('#scan').classList.add('hidden');
  pendingQR = null;
  if(currentRole==='socio'){
    $('#socio').classList.remove('hidden');
    renderSocio();
  } else if($('#staff').classList.contains('hidden') && $('#login').classList.contains('hidden')){
    // came from login qr@gym.com simulation -> go to login
    $('#login').classList.remove('hidden');
  } else {
    renderStaff();
  }
}

/* ---- PANEL ---- */
function parseMonto(m){
  const n = parseInt(String(m||'').replace(/[^\d]/g,''),10);
  return isNaN(n) ? 0 : n;
}
function fmtMonto(n){ return '$'+n.toLocaleString('es-AR'); }
function ingresosUltimosMeses(n){
  const out = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const total = PAGOS.filter(p=>{ const pd=new Date(p.f); return !isNaN(pd) && pd.getMonth()===d.getMonth() && pd.getFullYear()===d.getFullYear(); }).reduce((a,p)=>a+parseMonto(p.m),0);
    out.push({label: d.toLocaleDateString('es-AR',{month:'long'}), total});
  }
  return out;
}
function pagePanel(){
  const activos = SOCIOS.filter(s=>s.activo).length;
  const vencidos = SOCIOS.filter(s=>s.es==='de').length;
  let metrics = `
    <div class="metric"><div class="num">${activos}</div><div class="lbl">Socios activos</div></div>
    <div class="metric"><div class="num">${entradasHoy}</div><div class="lbl">Entradas hoy</div></div>
    <div class="metric"><div class="num">${CLASES_HOY.length}</div><div class="lbl">Clases hoy</div></div>
    <div class="metric"><div class="num">${vencidos}</div><div class="lbl">Pagos vencidos</div></div>
  `;
  if(currentRole==='profesor'){
    const st = currentStaff();
    const misClases = st ? CLASES_HOY.filter(c=>c.ins===st.n).length : 0;
    metrics = `
    <div class="metric"><div class="num">${misClases}</div><div class="lbl">Clases hoy</div></div>
    <div class="metric"><div class="num">${entradasHoy}</div><div class="lbl">Entradas hoy</div></div>
    `;
  }
  return `
  <div class="grid-metrics">${metrics}</div>
  <div class="card" style="margin-bottom:18px;">
    <h3>Últimas entradas por QR</h3>
    <table><thead><tr><th>Nombre</th><th>Hora</th><th>Detalle</th></tr></thead>
    <tbody>${REGS.slice(0,8).map(r=>`<tr><td>${esc(r.n)}</td><td>${r.h}</td><td>${r.cl?`<span class="badge b-purple">${esc(r.cl)}</span>`:'Entrada general'}</td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--text2);">Sin entradas todavía</td></tr>'}</tbody></table>
  </div>
  ${currentRole!=='profesor'?(()=>{
    const meses = ingresosUltimosMeses(3);
    const max = Math.max(1, ...meses.map(x=>x.total));
    return `
  <div class="card">
    <h3>Ingresos</h3>
    ${meses.map(m=>`<div class="bar-row"><div class="lbl">${m.label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(m.total/max*100)}%"></div></div><div>${fmtMonto(m.total)}</div></div>`).join('')}
  </div>`;
  })():''}
  `;
}

async function saveNuevoStaff(role){
  const titles = {dueno:'Nuevo dueño', admin:'Nuevo admin', profesor:'Nuevo profesor'};
  const n = $('#st_n').value.trim()||titles[role];
  const email = $('#st_email').value.trim().toLowerCase();
  const pass = $('#st_pass').value;
  const esp = role==='profesor' ? ($('#st_esp').value.trim()||null) : null;
  const err = $('#st_err');
  if(!email){ err.textContent='Ingresá un email válido.'; return; }
  if(!pass || pass.length<6){ err.textContent='La contraseña debe tener al menos 6 caracteres.'; return; }
  if(STAFF.find(s=>s.email===email)){ err.textContent='Ya existe una cuenta con ese email.'; return; }
  const {data:{session:adminSession}} = await sb.auth.getSession();
  const {error} = await sb.auth.signUp({email, password:pass, options:{data:{nombre:n, role}, emailRedirectTo:APP_URL}});
  if(error){ err.textContent = error.message; return; }
  if(adminSession) await sb.auth.setSession({access_token:adminSession.access_token, refresh_token:adminSession.refresh_token});
  const id = 'st_'+Date.now();
  STAFF.push({id, n, email, role, esp, perms:{verPagos:false,cargarPagos:false,cargarSocios:false,removerSocios:false,editarSocios:false,editarFichas:false,clases:false,editarRutinas:false,asignarRutinas:false,cargarEjercicios:false,horarios:false,cuentas:false}});
  persist();
  closeModal();
  alert(`Cuenta creada. ${n} ya puede ingresar con su email (${email}) y la contraseña que definiste.`);
  renderStaff();
}

function saveEditSocio(idx){

  s.n = $('#es_n').value.trim()||s.n;

  const newEmail = $('#es_email').value.trim().toLowerCase();
  s.email = newEmail||null;
  s.tel = $('#es_tel').value.trim()||null;
  s.cumple = $('#es_cumple').value || null;
  s.ed = s.cumple ? calcAge(s.cumple) : (parseInt($('#es_ed').value)||s.ed);

  if(newEmail) SOCIOS_LOGIN[newEmail] = {...(SOCIOS_LOGIN[newEmail]||{pe:'ok',pm:''}), idx};
  closeModal(); renderStaff();
}

function saveClase(){

  const d=$('#cl_d').value.trim();
  const h=$('#cl_h').value||'08:00';
  const insSel = $('#cl_ins').value;

  if(editClaseIdx!==null){
    const c = CLASES_HOY[editClaseIdx];

    Object.assign(c, {n,d,h,ins,cu:`${entradas}/${cupo}`});

  closeModal(); renderStaff();

function deleteClase(idx){

  CLASES_HOY.splice(idx,1);
  persist();
  renderStaff();
}

function asignarRutina(si, rname, idx, search){

function quitarRutina(si, rname, idx, search){
  const s = SOCIOS[si];
  s.rs = s.rs.filter(r=>r!==rname);
  persist();
  openAsignarModal(idx, search);
}

let newRutinaEjs = [{n:'',s:3,r:'10'}];
let editRutinaIdx = null;

  if(editRutinaIdx!==null){

function removeRutinaEj(i){ newRutinaEjs.splice(i,1); renderRutinaModalBody(); }
function saveRutina(){
  const n = $('#rt_n').value.trim()||'Nueva rutina';
  const t = $('#rt_t').value;
  const ob = $('#rt_ob').value;
  const ejs = newRutinaEjs.filter(e=>e.n).map(e=>({n:e.n,s:parseInt(e.s)||3,r:e.r,v:''}));

    if(r.n!==n) SOCIOS.forEach(s=>{ s.rs = s.rs.map(x=>x===r.n?n:x); });

    RUTINAS.push({n, t, ob, cr:'Tú', ejs});

/* ---- HORARIOS (vista semanal tipo calendario) ---- */
function canEditHorarios(){ return isSuperOwner() || hasPerm('horarios'); }
const CAL_START = 6;   // 06:00
const CAL_END = 23;    // 23:00
const CAL_PXH = 36;    // px por hora
function hToMin(h){ const [hh,mm]=h.split(':').map(Number); return hh*60+mm; }
function staffColor(id){
  const idx = STAFF.findIndex(s=>s.id===id);
  return TURNO_COLORS[idx>=0?idx%TURNO_COLORS.length:0];
}
function pageHorarios(){
  const canEdit = canEditHorarios();
  const profes = STAFF.filter(s=>s.role==='profesor' || s.role==='admin');
  const totalH = CAL_END-CAL_START;
  return `
  <div class="card" style="margin-bottom:18px;">
    <h3>Horario del gimnasio</h3>
    <table><thead><tr>${DIAS_SEMANA.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
    <tbody><tr>${DIAS_SEMANA.map(d=>{
      const h = GYM_HOURS[d];
      if(canEdit){
        return `<td style="min-width:150px;">
          ${h.map((tr,i)=>`<div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
            <input type="time" step="300" value="${tr.desde}" style="width:82px;" onchange="saveGymHour('${d}',${i},'desde',this.value)">
            <span style="color:var(--text2);">-</span>
            <input type="time" step="300" value="${tr.hasta}" style="width:82px;" onchange="saveGymHour('${d}',${i},'hasta',this.value)">
            <button class="btn btn-outline btn-sm" style="padding:2px 7px;" onclick="removeGymTramo('${d}',${i})">×</button>
          </div>`).join('')}
          <button class="btn btn-outline btn-sm" onclick="addGymTramo('${d}')">+ tramo</button>
        </td>`;
      }
      return `<td>${h.length?h.map(tr=>`${tr.desde} - ${tr.hasta}`).join('<br>'):'<span style="color:var(--text2)">Cerrado</span>'}</td>`;
    }).join('')}</tr></tbody></table>
  </div>
  <div class="card">
    <div class="section-head"><h3 style="margin:0;">Semana — turnos y clases</h3>
      ${canEdit?`<button class="btn btn-primary btn-sm" onclick="openTurnoModal()"><i class="ti ti-plus"></i>Nuevo turno / clase</button>`:''}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
      ${profes.map(p=>`<span class="badge" style="background:${staffColor(p.id)}22;color:${staffColor(p.id)};"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${staffColor(p.id)};margin-right:5px;"></span>${esc(p.n)}</span>`).join('')}
    </div>
    <div class="cal-wrap">
      <div class="cal-grid" style="grid-template-columns:54px repeat(7,1fr);">
        <div class="cal-corner"></div>
        ${DIAS_SEMANA.map(d=>`<div class="cal-daylabel">${d}</div>`).join('')}
        <div class="cal-hours" style="grid-row:2;grid-column:1;height:${totalH*CAL_PXH}px;">
          ${Array.from({length:totalH+1},(_,i)=>`<div class="cal-hour" style="height:${CAL_PXH}px;">${String(CAL_START+i).padStart(2,'0')}:00</div>`).join('')}
        </div>
        ${DIAS_SEMANA.map((d,di)=>{
          const turnos = TURNOS.filter(t=>t.dia===d);
          return `<div class="cal-daycol" style="grid-row:2;grid-column:${di+2};height:${totalH*CAL_PXH}px;" ${canEdit?`onclick="if(event.target===this) openTurnoModal(null,'${d}')"`:''}>
            ${Array.from({length:totalH},()=>`<div class="cal-hourline" style="height:${CAL_PXH}px;"></div>`).join('')}
            ${turnos.map(t=>{
              const st = STAFF.find(s=>s.id===t.staffId);
              const top = (hToMin(t.desde)-CAL_START*60)/60*CAL_PXH;
              const h = Math.max(18,(hToMin(t.hasta)-hToMin(t.desde))/60*CAL_PXH);
              const col = staffColor(t.staffId);
              const bg = t.clase ? `${col}cc` : `${col}22`;
              const fg = t.clase ? '#fff' : col;
              return `<div class="cal-event" style="top:${top}px;height:${h}px;background:${bg};border-left:3px solid ${col};color:${fg};" ${canEdit?`onclick="event.stopPropagation();openTurnoModal(${t.id})"`:''}>
                ${t.clase?`<b>${esc(t.clase)}</b><br>${esc(st?st.n:'-')}`:`<b>${esc(st?st.n:'-')}</b>`}<br>${t.desde}-${t.hasta}
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  `;
}
function saveGymHour(dia,idx,campo,val){ GYM_HOURS[dia][idx][campo]=val; persist(); }
function addGymTramo(dia){ GYM_HOURS[dia].push({desde:'09:00',hasta:'18:00'}); renderStaff(); }
function removeGymTramo(dia,idx){ GYM_HOURS[dia].splice(idx,1); renderStaff(); }
function openTurnoModal(turnoId,presetDia){
  const t = turnoId?TURNOS.find(x=>x.id===turnoId):null;
  const profes = STAFF.filter(s=>s.role==='profesor' || s.role==='admin');
  openModal(`
    <div class="modal-head"><h3>${t?'Editar':'Nuevo turno / clase'}</h3><button onclick="closeModal()">✕</button></div>

function renderQRInto(boxId, text, opts){
  const box = document.getElementById(boxId);
  if(!box) return;
  box.innerHTML = '';
  const canvas = document.createElement('canvas');
  box.appendChild(canvas);
  if(typeof QRCode === 'undefined'){ box.innerHTML = '<p style="color:var(--red);font-size:12px;">No se pudo cargar el generador de QR. Revisá tu conexión y recargá la página.</p>'; return; }
  QRCode.toCanvas(canvas, text, opts, (err)=>{ if(err){ console.error('Error generando QR:', err); box.innerHTML = '<p style="color:var(--red);font-size:12px;">No se pudo generar el QR.</p>'; } });
}

function calcAge(birthStr){
  const b = new Date(birthStr+'T00:00:00');
  if(isNaN(b)) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const hadBirthdayThisYear = (now.getMonth()>b.getMonth()) || (now.getMonth()===b.getMonth() && now.getDate()>=b.getDate());
  if(!hadBirthdayThisYear) age--;
  return age;
}

  return s.cumple ? calcAge(s.cumple) : s.ed;

  openModal(`
    <div class="modal-head"><h3>${d.d} — ${esc(d.g)}</h3><button onclick="closeModal()">✕</button></div>
    ${d.e.map((e,i)=>`<div class="ej-row"><span>${esc(e)} <span style="color:var(--text2);">(${d.s[i]}x${esc(d.r[i])})</span></span>${d.v[i]?`<a href="${esc(d.v[i])}" target="_blank"><i class="ti ti-brand-youtube" style="color:#DC2626;"></i></a>`:''}</div>`).join('')}
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cerrar</button></div>
  `);
}

function calcRacha(misRegs){
  // racha = días consecutivos (contando desde hoy hacia atrás) con al menos una entrada
  const dias = new Set(misRegs.filter(r=>r.f).map(r=>new Date(r.f).toDateString()));
  let racha = 0;
  const cursor = new Date();
  while(dias.has(cursor.toDateString())){
    racha++;
    cursor.setDate(cursor.getDate()-1);
  }
  return racha;
}
function socioAsistencia(){
  const s = SOCIOS[currentSocioIdx];
  const misRegs = REGS.filter(r=>r.i===s.i);
  const hoy = new Date();
  const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  const inicioSemana = new Date(hoy); inicioSemana.setDate(hoy.getDate()-hoy.getDay());
  const esteMes = misRegs.filter(r=>r.f && new Date(r.f)>=inicioMes).length;
  const estaSemana = misRegs.filter(r=>r.f && new Date(r.f)>=inicioSemana).length;
  const racha = calcRacha(misRegs);
  return `
  <h2>Asistencia</h2>
  <div class="grid-metrics">
    <div class="metric"><div class="num">${racha}</div><div class="lbl">Racha (días seguidos)</div></div>
    <div class="metric"><div class="num">${estaSemana}</div><div class="lbl">Esta semana</div></div>
    <div class="metric"><div class="num">${esteMes}</div><div class="lbl">Este mes</div></div>
    <div class="metric"><div class="num">${misRegs.length}</div><div class="lbl">Total histórico</div></div>
  </div>
  <div class="card">
    <h3>Historial</h3>
    ${misRegs.map(r=>`<div class="day-row"><span>${r.cl?esc(r.cl):'Entrada general'}</span><span>${r.h}</span></div>`).join('')||'<p style="color:var(--text2);font-size:13px;">Sin registros aún</p>'}
  </div>`;
}

function socioCuenta(){
  const s = SOCIOS[currentSocioIdx];
  const payTxt = {ok:'Tu pago está al día',ve:'Tu pago está por vencer',de:'Tienes un pago vencido'}[s.es];
  const payClass = {ok:'b-ok',ve:'b-warn',de:'b-err'}[s.es];
  return `
  <h2>Cuenta</h2>
  <div class="pay-banner ${payClass}">${payTxt}</div>
  <div class="card">
    <h3>Historial de pagos</h3>
    ${PAGOS.filter(p=>p.n===s.n).map(p=>`<div class="day-row"><div><b>${esc(p.t)}</b><div style="font-size:12px;color:var(--text2);">${p.f}</div></div><div>${esc(p.m)}</div></div>`).join('')||'<p style="color:var(--text2);font-size:13px;">Sin pagos registrados</p>'}
  </div>`;
}

/* ============ ARRANQUE: cargar datos guardados antes de mostrar el login ============ */
(async function init(){
  $('#login').classList.add('hidden');
  document.body.insertAdjacentHTML('beforeend', '<div id="loadingOverlay" style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary);z-index:999;">Cargando datos...</div>');
  await loadState();
  $('#loadingOverlay').remove();

  const urlParams = new URLSearchParams(window.location.search);
  const qrType = urlParams.get('qr'); // 'general' | 'clase' (escaneado con la cámara del celular)
  const isStaffQR = urlParams.get('staff')==='1';
  if(qrType || isStaffQR){
    if(qrType) pendingQR = {tipo: qrType, clase: urlParams.get('nombre')||null};
    window.history.replaceState({}, '', window.location.pathname);
  }

  const {data:{session}} = await sb.auth.getSession();
  if(session && session.user && session.user.email){
    await routeLoggedInUser(session.user.email);
    if(pendingQR && currentRole==='socio') startScan();
  } else if(isStaffQR){
    openStaffGate();
  } else if(pendingQR){
    openQRGate();
  } else {
    $('#login').classList.remove('hidden');
    renderLogin();
  }
})();
</script>
